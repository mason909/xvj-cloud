            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="退出到桌面：释放全部窗口，把系统桌面顶到身前。设备仍在线，配置与素材都不动，进程与 MQTT 保持（本机鼠标左键连点 5 下是同一个动作）" onclick="sendDeviceCommand(\'' + escJsA(d.id) + '\',\'exit_desktop\',\'退出到桌面\',' + (isOnline ? 'true' : 'false') + ')">退出到桌面</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="唤回画面：设备用 root 把自己顶回前台，按本机那份配置缓存重建画面。没有 root 时只放开闸门，需要现场按 HOME 键或点桌面图标。不在退出态则无变化" onclick="sendDeviceCommand(\'' + escJsA(d.id) + '\',\'reopen_desktop\',\'唤回画面\',' + (isOnline ? 'true' : 'false') + ')">唤回画面</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="实时截图：让设备把此刻落屏的画面抓回来显示在这里（不是实时视频，是点一次拿一张）。设备需要在线；没等到图去设备日志页看原因" onclick="deviceScreenshot(\'' + escJsA(d.id) + '\',' + (isOnline ? 'true' : 'false') + ')">实时截图</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" disabled title="副屏（1080/eDP）暂不启用：显示改造为单口全幅后，1080 口由设备启动看护常关，开启也没有内容">副屏：停用</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="不看 rev 强制整房重新同步（素材清单 + 窗口 + 映射全量下发，会重建播放器）" onclick="sendDeviceCommand(\'' + escJsA(d.id) + '\',\'sync\',\'强制同步\',' + (isOnline ? 'true' : 'false') + ')">强制同步</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="把版本管理里的最新版推给这台设备（OTA）" onclick="pushUpdate(\'' + escJsA(d.id) + '\')">推最新版</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="重启整台设备（root reboot，不是重启 APK）：画面会中断，约 30~60 秒后开机自启回到播放。无 root 的机器会拒绝并在设备日志留一行" onclick="rebootDevice(\'' + escJsA(d.id) + '\',' + (isOnline ? 'true' : 'false') + ')">重启设备</button>';
            h += '<button class="btn btn-secondary" style="padding:2px 8px;font-size:var(--fs-micro)" title="解除这台机与本房的绑定（设备回到「[U]未注册设备」，需要重新授权才能再绑）" onclick="unbindRoom(\'' + escJsA(d.id) + '\')">解绑</button>';
            h += '</div>';
            h += '</div>';
        });
        h += '</div>';
    } else {
        h += '<div class="empty" style="margin-top:8px;padding:22px">这间房还没有已授权设备。设备开机联网后会出现在「[U]未注册设备」里，在那里授权即可。</div>';
    }
    
    // 墙板表/播放设置表把 01~30 摊成行、A/B 摊成列，文件夹 tab 和场景切换在这两屏上是重复入口
    var hideTabs = (s._windowEditorActive || s._wpMode || s._psMode || s._logoMode) ? 'display:none' : '';

    // 场景选择器（第一幕/第二幕）
    var curS = s._curScene || 'A';
    h += '<div style="margin-top:8px;' + (hideTabs ? 'display:none' : 'display:flex;gap:8px;align-items:center;flex-wrap:wrap') + '">';
    h += '<span class="wb-cap-inline">场景</span>';
    h += '<button class="btn btn-sm ' + (curS==='A'?'btn-primary':'btn-secondary') + '" onclick="switchScene(\'A\')">' + ((function(){
        try{var c=typeof r.config==='string'?JSON.parse(r.config):(r.config||{});return(c.scenes&&c.scenes.A)?esc(c.scenes.A.name):'第一幕';}catch(e){return '第一幕';}})() + '</button>');
    h += '<button class="btn btn-sm ' + (curS==='B'?'btn-primary':'btn-secondary') + '" onclick="switchScene(\'B\')">' + ((function(){
        try{var c=typeof r.config==='string'?JSON.parse(r.config):(r.config||{});return(c.scenes&&c.scenes.B)?esc(c.scenes.B.name):'第二幕';}catch(e){return '第二幕';}})() + '</button>');
    h += '</div>';
    
    // 获取当前场景的 folder_mappings
    var sceneFM = {};
    try {
        var _rc2 = typeof r.config === 'string' ? JSON.parse(r.config) : (r.config || {});
        sceneFM = (_rc2.scenes && _rc2.scenes[curS] && _rc2.scenes[curS].folder_mappings) || {};
    } catch(e) {}
    
    h += '<div class="tabs" style="margin-top:10px;' + hideTabs + '">';
    for (var i = 1; i <= 30; i++) {
        var f = i.toString().padStart(2, '0');
        var act = s.f === f ? 'active' : '';
        var ms = sceneFM[f] || [];
        h += '<div class="tab ' + act + '" onclick="sf(\'' + f + '\')"><span class="tab-n">' + f + '</span><span class="tab-d">' + (ms.length > 0 ? ms.length : '+') + '</span></div>';
    }
    h += '</div>';
    // Phase2: 窗口编辑器区域（文件夹tab下方或替代）
    h += '<div id="winEditorArea" style="display:' + (s._windowEditorActive ? 'block' : 'none') + '"></div>';
    // 同步按钮已并入下方「已映射素材」工具条，与映射按钮同一行
    
    // 墙板模式：整块工作台换成配置表。和窗口/截取互斥（见 sfWP），素材目录的 DOM 不并存 ——
    // 两套「读整份 config → 改自己的键 → PUT 回去」的入口同屏，后保存的那个会把先保存的抹掉
    if (s._wpMode) {
        g.innerHTML = h;
        updateRoomDebugToggle();
        renderWpEditor();
        return;
    }

    // 播放设置模式：与墙板表同一套互斥理由（两套「读整份 config → 改自己的键 → PUT 回去」不同屏）
    if (s._psMode) {
        g.innerHTML = h;
        updateRoomDebugToggle();
        renderPsEditor();
        return;
    }

    // LOGO 设置模式：同样独占整块工作区（它也是「读整份 config → 改 logo → PUT 回去」）
    if (s._logoMode) {
        g.innerHTML = h;
        updateRoomDebugToggle();
        renderLogoEditor();
        return;
    }
    
    // Phase2: 窗口模式下直接渲染编辑器，不要继续构建任何HTML
    if (s._windowEditorActive) {
        g.innerHTML = h;
        renderWinEditorFull();
        // 开关 DOM 是刚重建的（一律"关"），必须在这里补一次显示态，否则窗口模式下看不到云端 config.debug
        updateRoomDebugToggle();
        return;
    }
    
    // 以下是文件夹模式的内容，只在非窗口模式时渲染
    
    var ms = sceneFM[s.f] || [];
    // 只显示已映射的素材
    var all = [];
    var unresolved = [];
    if (ms && ms.length > 0) {
        ms.forEach(function(mid) {
            // 先从预设素材查找
            var m = s.pm ? s.pm.find(function(x) { return x.id === mid }) : null;
            // 再从素材库查找（「推送到房间」写的就是素材库 id，两条路都可能进映射）
            if (!m) m = s.ms.find(function(x) { return x.id === mid });
            if (m) all.push({id: m.id, filename: m.filename || m.name, url: m.url, type: m.type, thumbnail: m.thumbnail});
            else unresolved.push(mid);
        });
    }
    // 两个入口分开，别再让"点一下"和"整库灌入"是同一件事：
    // 前者跟着上方选中的 01-30 标签走（停在 03 就只灌 03），后者是显式的批量动作、要二次确认。
    // 中间的状态条是"上一次单击发给了哪扇窗 / 为什么没发出去"的记录（见 pvMat），不代表此刻屏上真在播 ——
    // 下发是单向 MQTT，设备端的实情只在「日志」页上看得到（运维浮层仍只认 debug）。
    // 这一条只占一行：状态条吃剩余宽度并省略，按钮不压缩不换行（窄屏时宁可状态条被截短）
    var h2 = '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:nowrap">'
        + '<span style="font-weight:bold;white-space:nowrap;flex:0 0 auto">已映射素材</span>'
        + '<span style="display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap">'
        + '<span id="pvBar" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + _pvBarHtml() + '</span>'
        + '<button class="btn btn-sync" style="padding:5px 12px;font-size:var(--fs-meta);flex:0 0 auto" onclick="syncCurrentRoom()" title="让设备照着当前清单重新下一遍。配置改动一般会自己下发，这颗是手工补一次。">🔄 同步当前房间</button>'
        + '<button class="btn btn-primary" style="padding:5px 15px;font-size:var(--fs-meta);flex:0 0 auto" title="只映射上方当前选中的 ' + esc(s.f || '') + ' 文件夹" onclick="mapPreset()">映射本文件夹预设</button>'
        + '<button class="btn btn-sync" id="folderCopyBtn" style="padding:5px 10px;font-size:var(--fs-meta);flex:0 0 auto" title="把当前场景、当前文件夹 ' + esc(s.f || '') + ' 的素材清单覆盖到本店所有房间的同名文件夹（完全同步：多删少补、顺序一致；目标多出的素材会被移除）" onclick="copyFolderAll()">全局复制</button>'
        + '<button class="btn" style="padding:5px 10px;font-size:var(--fs-meta);background:#6c757d;color:#fff;flex:0 0 auto" title="把预设库 01-30 全部映射进当前场景，设备会照着清单整个下一遍（量大，会重建播放器）" onclick="mapPreset(\'ALL\')">映射整库</button>'
        + '</span></div>';
    h2 += '<div class="mm-grid">';
    if (all.length === 0) {
        // 分清楚"真没映射"和"映射了但查不到记录"：前者提示去映射，后者是悬空引用
        // （素材/预设被删而映射还在，或服务端读列表失败），显示成"无素材"会把人引去重复映射。
        h2 += unresolved.length
            ? '<div class="empty">映射里有 ' + unresolved.length + ' 条记录在素材库和预设库里都查不到（悬空引用）：'
              + esc(unresolved.slice(0, 5).join('、')) + (unresolved.length > 5 ? ' 等' : '')
              + '。设备侧清单会跳过这些 id，点「🔄 同步当前房间」让它们对齐。</div>'
            : '<div class="empty">这一格还没有映射素材。点右上角「映射本文件夹预设」，把预设库 ' + esc(s.f || '') + ' 灌进来。</div>';
    }
    else {
        // 单击视频卡片即在大屏上播一遍（2026-11-08 用户定调：不要专门按钮、不要弹窗、不挂调试模式）。
        // 图片素材不给点击 —— 设备端播放链压根不认它，点了只会换来一条拒绝。
        all.forEach(function(m) {
            var name = String(m.filename || m.url || m.id);   // filename 老数据可能为 null，直接 .match 会抛停半屏
            // 视频判定复用设备播放链那张表（_pvDevExtRe）：原来这里另写了一份、漏了 mkv，
            // 于是 .mkv 素材被当图片渲染成 <img src="….mkv">（裂图标）却仍然给试播入口 —— 两处口径必须一份。
            // 但扩展名要问 url，不能只问 name：/api/materials 把库里的 name 列当 filename 发出来（【S-02】的
            // formatted），而新上传的 name 是去掉扩展名的显示名（"DJ二维码"）—— 只看 name 会让刚传进来的素材
            // 在房间网格里没有单击入口（卡片点不动），而服务端那条链其实是通的（它按 filename 列判，见 preparePreview）。
            // url 最后一段永远带真扩展名（落盘名由 buildSafeUploadName 保留原扩展），所以两个都试。
            var onDevice = _pvOnDevice(name) || _pvOnDevice(m.url);
            var type = m.type || (onDevice ? 'video' : 'image');
            var thumbUrl = m.thumbnail ? (m.thumbnail.startsWith('/') ? m.thumbnail : m.thumbnail) : null;
            var t = type === 'video' ? (thumbUrl ? '<img src="' + escA(thumbUrl) + '">' : '<div class="card-thumb">▶</div>') : (m.url ? '<img src="' + escA(m.url) + '">' : '<div class="card-thumb">?</div>');
            var playable = onDevice;
            h2 += '<div class="card"' + (playable
                ? ' data-pv-mid="' + escA(m.id) + '" style="cursor:pointer" title="单击：在这扇窗对应的设备画面上播一遍，播完自动回到原画面（只播设备本机已有的素材，不改任何配置）" onclick="pvMat(\'' + escJsA(m.id) + '\')"'
                : '') + '><button class="card-del" title="从这间房移除该素材（会通知设备）" onclick="rmRoomMat(event,\'' + escJsA(m.id) + '\')">×</button><div>' + t + '</div><div class="card-name" title="' + escA(name) + '">' + esc(name) + '</div></div>';
        });
    }
    h2 += '</div>';
    h += h2;
    g.innerHTML = h;
    refreshPvCards();
    // 应用调试模式的显示状态（一律取云端 config.debug，见 _roomDebugOn）
    // 窗口模式分支在上面 return 前也各自调了一次，两条路径都不会漏。
    updateRoomDebugToggle();
}

// ============================================================================
// 🪟 窗口配置模块（工作台「窗口配置」模式；编辑器入口见【F-09】）
//
// 【架构】
// 每个房间有 A（第一幕）和 B（第二幕）两套完全独立的配置，互不影响。
//   scenes.A.folder_mappings：场景 A 的素材映射（{文件夹ID: [素材ID列表]})
//   scenes.B.folder_mappings：场景 B 的素材映射
//   scenes.A.windows：场景 A 的窗口布局列表（位置/尺寸/内容）
//   scenes.B.windows：场景 B 的窗口布局列表
//   scenes[X].master.brightness：该幕总亮度，与每扇窗自己的 brightness 相乘
//   scenes[X].play_settings：该幕「文件夹 → 播放顺序」设置表（编辑面见【F-06g】）
//   config.wallpanel_bindings：房间级「帧码 → 文件夹」学习绑定表 [{frame, folder, source}]，
//     一格最多三路码（点歌机 / 墙板 / 自定义），不分幕（编辑面见【F-06f】；没有编号体系，墙板上每按下一个键
//     学到的码直接对一格文件夹）
//
// 【与外部信号的关系】
// 墙板/点歌机 RS485 帧 → 查 wallpanel_bindings 里学过的那条码 → content.follow 的窗口切到对应文件夹播放
// （同一码在 A/B 两幕切同一格；source 只是给人看的分列标签，设备端只认帧→格）
// 没学过的键 = 画面不动（没有按编号推算的兜底，学都没学过就无从知道该播哪格）
// Scene A/B 是用户预先设定的内容标签，永久执行，不随外部信号切换
//
// 【scene-prefixed folder ID】
// MQTT 发送时 folder_mappings / play_settings 的文件夹键加幕前缀（A01, B01），
// APP 按前缀路由到 scenea/sceneb 子目录；windows 里的 content.folderId 仍是裸 "01"，由设备端解析时补前缀
//
// 【Bug 修复历史（2026-04-02）】
// Bug1: switchScene() 未调用 renderWinEditorFull() → 切换标签后编辑器列表/画布不更新
// Bug2: saveWindows() 后 s.rooms[idx].config 内存未同步 → 属性面板显示旧数据
// Bug3: updWinContent() 改完属性后无重渲染 → 面板和画布标签不刷新
//
// 窗口（Window）数据模型（与 rooms.config.scenes[sceneId].windows 对应）：
//   {
//     id: String,         // 唯一标识，如 "win_1"
//     name: String,        // 显示名，如 "主屏"
//     x: Number, y: Number, width: Number, height: Number,  // 位置和尺寸（px，写在这间房的输出基准坐标系里；config.output 没设时是 1920x1080 设计稿，设备按 屏宽/基准宽、屏高/基准高 两轴换算）
//     zIndex: Number,     // 层级，越大越上层
//     aspectRatio: String | null,  // 可选，如 "16:9"
//     opacity: Number,    // 0..1，窗口透明度（Arena Slice Input Opacity）
//     brightness: Number, // 0..1，窗口亮度，与所在幕 master.brightness 相乘
//     enabled: Boolean,   // 窗口显隐（false 时设备不建播放器）
//     flip: 'none'|'h'|'v',        // 内容镜像
//     rotation: 0|90|180|270,      // 内容在框内旋转
//     crop: { x, y, w, h },        // 输入截取 = Arena InputRect，素材画面内归一化 0..1 的取景区，
//                                  // 该区域拉伸填满窗口框（允许变形）；缺省即全画面 {0,0,1,1}
//     content: { type: 'SCENE_A'|'SCENE_B'|'HDMI'|'color', ... }   // 没有 IMAGE；颜色是小写 'color'
//       SCENE_*：folderId（裸文件夹号 "01"，没按过墙板时播的那格）+ follow（true = 播哪格由墙板学到的码决定）
//       HDMI：inputIndex；color：设备端固定铺满 testcard.jpg（测试图卡），color 字段仅图卡缺失时兜底。
//              'color' 只剩存量窗口，编辑器不再提供切入口 —— 对屏用的测试图卡改由顶层 config.window_testcard
//              浮层承担（打开窗口配置时自动覆盖每扇窗，关闭即撤）。字段全表以 server.js 头部 WinConfig 为准（服务端整体透传、不解析）
//   }
//
// 设备开机行为（APK applySceneConfigs）：
//   A 幕 windows 为空 → 自动补一个全屏窗口，播哪个文件夹由 A 幕 folder_mappings 里
//   第一个「有素材」的映射决定，不是写死 01
//   B 幕 windows 为空 → 保持黑屏，等待用户手动配置
//
// API 约定：
//   PUT /api/rooms/:id/windows  { windows: [WinConfig, ...], sceneId: 'A'|'B', master, live? }
//   返回 { success: true, scene: 'A'|'B', windows: [...] }
//   手动「保存并推送」= saveWindows() 不带 silent → 落库即可，服务端收敛点比对配置指纹后
//   按需给本房间设备发 update_windows（不再前端补 doSyncRoom 全量同步）；
//   属性/几何改动的 500ms 自动同步 = saveWindows(silent) 带 live:true → 只推 update_windows
//   轻通道（设备原地更新，不重建播放器、视频不从头播）。切幕/切房间前 flushAutoSync() 兜住最后一次编辑。

/** 切换当前编辑的场景（A = 第一幕，B = 第二幕）
 *  BugFix-20260402：末尾调用 renderWinEditorFull()，确保切换后编辑器列表和画布同步更新。
 *  之前 Bug：Header 显示"第二幕"激活，但 Body 继续显示 Scene A 的窗口列表。
 *
 *  保存/恢复机制：s._selWinMap 记录每个 scene 最后选中的窗口 ID，
 *  切换时 s._selWin 从新 scene 的 windows 数组中恢复，不再清空导致按钮失效。
 */

// 【工具函数】加载并隔离 room config：A/B windows 数组独立引用 + 补齐 scenes 骨架（含幕内缺字段）
// 凡是要写 cfg.scenes[X] 的入口都先过它（switchScene() 两个分支、addWin()）；
// selWin()/renderWinEditorFull()/saveWindows() 自己解析 r.config，再经 _getWinCache() 拿本房间本幕的 windows。
function _loadRoomCfg(r) {
    var c = {};
    try { c = r.config ? (typeof r.config === 'string' ? JSON.parse(r.config) : r.config) : {}; } catch(e) {}
    if (c.scenes && c.scenes.A && c.scenes.B && c.scenes.A.windows === c.scenes.B.windows) {
        c.scenes.A.windows = (c.scenes.A.windows || []).slice();
        c.scenes.B.windows = (c.scenes.B.windows || []).slice();
    }
    // 新房间 config='{}' 无 scenes 结构，切场景/写窗口前补齐骨架，避免 cfg.scenes[X] 抛 TypeError
    if (!c.scenes) c.scenes = {};
    ['A', 'B'].forEach(function (k) {
        var sc = c.scenes[k];
        var skeleton = { name: k === 'A' ? '第一幕' : '第二幕', folder_mappings: {}, windows: [], master: { brightness: 1 } };
        // 幕对象整个缺失或不是对象 -> 换骨架；存在但缺字段（手改过库、老数据只有 name）-> 逐字段补默认。
        // 只判缺失不够：下游每处 cfg.scenes.A.folder_mappings[id] 都会在下一次索引时抛 TypeError，
        // 而渲染函数没有分段 try，一处炸掉整块工作台就停在半屏。
        if (!sc || typeof sc !== 'object') { c.scenes[k] = skeleton; return; }
        if (!sc.folder_mappings || typeof sc.folder_mappings !== 'object') sc.folder_mappings = skeleton.folder_mappings;
        if (!Array.isArray(sc.windows)) sc.windows = skeleton.windows;
        if (!sc.master || typeof sc.master !== 'object') sc.master = skeleton.master;
    });
    return c;
}

// 【房间隔离】s._winCache 是「当前房间+当前幕」的窗口数组，凡是切房间都必须整体作废：
// 否则新房间会显示上一个房间的窗口，且任何一次编辑都会把上一房间的 windows PUT 进本房间（每台房间是独立设备）。
/** 窗口编辑器缓存的归属键 */
function _winCacheKey() { return (s.rf || '') + '|' + (s._curScene || 'A'); }
/** 唯一的 _winCache 写入口：连同归属键一起记 */
function _setWinCache(wins) { s._winCache = wins; s._winKey = wins ? _winCacheKey() : null; }
/** 取本房间本幕的 windows：归属键不符即丢弃缓存并回读本房间配置，绝不复用别房间的数据 */
function _getWinCache(cfg) {
    if (s._winKey !== _winCacheKey()) _setWinCache(null);
    if (s._winCache && s._winCache.length) return s._winCache;
    s._selWin = null;
    var wins = ((((cfg || {}).scenes) || {})[s._curScene || 'A'] || {}).windows || [];
    _setWinCache(wins.slice());
    return s._winCache;
}
/** 切房间时清掉上一房间的全部窗口编辑器状态（编辑器开关本身保留，重绘时会读新房间的数据）；返回 Promise，调用方 await 后才算真落库 */
async function _resetWinEditorState() {
    await flushAutoSync();     // 先落库最后一次编辑：此刻 s.rf 仍是旧房间，缓存也还是旧房间的窗口
                               //（定时器已由 flushAutoSync 清掉，不会到点后拿着新房间的键误判）
    _setWinCache(null);
    s._selWin = null; s._selWinMap = { A: null, B: null };
    s._cropRatioLock = {}; s._winRatioLock = {};
    _cropDrag = null; _dragging = null;
}

async function switchScene(id) {
    await flushAutoSync();   // 先把防抖里最后一次编辑落库（此时还认得旧幕），再切。
                             // 不 await 就是两条整份 config 的 PUT 交叠：服务端各读各写，后落的把先落的抹掉
    var oldS = s._curScene || 'A';
    s._selWinMap = s._selWinMap || { A: null, B: null };
    s._selWinMap[oldS] = s._selWin ? s._selWin.id : null; // 保存当前 scene 的选中窗口
    s._curScene = id;
    var newSelId = s._selWinMap[id]; // 取出切换后 scene 的选中窗口
    // 根据选中 ID 恢复 s._selWin（s._winCache 会在 renderWinEditorFull 中从 room.config 恢复）
    // 【BugFix-20260402-v2】始终对 windows 数组做浅拷贝，打破 A/B 共享引用链
    // 旧数据损坏形态：scenes.A.windows === scenes.B.windows（同一数组引用）
    // 不做拷贝会导致 addWin/push 操作同时污染两个场景

    if (newSelId) {
        var r = s.rooms.find(function(x) { return x.id === s.rf; });
        if (r) {
            var cfg = _loadRoomCfg(r);
            var sceneData = (cfg.scenes && cfg.scenes[id]) ? cfg.scenes[id] : {};
            var wins = (sceneData.windows || []).slice(); // ← 浅拷贝，打破共享引用
            // 记的选中 ID 可能已经不存在（别的标签页删掉了这个窗口）：Object.assign({}, null)
            // 会得到 {}，而 {} 是"真值"—— 编辑器以为有选中项，之后每次改动都写进这个幽灵对象，
            // 用户看到的是"改了没生效"。找不到就老老实实回到未选中。
            var foundWin = wins.find(function(w) { return w.id === newSelId; });
            s._selWin = foundWin ? Object.assign({}, foundWin) : null;
            _setWinCache(wins);
            cfg.scenes[id].windows = wins; // ← 用拷贝覆盖回去
            r.config = typeof r.config === 'string' ? JSON.stringify(cfg) : cfg;
        }
    } else {
        s._selWin = null;
        var r2 = s.rooms.find(function(x) { return x.id === s.rf; });
        if (r2) {
            var cfg2 = _loadRoomCfg(r2);
            var sceneData2 = (cfg2.scenes && cfg2.scenes[s._curScene]) ? cfg2.scenes[s._curScene] : {};
            var wins2 = (sceneData2.windows || []).slice(); // ← 浅拷贝
            _setWinCache(wins2);
            cfg2.scenes[s._curScene].windows = wins2; // ← 用拷贝覆盖回去
            r2.config = typeof r2.config === 'string' ? JSON.stringify(cfg2) : cfg2;
        }
    }
    rmDevice();
    if (s._selWin) s._winTab = _winKind(s._selWin);   // 唤起恢复的选中窗口后，列表落到它所属的那张卡
    renderWinEditorFull(); // 【Bug Fix】切换场景后重渲染编辑器Body，确保窗口列表和画布同步更新
}

// 【F-06e】 工作台模式开关与互斥
// 右侧工作区同一时刻只摆一样：窗口编辑器（输入截取画板依附于它）/ 墙板配置表 / 播放设置表。
// 打开任意一个之前先过 _exitTableModes() 把另两张表收掉；四张表的改动都是改动即落库，
// 没有"切走就丢"的草稿，所以这里不再弹确认框。
// 开关显示态以 rmDevice() 按 s 上的模式标志重画为准；sfCrop 是例外 —— 它不一定重渲染工作区，
// 所以自己就地补一次滑条底色/圆点（_exitCropMode 复位时同样走这套）。

/**
 * 窗口配置开关（点击"窗口配置"滑动条触发）
 * 开启 → 切换到 win 视图模式，渲染窗口编辑器
 * 关闭 → 切回普通文件夹模式（输入截取依附于窗口模式，一并退出）
 */
function sfW() {
    var wt = document.getElementById('winToggle');
    if (!wt) return;
    if (wt.checked) {
        // 开关 ON → 进入窗口模式，墙板表/播放设置表收起（它们的改动已经/正在自动落库）
        _exitTableModes();
        _exitLogoMode();
        s._windowEditorActive = true;
        s._selWin = null;
        if (!s._curScene) s._curScene = 'A';
        rmDevice();
    } else {
        // 开关 OFF → 切回文件夹模式
        s._windowEditorActive = false;
        _exitCropMode();
        rmDevice();
    }
}

/** 复位「输入截取」开关（滑条底色 + 圆点 + 复选框），供退出窗口模式/手动关闭时共用 */
function _exitCropMode() {
    s._cropMode = false;
    _cropDrag = null;
    var ct = document.getElementById('cropToggle');
    var cs = document.getElementById('cropSlider');
    var ck = document.getElementById('cropKnob');
    if (ct) ct.checked = false;
    if (cs) cs.style.background = '#444';
    if (ck) ck.style.left = '3px';
}

/**
 * 「输入截取」开关：打开 → 右侧换成每切片独属的 16:9 取景画板（Arena InputRect 语义）
 * 取景数据仍走窗口配置的同一份 windows / 自动同步通道，故打开时自动带上「窗口配置」。
 */
function sfCrop() {
    var ct = document.getElementById('cropToggle');
    if (!ct) return;
    // 打开取景要连带打开窗口配置，而窗口配置与墙板表/播放设置表互斥 → 先把那两张表收掉
    if (ct.checked) { _exitTableModes(); _exitLogoMode(); }
    s._cropMode = !!ct.checked;
    var cs = document.getElementById('cropSlider');
    var ck = document.getElementById('cropKnob');
    if (cs) cs.style.background = s._cropMode ? '#2ecc71' : '#444';
    if (ck) ck.style.left = s._cropMode ? '23px' : '3px';
    if (s._cropMode) {
        var wt = document.getElementById('winToggle');
        if (!s._windowEditorActive) {
            s._windowEditorActive = true;
            s._selWin = null;
            if (!s._curScene) s._curScene = 'A';
            if (wt) wt.checked = true;
            var ws = document.getElementById('winSlider'), wk = document.getElementById('winKnob');
            if (ws) ws.style.background = '#e94560';
            if (wk) wk.style.left = '23px';
            rmDevice();
        }
        var wea = document.getElementById('winEditorArea');
        if (wea) wea.style.display = 'block';
    }
    renderWinEditorFull();
}

// ============================================================================
// 【F-06f】墙板配置表（工作台「墙板配置」模式）
// 表形：行 = 文件夹 01~30（与素材目录同一把键），列 = A幕素材数 / B幕素材数 / 点歌机码 / 墙板码 / 自定义。
// 录码有两条路：键盘直接敲，或打开「墙板学习」→ 点某一列的码值框 → 按对应那颗键 →
// 码值自动填进那一列并当场保存。落库形状只有 config.wallpanel_bindings = [{frame, folder, source}]：
// 编号（panel_no）与默认编号已于 2026-11-13 整条删除；分幕录码同日删掉。
// 同一格可以录三个码（一路点歌机、一路墙板、一路自定义），谁按到都切到这一格，A/B 两幕通用。
// 串口参数（节点/波特率/字符格式）与串口总闸同样是改动即保存（500ms 防抖，见 _wpAutoSaveSoon）：
// 它们决定收不收得到帧，改错要能马上被设备用上，也能随时点「保存」立即落库。
// 第二条参数条是 DMX512 副板（另一条物理链路）：总闸/节点/波特率三项，设备只认通道 1，值 1:1 调格（值 N = 文件夹 NN），
// 哪些格接这一路由「播放设置」的 dmx 列决定（见服务端 roomDmxFields / APK DmxLink）。
// ============================================================================

// 串口硬件参数（与服务端 WALLPANEL_BAUDS / WALLPANEL_DEFAULT_PATH 同一份口径，改一边要改另一边）：
// 不同主板的 485 适配板挂在不同节点（ttyUSB0 / ttyS1 / ttyHSL0），波特率则要等现网抓包定档，
// 所以两个都做成房间级可配，填错在保存时就被服务端 400 拦下，不会静默回落成"设备自己猜"。
var WP_SERIAL_BAUDS = [1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200];
var WP_SERIAL_DEFAULT_PATH = '/dev/ttyUSB0';
var WP_SERIAL_PATH_RE = /^\/dev\/[A-Za-z0-9_-]{1,64}$/;
// 字符格式三档（与服务端 WALLPANEL_DATA_BITS/PARITIES/STOP_BITS、APK WallPanelLink 同一份）：
// 这三样还决定设备端的空闲断帧阈值（2 个字符时间），厂家固件默认档各不相同，必须能改。
var WP_SERIAL_DATA_BITS = [5, 6, 7, 8];
var WP_SERIAL_PARITIES = [
    { v: 'none', n: '无' }, { v: 'odd', n: '奇' }, { v: 'even', n: '偶' }
];
var WP_SERIAL_STOP_BITS = [1, 2];

// DMX512 副板（XM-Dmx1 那族）是另一条物理链路：速率档位更少、字符格式由副板固件定死 8N1，
// 所以这里只有总闸/节点/波特率三项（与服务端 DMX_BAUDS / DMX_DEFAULT_PATH / DMX_DEFAULT_BAUD、
// APK DmxLink 同一份口径）。副板一帧 20 路，设备只认通道 1，值 1:1 调格（值 N = 文件夹 NN）；哪些格接这一路在「播放设置」里开。
var DMX_BAUDS = [9600, 19200, 38400, 57600, 115200];
var DMX_DEFAULT_PATH = '/dev/ttyS4';
var DMX_DEFAULT_BAUD = 115200;

/**
 * 学习绑定表（config.wallpanel_bindings，与服务端 normalizeWallpanelBindings / APK WallPanelBindings 同一份）：
 * 一条规则 = 一个帧指纹（大写 hex）→ 一个文件夹，同一格允许三路码：点歌机一路、墙板一路、自定义一路。
 * 谁按到都切到这一格（A/B 共用，不分幕）。来源只是分列标签，设备端不知道也不判断帧是谁发的。
 * 帧指纹不认语义，所以别家厂家的帧也能学。上限与形状闸与服务端同尺（96 条、1~64 字节的偶数长度大写十六进制）。
 * 最小 1 字节：小麦那族功能码就是单字节（D3、B5 这种），两位 hex 必须能录能学。
 */
var WP_FRAME_HEX_RE = /^([0-9A-F]{2}){1,64}$/;
var WP_BINDINGS_MAX = 96;
var WP_SOURCES = [{ v: 'player', n: '点歌机码' }, { v: 'panel', n: '墙板码' }, { v: 'custom', n: '自定义' }];   // 一格的三个码值列
var WP_FOLDER_COUNT = 30;          // 格子只有 01~30（素材目录那一把尺）
var WP_LEARN_S_DEFAULT = 20;       // 学习窗长度：够走到墙板前按一下键（上限 60s 由服务端与设备端把关）
var WP_LEARN_POLL_MS = 1000;       // 等按键时的取帧间隔（设备侧每收到一帧就上报，1s 足够跟手）

/** 串口节点显示值：非法形状（老数据/手填脏值）一律回落到默认节点，跟服务端 roomWallpanelFields 同口径 */
function _wpPath(v) { return typeof v === 'string' && WP_SERIAL_PATH_RE.test(v) ? v : WP_SERIAL_DEFAULT_PATH; }

/** DMX 副板节点：同一把尺、不同默认值（小麦 x9/x10 机型挂 ttyS4，服务端 roomDmxFields 同口径） */
function _dmxPath(v) { return typeof v === 'string' && WP_SERIAL_PATH_RE.test(v) ? v : DMX_DEFAULT_PATH; }

/** DMX 波特率：只收档内整数，档外 = 出厂档 115200（副板不能"不改速率"，上来就是定速） */
function _dmxBaud(v) {
    var n = (typeof v === 'number' || typeof v === 'string') ? Number(v) : NaN;
    return DMX_BAUDS.indexOf(n) >= 0 ? n : DMX_DEFAULT_BAUD;
}

/** 波特率：只收档内整数（数字或数字字符串），其余 = null = 不改 termios，用驱动默认 */
function _wpBaud(v) {
    var n = (typeof v === 'number' || typeof v === 'string') ? Number(v) : NaN;
    return WP_SERIAL_BAUDS.indexOf(n) >= 0 ? n : null;
}

/** 档位整数（数据位/停止位）：不在档内当没设，回落默认 —— 与服务端 wallpanelBitChoice 同口径 */
function _wpBit(v, allowed, dflt) {
    var n = (typeof v === 'number' || typeof v === 'string') ? Number(v) : NaN;
    return allowed.indexOf(n) >= 0 ? n : dflt;
}

/** 校验位：只收 none/odd/even 三个字面量，其余回落 none */
function _wpParity(v) {
    var s = typeof v === 'string' ? v.trim().toLowerCase() : '';
    return WP_SERIAL_PARITIES.some(function (p) { return p.v === s; }) ? s : 'none';
}

/** 硬件那一段的快照（判「有没有未保存改动」用）：录码是即时保存的，不参与这一份 */
function _wpHwSnap(d) {
    return JSON.stringify([d.enabled, d.path, d.baud, d.dataBits, d.parity, d.stopBits,
        d.dmxEnabled, d.dmxPath, d.dmxBaud]);
}

/** 码值表的快照（键排序后序列化）：整表写入顺序与各列的录入顺序都不该被当成内容差异；
 *  全开/全关码与码值表一起录、一起自动保存，也算在这一份里 */
function _wpCodeSnap(d) {
    var m = d.code || {};
    return JSON.stringify([Object.keys(m).sort().map(function (f) {
        var c = m[f] || {};
        return [f].concat(WP_SOURCES.map(function (x) { return c[x.v] || ''; }));
    }), d.allOn || '', d.allOff || '']);
}

/** 已录多少条码（一格最多三条：点歌机一路 + 墙板一路 + 自定义一路） */
function _wpCodeCount(m) {
    var n = 0;
    Object.keys(m || {}).forEach(function (k) {
        WP_SOURCES.forEach(function (x) { if ((m[k] || {})[x.v]) n++; });
    });
    return n;
}

/**
 * 墙板表草稿是否有还没落库的改动（硬件那行与码值表各比各的基线）。
 * 草稿只活在 s._wpDraft，但改动由自动保存的快照落库 —— 这里只驱动「保存中…」标记与红字。
 */
function _wpDirty() {
    var d = s._wpDraft;
    if (!(s._wpMode && d && d.roomId === s.rf)) return false;
    return _wpHwSnap(d) !== d.baseHw || _wpCodeSnap(d) !== d.baseCode;
}

/** 退出墙板模式：草稿随模式一起丢，重开时按云端真值重建；还没落库的改动由自动保存的快照兜住（见 _wpAutoSaveSoon） */
function _exitWpMode() {
    s._wpMode = false;
    s._wpDraft = null;
    s._wpErr = '';
    _wpLearnReset();
}

/** 学习区的界面态清场（关表 / 换房间都走这里）：倒计时停了设备端自己收窗 */
function _wpLearnReset() {
    _wpLearnTimer(false);
    s._wpLearnCell = null;
    s._wpLearnMode = false;
    s._wpLearnUntil = 0;
    s._wpLearnTimeout = false;
    s._wpNote = '';
    s._wpFrames = [];
    s._wpBaseline = null;
}

/**
 * 「墙板配置」开关：打开 → 整块工作台换成 01~30 × A/B 的码值总表。
 * 与窗口配置/输入截取/播放设置互斥：各模式都有一套「读整份 config → 改自己的键 → PUT 回去」的入口，
 * 同屏开两个等于后保存的那个把先保存的抹掉（谁都不报错，配置就这么丢了）。
 */
async function sfWP() {
    var bt = document.getElementById('wpToggle');
    if (!bt) return;
    if (bt.checked) { _exitTableModes(); _exitLogoMode(); }   // 开表：播放设置表/LOGO 设置收起；改动已/正在自动落库，不用弹框
    await flushAutoSync();   // 墙板表写库是「GET 最新 config → 改自己的键 → 整份 PUT」，防抖里还压着一次窗口编辑的话，
                             // 那份 GET 拿到的是编辑前的 windows，PUT 回去等于把刚改的跟随/文件夹抹掉（和切幕同一个坑）
    s._wpMode = !!bt.checked;
    if (s._wpMode) {
        s._windowEditorActive = false;
        _exitCropMode();
        if (!s._curScene) s._curScene = 'A';
    } else {
        _exitWpMode();
    }
    rmDevice();
}

/** 帧指纹：大写、偶数长度、1~64 字节；脏值一律当"不是帧"（与服务端 WALLPANEL_FRAME_HEX_RE 同一把闸） */
function _wpFrame(v) {
    var s = typeof v === 'string' ? v.trim().toUpperCase().replace(/\s+/g, '') : '';
    return WP_FRAME_HEX_RE.test(s) ? s : '';
}

/** 格子键 01~30（与素材目录同一把尺）；带幕前缀的旧写法（A01）折回裸格名 */
function _wpCell(v) {
    var s = typeof v === 'string' ? v.trim().replace(/^[AB](?=\d{2}$)/, '') : '';
    return /^\d{2}$/.test(s) && s >= '01' && s <= String(WP_FOLDER_COUNT).padStart(2, '0') ? s : '';
}

/** 码值来源：player = 点歌机码、panel = 墙板码、custom = 自定义；没带（存量绑定）按历史学习路径归墙板列 */
function _wpSrc(v) { return v === 'player' || v === 'custom' ? v : 'panel'; }

/** 来源的界面名（提示语/自动保存消息共用） */
function _wpSrcName(v) {
    return v === 'player' ? '点歌机码' : (v === 'custom' ? '自定义码' : '墙板码');
}

/**
 * 云端/草稿里的一条规则 → 干净形状，脏的返回 null 丢掉。
 * 与服务端 normalizeWallpanelRule 同尺：只认 frame + folder + source；存量规则里的 type/no 键直接忽略。
 */
function _wpRule(r) {
    if (!r || typeof r !== 'object') return null;
    var frame = _wpFrame(r.frame);
    if (!frame) return null;
    var fid = _wpCell(String(r.folder == null ? '' : r.folder));
    return fid ? { frame: frame, folder: fid, source: _wpSrc(r.source) } : null;
}

/** 规则表：脏的当场丢、同帧/同格同列重复先到先得（与服务端 normalizeWallpanelBindings 同一处理） */
function _wpRulesOf(raw) {
    var out = [], seenF = {}, seenS = {};
    if (!Array.isArray(raw)) return out;
    raw.forEach(function (r) {
        var ok = _wpRule(r);
        if (!ok) return;
        var slot = ok.folder + '|' + ok.source;
        if (seenF[ok.frame] || seenS[slot]) return;
        seenF[ok.frame] = 1;
        seenS[slot] = 1;
        out.push(ok);
    });
    return out;
}

/** config.wallpanel_bindings → 码值表 { '01': {player, panel, custom} }（同列先到先得，缺键给空表） */
function _wpCodeOf(cfg) {
    var out = {};
    _wpRulesOf(cfg && cfg.wallpanel_bindings).forEach(function (r) {
        var cell = out[r.folder] || (out[r.folder] = {});
        if (!cell[r.source]) cell[r.source] = r.frame;
    });
    return out;
}

/** 码值表 → 落库形状（按帧排序，指纹稳定，roomWallpanelDigest 不会虚报"配置变了"） */
function _wpBindFromCode(d) {
    var out = [];
    Object.keys(d.code || {}).sort().forEach(function (fid) {
        var cell = d.code[fid] || {};
        WP_SOURCES.forEach(function (src) {
            var f = _wpFrame(cell[src.v]);
            if (f) out.push({ frame: f, folder: fid, source: src.v });
        });
    });
    out.sort(function (a, b) { return a.frame < b.frame ? -1 : (a.frame > b.frame ? 1 : 0); });
    return out;
}

/** 与码值一起自动保存的三项：学习绑定表 + 全开/全关码（空 = 没配这一键，落 null） */
function _wpCodeFields(d) {
    return {
        wallpanel_bindings: _wpBindFromCode(d),
        wallpanel_on_frame: _wpFrame(d.allOn) || null,
        wallpanel_off_frame: _wpFrame(d.allOff) || null
    };
}

/** 一只框当前该显示的值（三种框共用：文件夹各列 + 全开/全关）。全开/全关用伪格名 ON/OFF 走同一套学习链 */
function _wpCodeValue(d, fid, src) {
    if (fid === 'ON') return (d && d.allOn) || '';
    if (fid === 'OFF') return (d && d.allOff) || '';
    return ((d && d.code && d.code[fid]) || {})[src] || '';
}

/** 学习提示里的人话名（文件夹格 / 全开码 / 全关码） */
function _wpTargetName(cell) {
    if (!cell) return '';
    if (cell.fid === 'ON') return '全开码';
    if (cell.fid === 'OFF') return '全关码';
    return '文件夹 ' + cell.fid + ' 的' + _wpSrcName(cell.src);
}

/** 草稿：只认当前房间（切房间在 sr 里作废），数据取 s.rooms 缓存 —— 与窗口编辑器同一口径；
 *  真正落库时才现读云端最新 config，避免拿几分钟前的快照整份 PUT 覆盖掉期间的改动 */
function _wpDraftOf() {
    if (s._wpDraft && s._wpDraft.roomId === s.rf) return s._wpDraft;
    var r = s.rooms.find(function (x) { return x.id === s.rf; });
    if (!r) return null;
    var cfg = _loadRoomCfg(r);
    var d = { roomId: s.rf, enabled: cfg.wallpanel_enabled === true,
              path: _wpPath(cfg.wallpanel_serial_path), baud: _wpBaud(cfg.wallpanel_baud),
              dataBits: _wpBit(cfg.wallpanel_data_bits, WP_SERIAL_DATA_BITS, 8),
              parity: _wpParity(cfg.wallpanel_parity),
              stopBits: _wpBit(cfg.wallpanel_stop_bits, WP_SERIAL_STOP_BITS, 1),
              dmxEnabled: cfg.dmx_enabled === true,
              dmxPath: _dmxPath(cfg.dmx_serial_path), dmxBaud: _dmxBaud(cfg.dmx_baud),
              code: _wpCodeOf(cfg),
              // 墙板开关键轮流发两个码：全关=所有窗口盖黑，全开=撤掉黑布回到原画面
              allOn: _wpFrame(cfg.wallpanel_on_frame), allOff: _wpFrame(cfg.wallpanel_off_frame) };
    d.baseHw = _wpHwSnap(d);
    d.baseCode = _wpCodeSnap(d);
    s._wpDraft = d;
    return d;
}

/** 波特率选项：「驱动默认」= 不下发速率，设备端保持 open 时驱动给的那一档（现网抓包前不猜） */
function _wpBaudOptions(b) {
    var o = '<option value="">驱动默认</option>';
    WP_SERIAL_BAUDS.forEach(function (n) { o += '<option value="' + n + '"' + (b === n ? ' selected' : '') + '>' + n + '</option>'; });
    return o;
}

/** 纯数字档位选项（数据位/停止位）：草稿里存的必然是档内值，不需要"没设"那一格 */
function _wpOptNums(allowed, cur) {
    return allowed.map(function (n) {
        return '<option value="' + n + '"' + (cur === n ? ' selected' : '') + '>' + n + '</option>';
    }).join('');
}

/** 校验位选项：界面说人话（无/奇/偶），落库仍是 none/odd/even 那三个字面量 */
function _wpParityOptions(cur) {
    return WP_SERIAL_PARITIES.map(function (p) {
        return '<option value="' + p.v + '"' + (cur === p.v ? ' selected' : '') + '>' + p.n + '</option>';
    }).join('');
}

/** DMX 波特率选项：没有「驱动默认」这一格 —— 副板是定速发送，设备端必须按档设下去才收得对 */
function _dmxBaudOptions(b) {
    return DMX_BAUDS.map(function (n) {
        return '<option value="' + n + '"' + (b === n ? ' selected' : '') + '>' + n + '</option>';
    }).join('');
}

/**
 * 一格的码值框（点歌机码 / 墙板码各一只）：键盘直接敲（回车或点开别处即保存，清空即删掉这格），
 * 打开「墙板学习」后点框则改为等按键——敲键盘的手输永远优先。
 */
function _wpCodeCellHtml(fid, src, d) {
    var code = ((d.code || {})[fid] || {})[src] || '';
    var name = _wpSrcName(src);
    var waiting = !!(_wpLearning() && s._wpLearnCell && s._wpLearnCell.fid === fid && s._wpLearnCell.src === src);
    var cls = 'wp-code' + (code ? ' bound' : '') + (waiting ? ' learning' : '');
    var tip = waiting ? '正在等按键：敲键盘就是手输（会取消学习），点框可取消'
        : (code ? '已录 ' + code + '（A/B 两幕通用）：直接改，回车或点开别处保存；打开「墙板学习」后点框可重学'
                : (s._wpLearnMode ? '直接敲十六进制录码；或点一下再按' + (src === 'player' ? '点歌机' : (src === 'custom' ? '自定义' : '墙板')) + '对应的那颗键'
                                   : '直接敲十六进制录码，如 D3、F50521030000；打开「墙板学习」后点框可按键学'));
    return '<span class="wp-code-wrap">'
        + '<input class="' + cls + '" data-fid="' + fid + '" data-src="' + src + '" value="' + escA(code) + '"'
        + ' placeholder="' + escA(waiting ? '等按键…' : '点此录码') + '"'
        + ' aria-label="' + escA('文件夹' + fid + ' 的' + name) + '"'
        + ' title="' + escA(tip) + '" spellcheck="false" autocomplete="off"'
        + ' onclick="wpLearnCell(\'' + fid + '\', \'' + src + '\')"'
        + ' onkeydown="wpCodeKey(event, \'' + fid + '\', \'' + src + '\')"'
        + ' onchange="wpSetCode(\'' + fid + '\', \'' + src + '\', this.value, this)">'
        + '<button class="wp-code-x" title="清掉这一列的码值（立刻保存）"'
        + ' style="' + (code && !waiting ? '' : 'display:none') + '"'
        + ' onclick="wpClearCode(\'' + fid + '\', \'' + src + '\')">×</button>'
        + '</span>';
}

/**
 * 全开/全关码框：与文件夹码框同一套交互（手输 / 点框等按键 / × 清掉 / 自动保存）。
 * 伪格名 ON/OFF 让学习链不必分叉；两个码彼此独立（墙板开关键按一下发一个）。
 */
function _wpAllCodeCellHtml(which, d) {
    var fid = which === 'on' ? 'ON' : 'OFF';
    var code = _wpCodeValue(d, fid, 'panel');
    var name = which === 'on' ? '全开码' : '全关码';
    var waiting = !!(_wpLearning() && s._wpLearnCell && s._wpLearnCell.fid === fid);
    var cls = 'wp-code' + (code ? ' bound' : '') + (waiting ? ' learning' : '');
    var tip = waiting ? '正在等按键：敲键盘就是手输（会取消学习），点框可取消'
        : (code ? '已录 ' + code + '：直接改，回车或点开别处保存；打开「墙板学习」后点框可重学'
                : (s._wpLearnMode ? '直接敲十六进制录码；或点一下再按墙板上那颗开关键'
                                   : '直接敲十六进制录码；打开「墙板学习」后点框可按键学'));
    return '<span class="wp-code-wrap">'
        + '<input class="' + cls + '" data-kind="all" data-fid="' + fid + '" data-src="panel"'
        + ' value="' + escA(code) + '"'
        + ' placeholder="' + escA(waiting ? '等按键…' : '点此录码') + '"'
        + ' aria-label="' + escA(name) + '"'
        + ' title="' + escA(tip) + '" spellcheck="false" autocomplete="off"'
        + ' onclick="wpLearnCell(\'' + fid + '\', \'panel\')"'
        + ' onkeydown="wpCodeKey(event, \'' + fid + '\', \'panel\')"'
        + ' onchange="wpSetAllCode(\'' + which + '\', this.value, this)">'
        + '<button class="wp-code-x" title="清掉这个码（立刻保存）"'
        + ' style="' + (code && !waiting ? '' : 'display:none') + '"'
        + ' onclick="wpClearAllCode(\'' + which + '\')">×</button>'
        + '</span>';
}

/** 手输的值该做什么：空 = 删这格，脏 = 不落库，同值 = 不动，合法 = 写入（纯函数，自检直接跑） */
function _wpCodeIntent(raw, had) {
    var text = typeof raw === 'string' ? raw.trim() : '';
    if (!text) return { kind: had ? 'clear' : 'none' };
    var hex = _wpFrame(text);
    if (!hex) return { kind: 'bad' };
    return hex === (had || '') ? { kind: 'none' } : { kind: 'set', hex: hex };
}

/** 码值框里按键：键盘永远优先——敲任何键都先取消这一格的学习窗；回车 = 保存并离开；Esc = 放弃这次输入 */
function wpCodeKey(ev, fid, src) {
    if (s._wpLearnCell && s._wpLearnCell.fid === fid && s._wpLearnCell.src === src) { _wpLearnCancel(); _wpPaintCodes(); }
    if (ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); return; }
    if (ev.key === 'Escape') {
        ev.preventDefault();
        var d = _wpDraftOf();
        ev.target.value = _wpCodeValue(d, fid, src);
        ev.target.blur();
    }
}

/** 手输一格：归一后落进草稿并立刻保存；脏值不静默吞掉（还原 + 说一句）。el = 这只输入框，改完把框里的字也摆正 */
function wpSetCode(fid, src, raw, el) {
    var d = _wpDraftOf();
    if (!d || !s.rf) return;
    var had = ((d.code || {})[fid] || {})[src] || '';
    var act = _wpCodeIntent(raw, had);
    if (act.kind === 'none') { if (el) el.value = had; _wpPaintCodes(); return; }
    if (act.kind === 'bad') {
        if (el) el.value = had;
        alert('码值要是 1~64 字节的十六进制（如 D3、F50521030000），字符间的空格会被忽略。');
        _wpPaintCodes();
        return;
    }
    if (act.kind === 'clear') _wpDropCode(d, fid, src);
    else _wpPutCode(fid, src, act.hex);
    if (el) el.value = act.kind === 'clear' ? '' : act.hex;
    _wpPaintCodes();
    _wpAutoSaveCodes((act.kind === 'clear' ? '已清掉文件夹 ' + fid + ' 的' : '已录文件夹 ' + fid + ' 的')
        + _wpSrcName(src) + (act.kind === 'clear' ? '' : '：' + act.hex), true)
        .catch(function (e) {
            alert('码值已改，但自动保存失败：' + e.message + '\n点右上「保存」也能把它存下去。');
        });
}

/** 手输全开/全关码：口径同 wpSetCode（空 = 清掉，脏 = 不落库，同值 = 不动），只是不挂文件夹 */
function wpSetAllCode(which, raw, el) {
    var d = _wpDraftOf();
    if (!d || !s.rf) return;
    var key = which === 'on' ? 'allOn' : 'allOff';
    var name = which === 'on' ? '全开码' : '全关码';
    var had = d[key] || '';
    var act = _wpCodeIntent(raw, had);
    if (act.kind === 'none') { if (el) el.value = had; _wpPaintCodes(); return; }
    if (act.kind === 'bad') {
        if (el) el.value = had;
        alert('码值要是 1~64 字节的十六进制（如 D3、F50521030000），字符间的空格会被忽略。');
        _wpPaintCodes();
        return;
    }
    if (act.kind === 'clear') d[key] = '';
    else _wpPutAll(which, act.hex);
    if (el) el.value = act.kind === 'clear' ? '' : act.hex;
    _wpPaintCodes();
    _wpAutoSaveCodes((act.kind === 'clear' ? '已清掉' : '已录') + name
        + (act.kind === 'clear' ? '' : '：' + act.hex), true).catch(function (e) {
            alert('码值已改，但自动保存失败：' + e.message + '\n点右上「保存」也能把它存下去。');
        });
}

/** 清掉全开/全关码（立刻保存；只刷框，不整表重画） */
function wpClearAllCode(which) {
    var d = _wpDraftOf();
    var key = which === 'on' ? 'allOn' : 'allOff';
    if (!d || !d[key]) return;
    d[key] = '';
    _wpPaintCodes();
    _wpAutoSaveCodes('已清掉' + (which === 'on' ? '全开码' : '全关码'), true).catch(function (e) {
        alert('清掉了，但自动保存失败：' + e.message + '\n点右上「保存」也能把它存下去。');
    });
}

/**
 * 只把各格的框刷成草稿的样子（值/金边/清空键/已录计数）。
 * 手输不走整表重画：连续敲几格时外层 DOM 一换，焦点和刚敲的字就没了。
 */
function _wpPaintCodes() {
    var d = _wpDraftOf();
    if (!d) return;
    var m = d.code || {};
    var list = document.querySelectorAll('.wp-code');
    var active = document.activeElement;
    for (var i = 0; i < list.length; i++) {
        var fid = list[i].getAttribute('data-fid');
        var src = _wpSrc(list[i].getAttribute('data-src'));
        var code = _wpCodeValue(d, fid, src);
        if (list[i] !== active) list[i].value = code;   // 正在敲的那一格不碰它已敲的字
        list[i].classList.toggle('bound', !!code);
        list[i].placeholder = '点此录码';
        var x = list[i].parentNode && list[i].parentNode.querySelector('.wp-code-x');
        if (x) x.style.display = code ? '' : 'none';
    }
    var n = _wpCodeCount(m);
    var c = document.getElementById('wpBound');
    if (c) c.textContent = '已录 ' + n + ' 个码';
    var w = document.getElementById('wpEmptyWarn');
    if (w && n) w.remove();
}

function _wpTableHtml() {
    var d = _wpDraftOf();
    if (!d) return '<div class="empty" style="margin-top:10px">房间数据还没加载完，关掉「墙板配置」再开一次</div>';
    var r = s.rooms.find(function (x) { return x.id === s.rf; }) || {};
    var cfg = _loadRoomCfg(r);
    var fmA = cfg.scenes.A.folder_mappings, fmB = cfg.scenes.B.folder_mappings;
    var bound = _wpCodeCount(d.code);

    var h = '<div class="wp-bar">';
    // 两个开关都与工作台那排同构（_wbSw 的 44x24 轨道 + 18px 滑块），重绘由各自的 handler 负责
    h += '<span title="' + escA('设备是否打开 485 串口收帧；关着时串口根本不开，学习也收不到任何帧') + '">'
        + _wbSw('墙板串口总闸', ['wpGate', 'wpGateSlider', 'wpGateKnob'], d.enabled, '#4caf50', 'wpSetGate(this.checked)')
        + '</span>';
    // 学习开关只影响这块界面（点框 → 等按键），与串口总闸是两件事：总闸决定设备收不收 485；
    // 但收帧是学习的前提，所以开学习时若总闸关着，wpLearnMode 会先问一句要不要顺手开闸
    h += '<span title="' + escA('打开后点任意一个码值框，再按墙板上对应的键，码值就会填进那个框并立刻保存') + '">'
        + _wbSw('墙板学习', ['wpLearnMode', 'wpLearnModeSlider', 'wpLearnModeKnob'], s._wpLearnMode, '#f5a623', 'wpLearnMode(this.checked)')
        + '</span>';
    // 串口硬件参数（房间级，只在这间房的设备上生效）：节点名各板不同，波特率要等现网抓包定档，
    // 两个都得能改；填错在保存时由服务端 400 拦下，不会静默回落成"设备自己猜一个口"
    h += '<label style="display:flex;align-items:center;gap:6px"><span style="font-size:var(--fs-meta);color:#ccc">串口</span>'
        + '<input id="wpPath" value="' + escA(d.path) + '" size="12" spellcheck="false" autocomplete="off"'
        + ' title="' + escA('485 适配板在设备上的节点名，形如 /dev/ttyUSB0；不确定的话在设备上 ls /dev/tty* 看一眼') + '"'
        + ' onchange="wpSetPath(this.value)"></label>';
    h += '<label style="display:flex;align-items:center;gap:6px"><span style="font-size:var(--fs-meta);color:#ccc">波特率</span>'
        + '<select class="wp-sel" id="wpBaud" style="width:88px"'
        + ' title="' + escA('485 总线速率；「驱动默认」= 设备不改串口参数，沿用系统给这个节点的默认速率') + '"'
        + ' onchange="wpSetBaud(this.value)">' + _wpBaudOptions(d.baud) + '</select></label>';
    // 字符格式：数据位/校验/停止位三格并排（合起来就是常说的 8N1）。设备端的空闲断帧阈值由这三位数
    // 算出（2 个字符时间），中控厂家固件各家默认档不同，填错的表现是"帧被切成两半"或"两帧并成一帧"
    var _fmt = d.dataBits + (d.parity === 'odd' ? 'O' : d.parity === 'even' ? 'E' : 'N') + d.stopBits;
    h += '<label style="display:flex;align-items:center;gap:4px"><span style="font-size:var(--fs-meta);color:#ccc">格式</span>'
        + '<select class="wp-sel" id="wpDataBits" style="width:52px"'
        + ' title="' + escA('数据位（' + _fmt + '）：常见 8；只在这些档位里选，填错保存会被服务端拒') + '"'
        + ' onchange="wpSetBits(this.value)">' + _wpOptNums(WP_SERIAL_DATA_BITS, d.dataBits) + '</select>'
        + '<select class="wp-sel" id="wpParity" style="width:56px"'
        + ' title="' + escA('校验位（' + _fmt + '）：无/奇/偶， none 最常见；这一档还参与设备端断帧时间计算') + '"'
        + ' onchange="wpSetParity(this.value)">' + _wpParityOptions(d.parity) + '</select>'
        + '<select class="wp-sel" id="wpStopBits" style="width:52px"'
        + ' title="' + escA('停止位（' + _fmt + '）：常见 1') + '"'
        + ' onchange="wpSetStop(this.value)">' + _wpOptNums(WP_SERIAL_STOP_BITS, d.stopBits) + '</select></label>';
    if (!WP_SERIAL_PATH_RE.test(d.path)) h += '<span class="wp-warn">串口节点形状不对（要 /dev/ 下的设备名）</span>';
    h += '<span id="wpBound" style="font-size:var(--fs-micro);color:#666">已录 ' + bound + ' 个码</span>';
    if (_wpDirty()) h += '<span class="wp-warn">● 保存中…</span>';
    h += '<span style="flex:1"></span>';
    h += '<button class="btn btn-sync" id="wpCopyBtn" style="padding:5px 14px;font-size:var(--fs-meta);margin-right:6px" title="把当前房间的总闸、串口节点/波特率/字符格式、码值表与 DMX512 设置覆盖到本店其余房间（其它配置与其他店铺一概不碰）" onclick="wpCopyAll()">全局复制</button>';
    h += '<button class="btn btn-primary" id="wpSaveBtn" style="padding:5px 18px;font-size:var(--fs-meta)" title="改动会自动保存；这里可立即落库，或重试上一次失败" onclick="wpSave()">保存</button>';
    h += '<button class="btn btn-secondary" style="padding:5px 14px;font-size:var(--fs-meta);margin-left:6px" title="丢掉未落库的改动，按云端当前配置重画" onclick="wpReload()">重读</button>';
    h += '</div>';

    // DMX512 副板是另一条物理链路（与 485 各开各的门）：一帧 20 路，设备只认通道 1，值 1:1 调格，
    // 落到文件夹 NN（值 N = 格子 NN）；哪些格接这一路在「播放设置」的 DMX512控制 列里开。字符格式由副板固件定死 8N1，
    // 所以这里比 485 那行少三格格式选择，只留总闸/节点/波特率。
    h += '<div class="wp-bar" style="margin-top:6px">';
    h += '<span title="' + escA('设备是否监听 DMX512 副板串口；关着时副板链路根本不开，通道变动不会有任何反应') + '">'
        + _wbSw('DMX512 总闸', ['wpDmxGate', 'wpDmxGateSlider', 'wpDmxGateKnob'], d.dmxEnabled, '#4caf50', 'wpSetDmxGate(this.checked)')
        + '</span>';
    h += '<label style="display:flex;align-items:center;gap:6px"><span style="font-size:var(--fs-meta);color:#ccc">DMX 串口</span>'
        + '<input id="dmxPath" value="' + escA(d.dmxPath) + '" size="12" spellcheck="false" autocomplete="off"'
        + ' title="' + escA('DMX 副板在设备上的串口节点，小麦 x9/x10 机型是 /dev/ttyS4；不确定的话在设备上 ls /dev/tty* 看一眼') + '"'
        + ' onchange="wpSetDmxPath(this.value)"></label>';
    h += '<label style="display:flex;align-items:center;gap:6px"><span style="font-size:var(--fs-meta);color:#ccc">波特率</span>'
        + '<select class="wp-sel" id="dmxBaud" style="width:88px"'
        + ' title="' + escA('DMX 副板上行帧的速率；该机型出厂档是 115200') + '"'
        + ' onchange="wpSetDmxBaud(this.value)">' + _dmxBaudOptions(d.dmxBaud) + '</select></label>';
    if (!WP_SERIAL_PATH_RE.test(d.dmxPath)) h += '<span class="wp-warn">DMX 串口节点形状不对（要 /dev/ 下的设备名）</span>';
    h += '<span style="font-size:var(--fs-micro);color:#666">通道 1 的值 = 文件夹号（1~30 对应 01~30，0 不动）；哪些文件夹接 DMX 在「播放设置」里开</span>';
    h += '</div>';
    if (s._wpErr) h += '<div class="wp-warn" style="color:#e94560">' + esc(s._wpErr) + '</div>';

    if (!s._wpLearnMode) {
        h += '<div class="wp-hint">串口参数、总闸与码值改动都会自动保存（两路串口各管各的）。各列码值都能直接敲十六进制；打开「墙板学习」后点某一列、再按对应的那颗键，码值会自己填进那一列并立刻保存。最上面一行是全开/全关码：墙板那颗开关键按一下发一个码（两个码各自独立），全关=所有窗口盖黑（播放不停），全开=撤掉黑布回到原画面。DMX512 不需要学码：设备只认 DMX512 副板的通道 1，值 1~30 就是文件夹 01~30（0 不动，31~255 忽略）。</div>';
    } else if (_wpLearning()) {
        var left = Math.max(0, Math.ceil((s._wpLearnUntil - Date.now()) / 1000));
        var cell = s._wpLearnCell;
        h += '<div class="wp-hint" style="color:#f5a623">正在等按键（还剩 ' + left + ' 秒）：请按「'
            + esc(_wpTargetName(cell)) + '」对应的那颗键；点同一个框可取消。'
            + (_wpMergeFrames(s._wpFrames || []).length ? ''
                : (d.enabled ? '　还没收到过帧：先确认串口节点/波特率/字符格式与中控一致。'
                             : '　还没收到过帧。' + _wpGateHint(d) + '。'))
            + '</div>';
    } else {
        // 学习开着但总闸关着是唯一一个"开了也白开"的组合：这里给的是动作，不是重复下面那句警告
        h += '<div class="wp-hint" style="color:#f5a623">' + (d.enabled
            ? '墙板学习已开：点一个码值框（点歌机码、墙板码或自定义），再按对应的那颗键。'
            : '墙板学习已开，但总闸关着：设备不会收帧，先去上面打开总闸。') + '</div>';
    }
    if (s._wpLearnTimeout && !_wpLearning()) {
        h += '<div class="wp-warn" style="margin-top:4px">这次没等到任何帧：确认串口节点/波特率/字符格式与中控一致，以及设备装的是带墙板学习的新版本（旧版不会上报帧）。</div>';
    }
    if (s._wpNote) h += '<div class="wp-hint" style="color:#4caf50">✓ ' + esc(s._wpNote) + '</div>';
    // 关闸是最容易踩的坑（设备连串口都不开），所以不是只在点学习时拦一次，而是常驻一句；
    // 学习已开时上面那条提示负责说清楚并给动作，这里不重复
    if (!d.enabled && !s._wpLearnMode) h += '<div class="wp-warn" style="margin-top:6px">' + esc(_wpGateHint(d)) + '</div>';
    if (d.enabled && bound === 0 && !d.allOn && !d.allOff) h += '<div class="wp-warn" id="wpEmptyWarn" style="margin-top:6px">串口总闸已开但一个码都没录：按任何键都不会有反应</div>';

    // 全开/全关：墙板开关键轮流发两个码，是两个独立动作（不是同一个帧的两种解释）。
    // 列宽与下面的码值表对齐，现场一眼就能看出这两格和格子的码是同一套录入方式
    h += '<table class="wp-tbl wp-codes" style="margin-top:8px"><thead><tr><th>全开全关</th>'
        + '<th colspan="3" style="font-weight:normal;color:#888">一键黑屏 / 恢复（播放不停）</th>'
        + '<th>全开码</th><th>全关码</th></tr></thead><tbody>';
    h += '<tr><td class="wp-fid">全开全关</td>'
        + '<td colspan="3" class="wp-cnt" title="墙板那颗开关键按一下发一个码（两码轮流）；全关=所有窗口盖黑、播放继续；全开=撤掉黑布回到原画面">按开关键学习</td>'
        + '<td>' + _wpAllCodeCellHtml('on', d) + '</td>'
        + '<td>' + _wpAllCodeCellHtml('off', d) + '</td></tr>';
    h += '</tbody></table>';

    // 一格可录三个码（点歌机一路、墙板一路、自定义一路），A/B 两幕通用：按不按得动只看这格在"当前这一幕"里有没有素材
    h += '<table class="wp-tbl wp-codes"><thead><tr><th>文件夹</th><th>A幕素材</th><th>B幕素材</th>'
        + WP_SOURCES.map(function (x) { return '<th>' + x.n + '</th>'; }).join('') + '</tr></thead><tbody>';
    for (var i = 1; i <= WP_FOLDER_COUNT; i++) {
        var f = String(i).padStart(2, '0');
        var ca = (fmA[f] || []).length, cb = (fmB[f] || []).length;
        h += '<tr><td class="wp-fid">' + f + '</td>'
            + '<td class="wp-cnt' + (ca ? ' has' : '') + '" title="A 幕这格里有几个素材（0 个的话按过去是黑屏）">' + (ca || '—') + '</td>'
            + '<td class="wp-cnt' + (cb ? ' has' : '') + '" title="B 幕这格里有几个素材（0 个的话按过去是黑屏）">' + (cb || '—') + '</td>'
            + WP_SOURCES.map(function (x) { return '<td>' + _wpCodeCellHtml(f, x.v, d) + '</td>'; }).join('')
            + '</tr>';
    }
    h += '</tbody></table>';
    return h;
}

/** 多台机的上报并成一份：hex 相同就合计数，age 取最小（最近那次）；脏项与超长的直接丢 */
function _wpMergeFrames(devList) {
    var m = {};
    (devList || []).forEach(function (one) {
        (one.frames || []).forEach(function (f) {
            if (!f || typeof f !== 'object') return;
            var hex = _wpFrame(f.hex);
            if (!hex) return;
            var n = Number(f.n), age = Number(f.age);
            var hit = m[hex];
            if (hit) { hit.n += Number.isInteger(n) && n > 0 ? n : 1; hit.age = Math.min(hit.age, Number(age) || 0); }
            else m[hex] = { hex: hex, n: Number.isInteger(n) && n > 0 ? n : 1, age: Math.max(0, Number(age) || 0) };
        });
    });
    return Object.keys(m).map(function (k) { return m[k]; })
        .sort(function (a, b) { return a.age - b.age || (a.hex < b.hex ? -1 : 1); });
}

function _wpLearning() { return !!(s._wpLearnUntil && s._wpLearnUntil > Date.now()); }

/** 总闸关着时的提示语（空串 = 已开）：常驻警告与学习窗空帧提示共用同一句，自检直接跑 */
function _wpGateHint(d) {
    return (d && d.enabled === true) ? '' : '串口总闸关着：设备不会打开 485 串口，按墙板不会有反应，学习也收不到帧';
}

/** 「墙板学习」开关：只是这块界面的闸；真开学习窗是点某个码值框那一刻的事 */
function wpLearnMode(on) {
    s._wpLearnMode = !!on;
    if (!on) {
        _wpLearnCancel();
        renderWpEditor();
        return;
    }
    // 收帧是学习的前提：总闸关着就顺手打开并落库，不弹窗打断（开学习本身就是"我要录码"的意图）
    var d = _wpDraftOf();
    if (d && !d.enabled) {
        d.enabled = true;
        wpSave();
        return;
    }
    renderWpEditor();
}

/**
 * 点码值框（哪一列就是哪一路）：开学习窗，等操作员按下对应的那颗键；再点同一个框 = 取消。
 * 开窗后设备端会清空帧台账，所以"窗后第一条到达的帧"就是这一下按键。
 * 学习开关没开时什么也不做——框本身可编辑，点进来是手输。
 */
async function wpLearnCell(fid, src) {
    if (!_wpDraftOf() || !s.rf) return;
    src = _wpSrc(src);
    if (s._wpLearnCell && s._wpLearnCell.fid === fid && s._wpLearnCell.src === src) { _wpLearnCancel(); renderWpEditor(); return; }
    if (!s._wpLearnMode) return;
    // 同一时间只等一格：设备端只有一个台账，两格一起等会抢同一帧
    if (s._wpLearnCell) _wpLearnCancel();
    s._wpLearnCell = { fid: fid, src: src };
    s._wpLearnUntil = Date.now() + WP_LEARN_S_DEFAULT * 1000;
    s._wpLearnTimeout = false;
    s._wpNote = '';
    s._wpFrames = [];
    s._wpBaseline = {};
    // 先记一份"开窗前就在跑的帧"（点歌机常年广播）：只有窗后新出现的帧才算候选
    try {
        s._wpFrames = asList(await apiGet('/api/devices?room_id=' + encodeURIComponent(s.rf)));
    } catch (e) {}
    if (!s._wpLearnCell || s._wpLearnCell.fid !== fid || s._wpLearnCell.src !== src) return;   // 等帧期间被取消（点框/敲键盘）就不要再开窗
    _wpMergeFrames(s._wpFrames).forEach(function (f) { s._wpBaseline[f.hex] = 1; });
    try {
        await apiPost('/api/rooms/' + encodeURIComponent(s.rf) + '/wallpanel/learn',
            { on: true, seconds: WP_LEARN_S_DEFAULT });
    } catch (e) {
        s._wpLearnCell = null;
        s._wpLearnUntil = 0;
        alert('开学习窗失败：' + e.message);
        renderWpEditor();
        return;
    }
    if (!s._wpLearnCell || s._wpLearnCell.fid !== fid || s._wpLearnCell.src !== src) {   // 开窗请求飞在路上时被取消：顺手把设备窗收掉
        apiPost('/api/rooms/' + encodeURIComponent(s.rf) + '/wallpanel/learn', { on: false }).catch(function () {});
        return;
    }
    renderWpEditor();
    _wpLearnTimer(true);
}

/** 取消正在等的框（设备端有自带倒计时，最迟 60s 自己收窗；这里顺手告诉它一声） */
function _wpLearnCancel() {
    _wpLearnTimer(false);
    var was = !!s._wpLearnCell;
    s._wpLearnCell = null;
    s._wpLearnUntil = 0;
    if (was && s.rf) {
        apiPost('/api/rooms/' + encodeURIComponent(s.rf) + '/wallpanel/learn', { on: false }).catch(function () {});
    }
}

/** 等按键时的取帧节拍：1s 一次，够跟手又不至于把接口刷爆；只在等按键时跑 */
function _wpLearnTimer(on) {
    clearInterval(s._wpLearnTimer);
    s._wpLearnTimer = null;
    if (on) s._wpLearnTimer = setInterval(_wpLearnTick, WP_LEARN_POLL_MS);
}

async function _wpLearnTick() {
    if (!s._wpLearnCell) { _wpLearnTimer(false); return; }
    if (!_wpLearning()) {
        // 窗到点了还没有帧：收窗，提示留给界面（操作员这时可能正走回电脑前，弹窗反而挡手）
        s._wpLearnTimeout = true;
        _wpLearnCancel();
        renderWpEditor();
        return;
    }
    var list;
    try { list = asList(await apiGet('/api/devices?room_id=' + encodeURIComponent(s.rf))); }
    catch (e) { return; }
    if (!s._wpLearnCell) return;   // 请求飞行途中被取消（点框/敲键盘）：不能再用这一拍去重画，手输的字会被吞
    s._wpFrames = list;
    var fresh = _wpFreshFrames(list);
    if (!fresh.length) { renderWpEditor(); return; }
    // 取窗后"最早到"的那一帧：设备开窗时清了台账，age 最大的那条就是操作员按的第一下
    fresh.sort(function (a, b) { return b.age - a.age; });
    wpLearnDone(fresh[0].hex);
}

/** 窗后新出现的帧（多台设备按 hex 合并） */
function _wpFreshFrames(devList) {
    return _wpMergeFrames(devList).filter(function (f) { return !(s._wpBaseline && s._wpBaseline[f.hex]); });
}

/** 录到一帧：填进点中的那一格（或全开/全关码）、立刻保存、收窗 */
function wpLearnDone(hex) {
    var cell = s._wpLearnCell;
    if (!_wpDraftOf() || !cell) return;
    _wpLearnCancel();
    if (cell.fid === 'ON' || cell.fid === 'OFF') _wpPutAll(cell.fid === 'ON' ? 'on' : 'off', hex);
    else _wpPutCode(cell.fid, cell.src, hex);
    s._wpFrames = [];
    renderWpEditor();
    _wpAutoSaveCodes('已录' + _wpTargetName(cell) + '：' + hex).catch(function (e) {
        alert('码值已填进框，但自动保存失败：' + e.message + '\n点右上「保存」也能把它存下去。');
    });
}

/** 写一格码值：一个码只能落一格（含各列之间、含全开/全关），原来占这个码的那个框让位 */
function _wpPutCode(fid, src, hex) {
    var d = _wpDraftOf();
    if (!d) return;
    var m = d.code = d.code || {};
    Object.keys(m).forEach(function (k) {
        var c = m[k] || {};
        WP_SOURCES.forEach(function (x) { if (c[x.v] === hex) delete c[x.v]; });
        if (!WP_SOURCES.some(function (x) { return c[x.v]; })) delete m[k];
    });
    if (d.allOn === hex) d.allOn = '';
    if (d.allOff === hex) d.allOff = '';
    (m[fid] = m[fid] || {})[_wpSrc(src)] = hex;
}

/** 写全开/全关码（which = on/off）：同帧只能有一个动作，占着这一帧的文件夹框或另一个动作让位 */
function _wpPutAll(which, hex) {
    var d = _wpDraftOf();
    if (!d) return;
    var m = d.code = d.code || {};
    Object.keys(m).forEach(function (k) {
        var c = m[k] || {};
        WP_SOURCES.forEach(function (x) { if (c[x.v] === hex) delete c[x.v]; });
        if (!WP_SOURCES.some(function (x) { return c[x.v]; })) delete m[k];
    });
    if (which === 'on') {
        d.allOn = hex;
        if (d.allOff === hex) d.allOff = '';
    } else {
        d.allOff = hex;
        if (d.allOn === hex) d.allOn = '';
    }
}

/** 删掉一格某一列的码（整个文件夹空到没码就把键也去掉） */
function _wpDropCode(d, fid, src) {
    var m = (d && d.code) || {};
    var c = m[fid];
    if (!c) return;
    delete c[_wpSrc(src)];
    if (!WP_SOURCES.some(function (x) { return c[x.v]; })) delete m[fid];
}

/** 清掉一格某一列的码值（立刻保存；只刷框，不整表重画，焦点留在原处） */
function wpClearCode(fid, src) {
    var d = _wpDraftOf();
    src = _wpSrc(src);
    if (!d || !((d.code || {})[fid] || {})[src]) return;
    _wpDropCode(d, fid, src);
    _wpPaintCodes();
    _wpAutoSaveCodes('已清掉文件夹 ' + fid + ' 的' + _wpSrcName(src), true).catch(function (e) {
        alert('清掉了，但自动保存失败：' + e.message + '\n点右上「保存」也能把它存下去。');
    });
}

/**
 * 码值改动后的自动保存：读云端最新 config → 只把学习表换成草稿里的 → PUT。
 * 只写学习表，串口/总闸/窗口一概不碰（那些还有自己的「保存」）。
 * 串行化：连录几格时后一次要等前一次落库，否则两次 GET→PUT 会互相覆盖。
 * soft = 手输路径：落库后不整表重画（框已经刷过），免得打断连续敲格子。
 */
function _wpAutoSaveCodes(okMsg, soft) {
    var d = _wpDraftOf();
    if (!d || !s.rf) return Promise.resolve();
    var want = _wpCodeSnap(d), fields = _wpCodeFields(d);
    var job = function () {
        return flushAutoSync()
            .then(function () { return apiGet('/api/rooms/' + encodeURIComponent(s.rf)); })
            .then(function (roomObj) {
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                Object.keys(fields).forEach(function (k) { cfg[k] = fields[k]; });
                delete cfg.wallpanel_default_no;   // 旧字段顺手清掉（设备端已不读）
                return apiCall('/api/rooms/' + encodeURIComponent(s.rf), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                }).then(function () { return cfg; });
            })
            .then(function (cfg) {
                var idx = s.rooms.findIndex(function (x) { return x.id === s.rf; });
                if (idx >= 0) {
                    var room = JSON.parse(JSON.stringify(s.rooms[idx]));
                    room.config = JSON.stringify(cfg);
                    s.rooms[idx] = room;
                }
                var cur = _wpDraftOf();
                if (cur) cur.baseCode = want;   // 这一份已落库，"未保存"标记只跟串口/总闸走
                if (soft) { _wpPaintCodes(); return; }
                if (okMsg) s._wpNote = okMsg;
                renderWpEditor();
            });
    };
    s._wpSaveQ = (s._wpSaveQ || Promise.resolve()).then(job, job);   // 前一次失败也要接着排
    return s._wpSaveQ;
}

/**
 * 串口参数/总闸的自动保存：改完 500ms 落库一次（连续拖档位只写一次）。
 * 快照含房间号，在改动这一刻取 —— 随后切表、换房间、写还在路上，这一笔照样落在被改的那间房。
 */
function _wpAutoSaveSoon() {
    var d = _wpDraftOf();
    if (!d || !s.rf) return;
    // 节点名形状不对就不发：服务端会 400，打字途中弹框比什么都不烦人。表格里常驻那句警告负责说明
    var pathErr = !WP_SERIAL_PATH_RE.test(d.path) ? '墙板串口节点形状不对，串口参数还没保存'
        : (!WP_SERIAL_PATH_RE.test(d.dmxPath) ? 'DMX 串口节点形状不对，串口参数还没保存' : '');
    if (pathErr) {
        s._wpErr = pathErr;
        renderWpEditor();
        return;
    }
    var snap = _wpSerialSnap(d);
    if (_wpAutoTimer) clearTimeout(_wpAutoTimer);
    _wpAutoTimer = setTimeout(function () {
        _wpAutoTimer = null;
        _wpSaveSnap(snap);
    }, TABLE_AUTO_SAVE_MS);
}

/** 串口那一段的落库快照（只含硬件字段；码值表由 _wpAutoSaveCodes 各管各的） */
function _wpSerialSnap(d) {
    return {
        roomId: s.rf,
        want: _wpHwSnap(d),
        fields: {
            wallpanel_enabled: d.enabled === true,
            wallpanel_serial_path: d.path,
            wallpanel_baud: d.baud,
            wallpanel_data_bits: d.dataBits,
            wallpanel_parity: d.parity,
            wallpanel_stop_bits: d.stopBits,
            dmx_enabled: d.dmxEnabled === true,
            dmx_serial_path: d.dmxPath,
            dmx_baud: d.dmxBaud
        }
    };
}

/**
 * 把一份快照落库：与码值保存共用一条串行队列（两次读后写交叠会互相抹掉对方刚写的键）。
 * 只改 snap.fields 里的键（+ 可选 wallpanel_bindings），其它配置一概不碰。
 * resolve(null) = 成功；resolve(Error) = 失败（表格红字已经更新，调用方自己决定要不要再 alert）。
 * 成功回填基线用快照那一刻的 want：写飞在路上时又改的那一格不在快照里，未保存标记该继续亮着。
 */
function _wpSaveSnap(snap) {
    var job = function () {
        return flushAutoSync()
            .then(function () { return apiGet('/api/rooms/' + encodeURIComponent(snap.roomId)); })
            .then(function (roomObj) {
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                Object.keys(snap.fields).forEach(function (k) { cfg[k] = snap.fields[k]; });
                delete cfg.wallpanel_default_no;
                return apiCall('/api/rooms/' + encodeURIComponent(snap.roomId), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                }).then(function () { return cfg; });
            })
            .then(function (cfg) {
                var idx = s.rooms.findIndex(function (x) { return x.id === snap.roomId; });
                if (idx >= 0) {
                    var room = JSON.parse(JSON.stringify(s.rooms[idx]));
                    room.config = JSON.stringify(cfg);
                    s.rooms[idx] = room;
                }
                var cur = s._wpDraft;
                if (cur && cur.roomId === snap.roomId) {
                    cur.baseHw = snap.want;
                    if (snap.wantCode != null) cur.baseCode = snap.wantCode;
                }
                s._wpErr = '';
                if (s._wpMode && cur) { s._wpNote = '已自动保存'; renderWpEditor(); }
                return null;
            })
            .catch(function (e) {
                s._wpErr = '自动保存失败：' + e.message + '（点「保存」可重试）';
                if (s._wpMode) renderWpEditor();
                return e;
            });
    };
    s._wpSaveQ = (s._wpSaveQ || Promise.resolve()).then(job, job);
    return s._wpSaveQ;
}

/** 保存前自检：条数上限（服务端同一道闸），形状在 _wpRule 那关已经丢干净了 */
function _wpBindErrors(d) {
    var n = _wpBindFromCode(d || {}).length;
    return n > WP_BINDINGS_MAX ? ['录了 ' + n + ' 个码，超过上限 ' + WP_BINDINGS_MAX + ' 个'] : [];
}

/**
 * 重画配置表（整表自替换：下拉只在 change 后才重绘，没有输入焦点被打断的问题）。
 * 码值框例外——点框开学习窗也会走这里，焦点不还回去的话就没法接着改成手输；
 * 学到的帧到达时也重画一次，这时焦点早已不在框里，还回去也无害。
 */
function renderWpEditor() {
    var g = document.getElementById('dg');
    if (!g) return;
    var ae = document.activeElement;
    var keep = ae && ae.classList && ae.classList.contains('wp-code')
        ? { fid: ae.getAttribute('data-fid'), src: ae.getAttribute('data-src') } : null;
    var caret = keep ? (ae.selectionStart | 0) : 0;
    var html = '<div id="wpWrap">' + _wpTableHtml() + '</div>';
    var old = document.getElementById('wpWrap');
    if (old) old.outerHTML = html;
    else g.insertAdjacentHTML('beforeend', html);
    if (keep) {
        var again = g.querySelector('.wp-code[data-fid="' + keep.fid + '"][data-src="' + keep.src + '"]');
        if (again) {
            again.focus();
            try { again.setSelectionRange(caret, caret); } catch (e) {}
        }
    }
}

/** 改总闸（改动即自动保存；关闸时设备会停链路收不到帧，正在等的框顺势取消） */
function wpSetGate(on) {
    var d = _wpDraftOf();
    if (!d) return;
    d.enabled = !!on;
    if (!d.enabled) _wpLearnCancel();
    renderWpEditor();
    _wpAutoSaveSoon();
}

/** 串口节点：原样收进草稿（形状校验交给保存前的提示 + 服务端 400），失焦/回车才重绘，不然打字会被打断 */
function wpSetPath(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.path = String(v == null ? '' : v).trim();
    renderWpEditor();
    _wpAutoSaveSoon();
}

function wpSetBaud(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.baud = _wpBaud(v);
    renderWpEditor();
    _wpAutoSaveSoon();
}

/** 字符格式三格：档位都在白名单里，直接归一收进草稿（越界当没设，回落 8N1 = 历史行为） */
function wpSetBits(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.dataBits = _wpBit(v, WP_SERIAL_DATA_BITS, 8);
    renderWpEditor();
    _wpAutoSaveSoon();
}

function wpSetParity(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.parity = _wpParity(v);
    renderWpEditor();
    _wpAutoSaveSoon();
}

function wpSetStop(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.stopBits = _wpBit(v, WP_SERIAL_STOP_BITS, 1);
    renderWpEditor();
    _wpAutoSaveSoon();
}

/** DMX512 总闸（另一条物理链路，与 485 总闸各开各的；关着时副板串口不开） */
function wpSetDmxGate(on) {
    var d = _wpDraftOf();
    if (!d) return;
    d.dmxEnabled = !!on;
    renderWpEditor();
    _wpAutoSaveSoon();
}

function wpSetDmxPath(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.dmxPath = String(v == null ? '' : v).trim();
    renderWpEditor();
    _wpAutoSaveSoon();
}

function wpSetDmxBaud(v) {
    var d = _wpDraftOf();
    if (!d) return;
    d.dmxBaud = _dmxBaud(v);
    renderWpEditor();
    _wpAutoSaveSoon();
}

/** 丢掉草稿、现读云端最新配置重画（重读不写库；路上的自动保存先等它落地，免得读完又被旧快照覆盖） */
async function wpReload() {
    if (!s.rf) return;
    if (_wpAutoTimer) { clearTimeout(_wpAutoTimer); _wpAutoTimer = null; }
    await (s._wpSaveQ || Promise.resolve());
    var roomObj;
    try { roomObj = await apiGet('/api/rooms/' + encodeURIComponent(s.rf)); }
    catch (e) { alert('重读失败: ' + e.message); return; }
    if (!roomObj || roomObj.error) { alert('重读失败: 房间不存在'); return; }
    var idx = s.rooms.findIndex(function (x) { return x.id === s.rf; });
    if (idx >= 0) s.rooms[idx] = roomObj;
    s._wpDraft = null;
    s._wpErr = '';
    renderWpEditor();
}

/**
 * 当前草稿里的墙板字段：保存与「全局复制」共用这一份口径，别处不要再手抄一遍键名。
 * 总闸严格布尔（与 roomWallpanelFields 同尺），学习表归一成平铺数组。
 */
function _wpFieldsOf(d) {
    return {
        wallpanel_enabled: d.enabled === true,
        wallpanel_serial_path: d.path,
        wallpanel_baud: d.baud,              // null = 驱动默认，设备端不改串口速率
        wallpanel_data_bits: d.dataBits,
        wallpanel_parity: d.parity,
        wallpanel_stop_bits: d.stopBits,
        wallpanel_bindings: _wpBindFromCode(d),
        wallpanel_on_frame: _wpFrame(d.allOn) || null,
        wallpanel_off_frame: _wpFrame(d.allOff) || null,
        dmx_enabled: d.dmxEnabled === true,
        dmx_serial_path: d.dmxPath,
        dmx_baud: d.dmxBaud
    };
}

/**
 * 保存这一页（通常是自动保存的重试/立即落库）：与自动保存共用一条队列，
 * 先 GET 云端最新 config，只改墙板字段再 PUT；码值表一并写一遍，兜住"码值自动保存那一次失败"。
 */
async function wpSave() {
    var d = _wpDraftOf();
    if (!d || !s.rf) return;
    if (!WP_SERIAL_PATH_RE.test(d.path)) { alert('串口节点要写成 /dev/ 下的设备名，例如 ' + WP_SERIAL_DEFAULT_PATH); return; }
    if (!WP_SERIAL_PATH_RE.test(d.dmxPath)) { alert('DMX 串口节点要写成 /dev/ 下的设备名，例如 ' + DMX_DEFAULT_PATH); return; }
    var bindErr = _wpBindErrors(d);
    if (bindErr.length) { alert('先处理码值：\n' + bindErr.join('\n')); return; }
    if (_wpAutoTimer) { clearTimeout(_wpAutoTimer); _wpAutoTimer = null; }
    var snap = _wpSerialSnap(d);
    Object.assign(snap.fields, _wpCodeFields(d));
    snap.wantCode = _wpCodeSnap(d);
    var btn = document.getElementById('wpSaveBtn');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    var err = await _wpSaveSnap(snap);
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
    if (err) alert('墙板配置保存失败: ' + err.message);
}

/**
 * 全局复制：把当前房间的墙板字段（总闸/串口/字符格式/码值表 + DMX512 总闸/节点/波特率）覆盖到**本店**其余房间。
 * 墙板码值只对同店同批设备有意义，跨店复制等于把别人家的按键映射写进来，所以范围以当前房间的
 * store_name 为界，不是全平台所有房间。
 * 每间房都走读后写、只动 wallpanel_* 七项与 dmx_* 三项，其它配置（场景/窗口/播放设置/调试）一概不碰；
 * 复制完把当前房间也存一次，保证"复制出去的"就是"这里留下的"。
 * 一间失败不拦后面：最后报出成功数与失败名单。
 */
async function wpCopyAll() {
    var d = _wpDraftOf();
    if (!d || !s.rf || s._wpCopying) return;
    if (!WP_SERIAL_PATH_RE.test(d.path)) { alert('串口节点要写成 /dev/ 下的设备名，例如 ' + WP_SERIAL_DEFAULT_PATH); return; }
    if (!WP_SERIAL_PATH_RE.test(d.dmxPath)) { alert('DMX 串口节点要写成 /dev/ 下的设备名，例如 ' + DMX_DEFAULT_PATH); return; }
    var bindErr = _wpBindErrors(d);
    if (bindErr.length) { alert('先处理码值：\n' + bindErr.join('\n')); return; }
    var btn = document.getElementById('wpCopyBtn');
    if (btn) btn.disabled = true;
    // 复制边界 = 当前房间所属店铺；s.rooms 可能是旧的/未按店过滤的快照，拿不到就现读一次
    var cur = (s.rooms || []).find(function (r) { return r && r.id === s.rf; });
    var store = cur && cur.store_name;
    if (!store) {
        try { cur = await apiGet('/api/rooms/' + encodeURIComponent(s.rf)); store = cur && cur.store_name; }
        catch (e) { /* 下面统一报错 */ }
    }
    if (!store) { if (btn) btn.disabled = false; alert('拿不到当前房间的店铺，无法确定复制范围。'); return; }
    var list;
    try { list = asList(await apiGet('/api/rooms?store=' + encodeURIComponent(store))); }
    catch (e) { if (btn) btn.disabled = false; alert('取房间列表失败: ' + e.message); return; }
    var others = list.filter(function (r) { return r && r.id !== s.rf; });
    if (!others.length) { if (btn) btn.disabled = false; alert('本店没有其它房间可覆盖。'); return; }
    if (!confirm('把当前房间的墙板设置（总闸、串口节点/波特率/字符格式、码值表、DMX512 总闸/串口/波特率）覆盖到「' + store + '」的其余 '
        + others.length + ' 间房？\n\n它们原本的墙板与 DMX 设置会被整体替换，其它配置与其他店铺不受影响。')) {
        if (btn) btn.disabled = false;
        return;
    }
    s._wpCopying = true;
    var fields = _wpFieldsOf(d);
    var ok = 0, bad = [];
    try {
        await flushAutoSync();   // 这次连发 GET→PUT 会整份覆盖各房 config，先落掉窗口编辑的防抖改动
        for (var i = 0; i < others.length; i++) {
            var r = others[i];
            if (btn) btn.textContent = '复制中 ' + (i + 1) + '/' + others.length + '…';
            try {
                var roomObj = await apiGet('/api/rooms/' + encodeURIComponent(r.id));
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                Object.keys(fields).forEach(function (k) { cfg[k] = fields[k]; });
                delete cfg.wallpanel_default_no;
                await apiCall('/api/rooms/' + encodeURIComponent(r.id), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                });
                ok++;
            } catch (e) { bad.push((r.name || r.id) + '：' + e.message); }
        }
        await wpSave();          // 当前房间自己也落一份（顺带按落库真值重画）
    } finally {
        s._wpCopying = false;
        if (btn) btn.disabled = false;
        if (btn) btn.textContent = '全局复制';
    }
    s._wpNote = '已把墙板设置覆盖到本店 ' + ok + ' 间房' + (bad.length ? '，' + bad.length + ' 间失败' : '');
    renderWpEditor();
    if (bad.length) alert('有 ' + bad.length + ' 间房没覆盖成功：\n' + bad.join('\n'));
}

// ============================================================================
// 【F-06g】播放设置表（工作台「播放设置」模式）
// 表形与墙板表同构：行 = 文件夹 01~30，列 = A幕 / B幕 各一组（素材数 + 播放顺序），另加点歌屏模式（四态单选）与 DMX512 开关两列。
// A、B 是两套独立的物理素材目录（scenea/01 与 sceneb/01 各播各的），所以设置也各存一份。
// 落库形状 scenes[X].play_settings = {格: {order, hdmi, dmx}}，全默认的格子不落键、
// 空表整个键都不下发 —— 与服务端 playSettingsValue / buildPrefixedScenes 同一口径，
// 存量房间不会因为新增这个字段而 rev 漂移一次（那会让每台在线设备白重同步、视频从头播）。
// 叠化（dissolve / dissolve_ms）已于 2026-11-12 随功能一起删除：素材轮播交接一律硬切。
// 后续要加的设置项直接往这一组列里添，草稿/快照/保存三处都按「整格对象」走，不用改结构。
// 点歌屏（hdmi）/ DMX512 控制（dmx）/ LOGO 叠加（logo）三个开关按文件夹一行一控，同时写 A/B 两幕：
// 墙板一格一码不分幕，两幕永远同格，分两列只会让人拨出一半开一半关的自相矛盾状态。
// ============================================================================

var PS_ORDERS = ['seq', 'shuffle'];

/**
 * 一格设置的规范形状；全默认（顺序循环 + 点歌屏关 + DMX512 关 + LOGO 关）→ null = 不落键。
 * 读库和编辑都过它，两处不会各漂一份口径。
 */
function _psCell(v) {
    if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
    var o = {};
    if (v.order === 'shuffle') o.order = 'shuffle';
    if (v.hdmi === true) {
        o.hdmi = true;
        // 模式1 沿用存量形状（只落 hdmi:true），模式2/3 才多带一个 hdmi_mode ——
        // 这样存量开着点歌屏的房间不会因为本次升级 rev 漂移、白重同步一次
        if (v.hdmi_mode === 2 || v.hdmi_mode === 3) o.hdmi_mode = v.hdmi_mode;
    }
    if (v.dmx === true) o.dmx = true;
    if (v.logo === true) o.logo = true;
    return Object.keys(o).length ? o : null;
}

/** 一格的「点歌屏模式」：0=关，1~3=模式N（老格子只有 hdmi:true 即模式1） */
function _psHdmiModeOf(c) {
    if (!c || c.hdmi !== true) return 0;
    return (c.hdmi_mode === 2 || c.hdmi_mode === 3) ? c.hdmi_mode : 1;
}

/** 某一幕的设置表：01~30 之外的键原样留着（表只画 30 行，保存是整表 PUT，丢了等于替别人清设置） */
function _psTableOf(cfg, k) {
    var raw = ((cfg.scenes || {})[k] || {}).play_settings, out = {};
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
        Object.keys(raw).forEach(function (fid) {
            var c = _psCell(raw[fid]);
            if (c) out[fid] = c;
        });
    }
    return out;
}

/** 规范化快照（键排序 + 每格摊成定长数组）：判「有没有未保存改动」用，编辑顺序不算内容差异 */
function _psSnap(d) {
    var srt = function (m) {
        var o = {};
        Object.keys(m).sort().forEach(function (k) {
            var c = m[k];
            o[k] = [c.order === 'shuffle' ? 'shuffle' : 'seq', String(_psHdmiModeOf(c)), c.dmx === true ? 'on' : 'off', c.logo === true ? 'on' : 'off'];
        });
        return o;
    };
    return JSON.stringify([srt(d.A), srt(d.B)]);
}

/** 退出播放设置模式：草稿随模式一起丢，重开时按云端真值重建；还没落库的改动由自动保存的快照兜住 */
function _exitPsMode() {
    s._psMode = false;
    s._psDraft = null;
    s._psErr = '';
}

/** 进入某个编辑模式前，把另外两张总表（墙板 / 播放设置）收掉；它们的改动都已/正在自动落库，不弹确认框 */
function _exitTableModes() {
    _exitWpMode();
    _exitPsMode();
}

/**
 * 「播放设置」开关：打开 → 整块工作台换成 01~30 × A/B 的文件夹级播放设置总表。
 * 与窗口配置/输入截取/墙板配置互斥，理由同 sfWP：各自一套「读整份 config → 改自己的键 → PUT 回去」。
 */
async function sfPS() {
    var pt = document.getElementById('psToggle');
    if (!pt) return;
    if (pt.checked) { _exitTableModes(); _exitLogoMode(); }   // 开表：墙板表/LOGO 设置收起
    await flushAutoSync();   // 写库是整份 config 读后写，防抖里还压着窗口编辑的话会把刚改的 windows 抹掉
    s._psMode = !!pt.checked;
    if (s._psMode) {
        s._windowEditorActive = false;
        _exitCropMode();
        if (!s._curScene) s._curScene = 'A';
    } else {
        _exitPsMode();
    }
    rmDevice();
}

/** 草稿：只认当前房间（切房间在 sr 里作废），数据取 s.rooms 缓存；落库时才现读云端最新 config */
function _psDraftOf() {
    if (s._psDraft && s._psDraft.roomId === s.rf) return s._psDraft;
    var r = s.rooms.find(function (x) { return x.id === s.rf; });
    if (!r) return null;
    var cfg = _loadRoomCfg(r);
    var d = { roomId: s.rf, A: _psTableOf(cfg, 'A'), B: _psTableOf(cfg, 'B') };
    d.base = _psSnap(d);
    s._psDraft = d;
    return d;
}

/** 一幕一格的两个格子：素材数（只读参照）+ 播放顺序 */
function _psGroupHtml(sc, fid, cell, count, sep) {
    var c = cell || {};
    var ord = c.order === 'shuffle' ? 'shuffle' : 'seq';
    var where = '第' + sc + '幕 文件夹' + fid;
    var h = '<td class="wp-cnt' + (count ? ' has' : '') + (sep ? ' ps-sep' : '') + '"'
        + ' title="' + escA(where + ' 里有几个素材（0 个的话设了也没画面）') + '">' + (count || '—') + '</td>';
    var opts = '';
    PS_ORDERS.forEach(function (o) {
        opts += '<option value="' + o + '"' + (ord === o ? ' selected' : '') + '>' + (o === 'shuffle' ? '随机循环' : '顺序循环') + '</option>';
    });
    h += '<td><select class="wp-sel" style="width:84px" name="pso-' + sc + '-' + fid + '" aria-label="' + escA(where + ' 的播放顺序') + '"'
        + ' title="' + escA('顺序循环 = 按文件名排；随机循环 = 每次进入这一格重新洗牌一次，之后按这份顺序循环') + '"'
        + ' onchange="psSet(\'' + sc + '\',\'' + fid + '\',\'order\',this.value)">' + opts + '</select></td>';
    return h;
}

/**
 * 一行的点歌屏模式（单选）：关 / 模式1 / 模式2 / 模式3，默认关。
 * A、B 两幕取较大模式显示（设备端按"任一在播的格"判定，取最大模式执行）。
 * 模式 = 窗口配置里每扇点歌窗在属性栏标的那一套；选模式N 时屏上只显示模式N 的点歌窗。
 */
function _psHdmiSeg(fid, d) {
    var mode = Math.max(_psHdmiModeOf(d.A[fid]), _psHdmiModeOf(d.B[fid]));
    var h = '<div class="ps-seg" role="radiogroup" aria-label="文件夹' + fid + ' 的点歌屏模式">';
    [0, 1, 2, 3].forEach(function(m) {
        var tip = m === 0
            ? '关 = 这一格在播时隐藏所有点歌窗并停掉采集（默认）'
            : '模式' + m + ' = 这一格在播时只显示属性栏标了模式' + m + '的点歌窗';
        h += '<label class="ps-seg-item' + (mode === m ? ' on' : '') + '" title="' + escA(tip) + '">'
            + '<input type="radio" name="psh-' + fid + '" value="' + m + '"' + (mode === m ? ' checked' : '')
            + ' onchange="psSetHdmi(\'' + fid + '\',' + m + ')"><span>' + (m === 0 ? '关' : '模式' + m) + '</span></label>';
    });
    return h + '</div>';
}

/** 一行的 DMX512 控制开关：一行一控写 A/B 两幕，口径与点歌屏同（默认关） */
function _psDmxSw(fid, d) {
    var ca = d.A[fid], cb = d.B[fid];
    var on = (ca && ca.dmx === true) || (cb && cb.dmx === true);
    return '<label class="wb-sw" title="' + escA('开 = 这一格接受 DMX512 控制（中控把 XVJ 当效果灯时，通道表只对这一格生效）；关 = 忽略 DMX 通道。默认关') + '">'
        + '<span class="tk"><input type="checkbox" name="psd-' + fid + '"' + (on ? ' checked' : '')
        + ' aria-label="文件夹' + fid + ' 的 DMX512 控制开关" onchange="psSetDmx(\'' + fid + '\',this.checked)">'
        + '<span class="sl"></span><span class="kb"></span></span></label>';
}

/** 一行的 LOGO 叠加开关：一行一控写 A/B 两幕（默认关；还要求 LOGO 设置里这扇窗也开着） */
function _psLogoSwh(fid, d) {
    var ca = d.A[fid], cb = d.B[fid];
    var on = (ca && ca.logo === true) || (cb && cb.logo === true);
    return '<label class="wb-sw ps-logo-sw" title="' + escA('开 = 这一格在播时允许叠加 LOGO（还要在「LOGO设置」里把这扇素材窗打开）；关 = 这一格不显示 LOGO。默认关') + '">'
        + '<span class="tk"><input type="checkbox" name="psl-' + fid + '"' + (on ? ' checked' : '')
        + ' aria-label="文件夹' + fid + ' 的 LOGO 叠加开关" onchange="psSetLogo(\'' + fid + '\',this.checked)">'
        + '<span class="sl"></span><span class="kb"></span></span></label>';
}

function _psTableHtml() {
    var d = _psDraftOf();
    if (!d) return '<div class="empty" style="margin-top:10px">房间数据还没加载完，关掉「播放设置」再开一次</div>';
    var r = s.rooms.find(function (x) { return x.id === s.rf; }) || {};
    var cfg = _loadRoomCfg(r);
    var fm = { A: cfg.scenes.A.folder_mappings, B: cfg.scenes.B.folder_mappings };
    var set = Object.keys(d.A).length + Object.keys(d.B).length;

    var h = '<div class="wp-bar">';
    h += '<span style="font-size:var(--fs-meta);color:#ccc">按文件夹设置播放行为</span>';
    h += '<span style="font-size:var(--fs-micro);color:#666">已设 ' + set + ' 格</span>';
    if (_psSnap(d) !== d.base) h += '<span class="wp-warn">● 保存中…</span>';
    if (s._psNote) h += '<span style="font-size:var(--fs-micro);color:#4caf50">✓ ' + esc(s._psNote) + '</span>';
    if (s._psErr) h += '<span class="wp-warn" style="color:#e94560">' + esc(s._psErr) + '</span>';
    h += '<span style="flex:1"></span>';
    h += '<button class="btn btn-sync" id="psCopyBtn" style="padding:5px 14px;font-size:var(--fs-meta);margin-right:6px" title="把当前房间的播放设置（每格的播放顺序、点歌屏模式、DMX512 开关、LOGO 开关）覆盖到本店其余房间（其它配置与其他店铺一概不碰）" onclick="psCopyAll()">全局复制</button>';
    h += '<button class="btn btn-primary" id="psSaveBtn" style="padding:5px 18px;font-size:var(--fs-meta)" title="改动会自动保存；这里可立即落库，或重试上一次失败" onclick="psSave()">保存</button>';
    h += '<button class="btn btn-secondary" style="padding:5px 14px;font-size:var(--fs-meta);margin-left:6px" title="丢掉未落库的改动，按云端当前配置重画" onclick="psReload()">重读</button>';
    h += '</div>';
    h += '<div style="color:#666;font-size:var(--fs-micro);margin-top:6px">改动会自动保存。素材轮播的交接一律硬切（切墙板、切幕、试播接管同样硬切）。未设置的格子 = 顺序循环、点歌屏关（不显示点歌窗）、DMX512 控制关、LOGO 叠加关。点歌屏模式：点歌窗在「窗口配置」里按属性栏分成模式1/2/3 三套，这里选哪套，这一格在播时就只出哪套点歌窗。开了 DMX512 控制的格子：DMX512 副板通道 1 的值一变就切到文件夹 NN（值 N = 格子 NN，1~30 有效，0 不动，31~255 忽略）；DMX 串口在「墙板配置」里设。LOGO 叠加：这里开了文件夹、且「LOGO设置」里那扇素材窗也开着，两个条件同时满足才出 LOGO。</div>';

    h += '<table class="wp-tbl ps-tbl"><thead>'
        + '<tr><th rowspan="2">文件夹</th><th colspan="2">第一幕 (A)</th><th colspan="2" class="ps-sep">第二幕 (B)</th>'
        + '<th rowspan="2" class="ps-sep ps-hdmi">点歌屏模式</th>'
        + '<th rowspan="2" class="ps-sep ps-dmx">DMX512控制</th>'
        + '<th rowspan="2" class="ps-sep ps-logo">LOGO</th></tr>'
        + '<tr><th>素材</th><th>播放顺序</th>'
        + '<th class="ps-sep">素材</th><th>播放顺序</th></tr>'
        + '</thead><tbody>';
    for (var i = 1; i <= 30; i++) {
        var f = String(i).padStart(2, '0');
        h += '<tr><td class="wp-fid">' + f + '</td>'
            + _psGroupHtml('A', f, d.A[f], (fm.A[f] || []).length, false)
            + _psGroupHtml('B', f, d.B[f], (fm.B[f] || []).length, true)
            + '<td class="ps-sep">' + _psHdmiSeg(f, d) + '</td>'
            + '<td class="ps-sep">' + _psDmxSw(f, d) + '</td>'
            + '<td class="ps-sep">' + _psLogoSwh(f, d) + '</td>'
            + '</tr>';
    }
    h += '</tbody></table>';
    return h;
}

/** 重画设置表（整表自替换：控件只在 change 后才重绘，打字不会被中途打断） */
function renderPsEditor() {
    var g = document.getElementById('dg');
    if (!g) return;
    var html = '<div id="psWrap">' + _psTableHtml() + '</div>';
    var old = document.getElementById('psWrap');
    if (old) old.outerHTML = html;
    else g.insertAdjacentHTML('beforeend', html);
}

/**
 * 改一格草稿并立刻自动保存；回到全默认就删键，与服务端"默认值不落键"同口径。
 * 按整格对象改：拨顺序不能把点歌屏模式抹掉，反之亦然。
 */
function _psSetCell(sc, fid, field, v) {
    var d = _psDraftOf();
    if (!d) return false;
    var cell = {};
    var old = d[sc][fid];
    if (old) Object.keys(old).forEach(function (k) { cell[k] = old[k]; });
    if (field === 'order') {
        if (v === 'shuffle') cell.order = 'shuffle'; else delete cell.order;
    } else if (field === 'hdmi') {
        // v = 0 关 / 1~3 模式N；模式1 不落 hdmi_mode（存量形状），关就把两个键一起删
        if (v) {
            cell.hdmi = true;
            if (v === 2 || v === 3) cell.hdmi_mode = v; else delete cell.hdmi_mode;
        } else {
            delete cell.hdmi;
            delete cell.hdmi_mode;
        }
    } else if (field === 'dmx') {
        if (v) cell.dmx = true; else delete cell.dmx;
    } else if (field === 'logo') {
        if (v) cell.logo = true; else delete cell.logo;
    } else return false;
    if (Object.keys(cell).length) d[sc][fid] = cell; else delete d[sc][fid];
    return true;
}
function psSet(sc, fid, field, v) {
    if (sc !== 'A' && sc !== 'B') return;
    if (_psSetCell(sc, fid, field, v)) { renderPsEditor(); _psAutoSaveSoon(); }
}

/** 点歌屏模式按行拨（0 关 / 1~3 模式N）：A、B 两幕同时落同一个值（理由见本节表头注释） */
function psSetHdmi(fid, mode) {
    _psSetCell('A', fid, 'hdmi', mode);
    _psSetCell('B', fid, 'hdmi', mode);
    renderPsEditor();
    _psAutoSaveSoon();
}

/** DMX512 控制开关按行拨：同样 A、B 两幕同值 */
function psSetDmx(fid, on) {
    _psSetCell('A', fid, 'dmx', on);
    _psSetCell('B', fid, 'dmx', on);
    renderPsEditor();
    _psAutoSaveSoon();
}

/** LOGO 叠加开关按行拨：同样 A、B 两幕同值 */
function psSetLogo(fid, on) {
    _psSetCell('A', fid, 'logo', on);
