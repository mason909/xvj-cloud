    _psSetCell('B', fid, 'logo', on);
    renderPsEditor();
    _psAutoSaveSoon();
}

/** 丢掉草稿、现读云端最新配置重画（重读不写库；路上的自动保存先等它落地，免得读完又被旧快照覆盖） */
async function psReload() {
    if (!s.rf) return;
    if (_psAutoTimer) { clearTimeout(_psAutoTimer); _psAutoTimer = null; }
    await (s._psSaveQ || Promise.resolve());
    var roomObj;
    try { roomObj = await apiGet('/api/rooms/' + encodeURIComponent(s.rf)); }
    catch (e) { alert('重读失败: ' + e.message); return; }
    if (!roomObj || roomObj.error) { alert('重读失败: 房间不存在'); return; }
    var idx = s.rooms.findIndex(function (x) { return x.id === s.rf; });
    if (idx >= 0) s.rooms[idx] = roomObj;
    s._psDraft = null;
    s._psErr = '';
    renderPsEditor();
}

/**
 * 改一格后的自动保存：500ms 防抖落一次库。
 * 快照（房间 + 两幕设置）在改动这一刻取，随后切表/换房间、写还在路上，这一笔照样落在被改的那间房。
 */
function _psAutoSaveSoon() {
    var d = _psDraftOf();
    if (!d || !s.rf) return;
    var snap = { roomId: s.rf, want: _psSnap(d), A: JSON.parse(JSON.stringify(d.A)), B: JSON.parse(JSON.stringify(d.B)) };
    if (_psAutoTimer) clearTimeout(_psAutoTimer);
    _psAutoTimer = setTimeout(function () {
        _psAutoTimer = null;
        _psSaveSnap(snap);
    }, TABLE_AUTO_SAVE_MS);
}

/**
 * 把一份快照落库：串行队列（与全局复制/「保存」按钮共用），先 flushAutoSync 再 GET 最新 config，
 * 只换 scenes.A/B.play_settings 再 PUT。两幕都必须带：服务端 mergeSceneConfig 是「带键即按传入落库、
 * 没带才继承」，少带一幕那一幕的清设置就落不下去；全空带 {} 也安全（不落键、rev 不动）。
 * resolve(null) = 成功；resolve(Error) = 失败（红字已更新，调用方决定是否再 alert）。
 */
function _psSaveSnap(snap) {
    if (!snap || !snap.roomId) return Promise.resolve(null);
    var job = function () {
        return flushAutoSync()
            .then(function () { return apiGet('/api/rooms/' + encodeURIComponent(snap.roomId)); })
            .then(function (roomObj) {
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                cfg.scenes.A.play_settings = JSON.parse(JSON.stringify(snap.A));
                cfg.scenes.B.play_settings = JSON.parse(JSON.stringify(snap.B));
                return apiCall('/api/rooms/' + encodeURIComponent(snap.roomId), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                }).then(function () { return cfg; });
            })
            .then(function (cfg) {
                var idx = s.rooms.findIndex(function (x) { return x.id === snap.roomId; });
                if (idx >= 0) {
                    var room = JSON.parse(JSON.stringify(s.rooms[idx]));
                    room.config = JSON.stringify(cfg);
                    s.rooms[idx] = room;
                }
                var cur = s._psDraft;
                if (cur && cur.roomId === snap.roomId) cur.base = snap.want;   // 写飞在路上时又改的格不在快照里，标记继续亮
                s._psErr = '';
                if (s._psMode && cur) { s._psNote = '已自动保存'; renderPsEditor(); }
                return null;
            })
            .catch(function (e) {
                s._psErr = '自动保存失败：' + e.message + '（点「保存」可重试）';
                if (s._psMode) renderPsEditor();
                return e;
            });
    };
    s._psSaveQ = (s._psSaveQ || Promise.resolve()).then(job, job);
    return s._psSaveQ;
}

/**
 * 保存这一页（通常是自动保存的重试/立即落库）：快照按当前草稿取，走同一条串行队列。
 */
async function psSave() {
    var d = _psDraftOf();
    if (!d || !s.rf) return;
    if (_psAutoTimer) { clearTimeout(_psAutoTimer); _psAutoTimer = null; }
    var btn = document.getElementById('psSaveBtn');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    var err = await _psSaveSnap({ roomId: s.rf, want: _psSnap(d),
        A: JSON.parse(JSON.stringify(d.A)), B: JSON.parse(JSON.stringify(d.B)) });
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
    if (err) alert('播放设置保存失败: ' + err.message);
}

/**
 * 全局复制：把当前房间的播放设置（两幕每格的播放顺序 + 点歌屏模式 + DMX512 开关 + LOGO 开关）覆盖到**本店**其余房间。
 * 边界与墙板表同一口径：只认当前房间的 store_name；每间房读后写、只换 scenes.A/B.play_settings，
 * 其它配置（窗口/墙板/输出基准）一概不碰。复制的是当前草稿，所以最后把自己也存一次，
 * 保证"复制出去的"就是"这里留下的"。一间失败不拦后面：最后报出成功数与失败名单。
 */
async function psCopyAll() {
    var d = _psDraftOf();
    if (!d || !s.rf || s._psCopying) return;
    var cur = (s.rooms || []).find(function (r) { return r && r.id === s.rf; });
    var store = cur && cur.store_name;
    if (!store) {
        try { cur = await apiGet('/api/rooms/' + encodeURIComponent(s.rf)); store = cur && cur.store_name; }
        catch (e) { /* 下面统一报错 */ }
    }
    if (!store) { alert('拿不到当前房间的店铺，无法确定复制范围。'); return; }
    var list;
    try { list = asList(await apiGet('/api/rooms?store=' + encodeURIComponent(store))); }
    catch (e) { alert('取房间列表失败: ' + e.message); return; }
    var others = list.filter(function (r) { return r && r.id !== s.rf; });
    if (!others.length) { alert('本店没有其它房间可覆盖。'); return; }
    if (!confirm('把当前房间的播放设置（每格播放顺序、点歌屏模式、DMX512 开关、LOGO 开关）覆盖到「' + store + '」的其余 '
        + others.length + ' 间房？\n\n它们原本的播放设置会被整体替换，其它配置与其他店铺不受影响。')) return;
    var psA = JSON.parse(JSON.stringify(d.A)), psB = JSON.parse(JSON.stringify(d.B));
    s._psCopying = true;
    var btn = document.getElementById('psCopyBtn');
    if (btn) btn.disabled = true;
    var ok = 0, bad = [];
    try {
        await flushAutoSync();   // 这次连发 GET→PUT 会整份覆盖各房 config，先落掉窗口编辑的防抖改动
        for (var i = 0; i < others.length; i++) {
            var r = others[i];
            if (btn) btn.textContent = '复制中 ' + (i + 1) + '/' + others.length + '…';
            try {
                var roomObj = await apiGet('/api/rooms/' + encodeURIComponent(r.id));
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                cfg.scenes.A.play_settings = JSON.parse(JSON.stringify(psA));
                cfg.scenes.B.play_settings = JSON.parse(JSON.stringify(psB));
                await apiCall('/api/rooms/' + encodeURIComponent(r.id), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                });
                ok++;
            } catch (e) { bad.push((r.name || r.id) + '：' + e.message); }
        }
        await psSave();          // 当前房间自己也落一份（顺带按落库真值重画）
    } finally {
        s._psCopying = false;
        var btn2 = document.getElementById('psCopyBtn');
        if (btn2) { btn2.disabled = false; btn2.textContent = '全局复制'; }
    }
    s._psNote = '已把播放设置覆盖到本店 ' + ok + ' 间房' + (bad.length ? '，' + bad.length + ' 间失败' : '');
    renderPsEditor();
    if (bad.length) alert('有 ' + bad.length + ' 间房没覆盖成功：\n' + bad.join('\n'));
}


// ============================================================================
// 【F-06j】LOGO 设置（工作台「LOGO设置」模式）
//   一间房一份 LOGO 视频：上传 → 首帧预览 → 相对素材窗口的几何 → 按幕勾选显示窗口。
//   与窗口/截取/墙板/播放设置互斥：这里也是「读整份 config → 只换 logo → PUT 回去」。
//   真正出画 = 本页窗口开关 ∧ 播放设置该文件夹的 logo 开关（见 server playSettingsValue）。
//   写库走串行队列 + 500ms 防抖，快照在改动那一刻取：切页/切房间时在路上那笔仍落原房间。
//   几何口径与服务端 roomLogoField 一致：x/y 是 LOGO 中心相对窗口中心的偏移百分比，
//   w/h 是 LOGO 视频宽/高占窗口宽/高的百分比；左画布按"一扇 16:9 素材窗"等比演示。
// ============================================================================

var LOGO_DEF_W = 50, LOGO_DEF_H = 50;
var LOGO_VIDEO_EXT = ['mp4', 'webm', 'mov', 'avi', 'mkv'];

function _logoClamp(v, dflt, min, max) {
    var n = (typeof v === 'number' || typeof v === 'string') ? Number(v) : NaN;
    if (!Number.isFinite(n)) n = dflt;
    return Math.round(Math.min(max, Math.max(min, n)) * 10) / 10;
}
function _logoPct(v, dflt) { return _logoClamp(v, dflt, 1, 100); }
function _logoOff(v, dflt) { return _logoClamp(v, dflt, -200, 200); }
/** 逐窗几何表：id 白名单、值域与服务端同尺、缺字段跟随房间默认 base、上限 128（与服务端 LOGO_PER_MAX 同） */
function _logoPer(v, base) {
    var out = {};
    if (!v || typeof v !== 'object' || Array.isArray(v)) return out;
    Object.keys(v).sort().forEach(function (id) {
        if (Object.keys(out).length >= 128) return;
        if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) return;
        var g = v[id];
        if (!g || typeof g !== 'object' || Array.isArray(g)) return;
        out[id] = {
            x: _logoOff(g.x, base.x),
            y: _logoOff(g.y, base.y),
            w: _logoPct(g.w, base.w),
            h: _logoPct(g.h, base.h)
        };
    });
    return out;
}
function _logoWinArr(v) {
    var out = [];
    if (!Array.isArray(v)) return out;
    v.forEach(function (id) {
        if (typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id) && out.indexOf(id) < 0 && out.length < 64) out.push(id);
    });
    return out;
}

/** config.logo → 编辑形状；没设 / 地址不合法按没用处理（与服务端 roomLogoField 同口径） */
function _logoNorm(v) {
    if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
    if (typeof v.url !== 'string' || !/^\/uploads\/logos\/[A-Za-z0-9_-]{1,64}\/logo-[a-f0-9]{6,32}\.(?:mp4|webm|mov|avi|mkv)$/.test(v.url)) return null;
    var wins = (v.windows && typeof v.windows === 'object' && !Array.isArray(v.windows)) ? v.windows : {};
    var lg = {
        url: v.url,
        thumbnail: typeof v.thumbnail === 'string' ? v.thumbnail : '',
        filename: typeof v.filename === 'string' ? v.filename : '',
        md5: typeof v.md5 === 'string' ? v.md5 : '',
        size: Math.max(0, Math.floor(Number(v.size) || 0)),
        width: Math.max(0, Math.floor(Number(v.width) || 0)),
        height: Math.max(0, Math.floor(Number(v.height) || 0)),
        x: _logoOff(v.x, 0),
        y: _logoOff(v.y, 0),
        w: _logoPct(v.w, LOGO_DEF_W),
        h: _logoPct(v.h, LOGO_DEF_H),
        windows: { A: _logoWinArr(wins.A), B: _logoWinArr(wins.B) }
    };
    var per = _logoPer(v.per_win, lg);
    if (Object.keys(per).length) lg.per_win = per;   // 空表不落键（rev 不漂）
    return lg;
}

/** 快照：只比文件地址 + 默认几何 + 窗口名单 + 逐窗几何（元数据/编辑顺序不算内容差异） */
function _logoSnap(lg) {
    if (!lg || !lg.url) return '';
    var per = [];
    var mp = lg.per_win || {};
    Object.keys(mp).sort().forEach(function (id) {
        var g = mp[id];
        per.push([id, g.x, g.y, g.w, g.h]);
    });
    return JSON.stringify([lg.url, lg.x, lg.y, lg.w, lg.h,
        (lg.windows.A || []).slice().sort(), (lg.windows.B || []).slice().sort(), per]);
}

function _exitLogoMode() {
    s._logoMode = false;
    s._logoDraft = null;
    s._logoErr = '';
    s._logoNote = '';
    s._logoUploading = false;
}

/**
 * 「LOGO设置」开关：打开 → 整块工作台换成 LOGO 编辑页。
 * 与另外三张表同一套互斥理由（各自「读整份 config → 改自己的键 → PUT 回去」），
 * 打开前先把路上的窗口编辑落库，免得这边读后写把 windows 抹掉。
 */
async function sfLogo() {
    var lt = document.getElementById('logoToggle');
    if (!lt) return;
    if (lt.checked) _exitTableModes();
    await flushAutoSync();
    s._logoMode = !!lt.checked;
    if (s._logoMode) {
        s._windowEditorActive = false;
        _exitCropMode();
        s._selWin = null;
        s._logoErr = '';
        s._logoNote = '';
    } else {
        _exitLogoMode();
    }
    rmDevice();
}

/** 草稿：只认当前房间（切房间在 sr 里作废），数据取 s.rooms 缓存；落库时才现读云端最新 config */
function _logoDraftOf() {
    if (s._logoDraft && s._logoDraft.roomId === s.rf) return s._logoDraft;
    var r = s.rooms.find(function (x) { return x.id === s.rf; });
    if (!r) return null;
    var cfg = _loadRoomCfg(r);
    var d = { roomId: s.rf, logo: _logoNorm(cfg.logo), sel: '' };
    d.base = _logoSnap(d.logo);
    s._logoDraft = d;
    return d;
}

/** 按窗口 id 找场景里的素材窗（点歌窗/HDMI/纯色窗不参与 LOGO，返回 null） */
function _logoFindWin(id) {
    if (!id) return null;
    var r = s.rooms.find(function (x) { return x.id === s.rf; });
    if (!r) return null;
    var cfg = _loadRoomCfg(r);
    var scs = ['A', 'B'];
    for (var i = 0; i < scs.length; i++) {
        var wins = ((cfg.scenes || {})[scs[i]] || {}).windows || [];
        for (var j = 0; j < wins.length; j++) {
            var w = wins[j];
            var t = w && w.content && w.content.type;
            if (w && w.id === id && (t === 'SCENE_A' || t === 'SCENE_B')) return { sc: scs[i], w: w };
        }
    }
    return null;
}

/** 宽高比文字（如 16:9（1920×1080））；非正整数返回空串 */
function _logoRatio(w, h) {
    w = Math.round(Number(w) || 0);
    h = Math.round(Number(h) || 0);
    if (w <= 0 || h <= 0) return '';
    function gd(a, b) { return b ? gd(b, a % b) : a; }
    var d = gd(w, h);
    return (w / d) + ':' + (h / d) + '（' + w + '×' + h + '）';
}

/**
 * 当前编辑对象：d.sel 指向一扇窗 → 返回该窗的 per_win 条目（没有就地创建，字段从房间默认继承）；
 * 没选窗 → 返回房间默认几何的临时副本（own=false，由 logoSet/logoCenter 写回 d.logo 顶层）。
 * 这样"点窗口行调一扇窗"和"不选窗口调默认"共用一套输入框。
 */
function _logoGeoTarget(d) {
    var lg = d.logo;
    var win = _logoFindWin(d.sel);
    if (win) {
        var per = lg.per_win || (lg.per_win = {});
        var geo = per[win.w.id];
        if (!geo) geo = per[win.w.id] = { x: lg.x, y: lg.y, w: lg.w, h: lg.h };
        return { win: win, geo: geo, own: true };
    }
    return { win: null, geo: { x: lg.x, y: lg.y, w: lg.w, h: lg.h }, own: false };
}

/** 点窗口行切换编辑对象（再点同一行回到默认）；只重画页面，草稿与自动保存状态不受影响 */
function logoSelectWin(sc, id) {
    var d = _logoDraftOf();
    if (!d) return;
    d.sel = (d.sel === id) ? '' : id;
    renderLogoEditor();
}

function _logoStatus(text, cls) {
    var el = document.getElementById('lgStat');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'lg-stat' + (cls ? (' ' + cls) : '');
}

function _logoSetInput(id, val) {
    var el = document.getElementById(id);
    if (el) el.value = String(val);
}

/** 画布上的虚框 = LOGO 视频画面在素材窗里的落点（左画布按一扇 16:9 窗演示） */
function _logoPaintBox(lg) {
    var b = document.getElementById('lgBox');
    if (!b || !lg) return;
    b.style.left = (50 + lg.x / 2 - lg.w / 2) + '%';
    b.style.top = (50 + lg.y / 2 - lg.h / 2) + '%';
    b.style.width = lg.w + '%';
    b.style.height = lg.h + '%';
    var sp = b.querySelector('span');
    if (sp) sp.textContent = 'LOGO 画面 ' + lg.w + '%×' + lg.h + '%';
}

/** 侧栏数字框改动：夹到值域、写回输入框、立刻自动保存（不重绘，避免打字被吞） */
function logoSet(field, v) {
    var d = _logoDraftOf();
    if (!d || !d.logo) return;
    var t = _logoGeoTarget(d);
    if (field === 'w') { t.geo.w = _logoPct(v, LOGO_DEF_W); _logoSetInput('lgW', t.geo.w); }
    else if (field === 'h') { t.geo.h = _logoPct(v, LOGO_DEF_H); _logoSetInput('lgH', t.geo.h); }
    else if (field === 'x') { t.geo.x = _logoOff(v, 0); _logoSetInput('lgX', t.geo.x); }
    else if (field === 'y') { t.geo.y = _logoOff(v, 0); _logoSetInput('lgY', t.geo.y); }
    else return;
    if (!t.own) {
        d.logo.x = t.geo.x; d.logo.y = t.geo.y; d.logo.w = t.geo.w; d.logo.h = t.geo.h;
    }
    _logoPaintBox(t.geo);
    _logoStatus('保存中…', '');
    _logoAutoSaveSoon();
}

/** 一键居中：把当前编辑对象的坐标归零（宽高不动） */
function logoCenter() {
    var d = _logoDraftOf();
    if (!d || !d.logo) return;
    var t = _logoGeoTarget(d);
    t.geo.x = 0;
    t.geo.y = 0;
    if (!t.own) { d.logo.x = 0; d.logo.y = 0; }
    _logoSetInput('lgX', 0);
    _logoSetInput('lgY', 0);
    _logoPaintBox(t.geo);
    _logoStatus('已居中，保存中…', '');
    _logoAutoSaveSoon();
}

/** 撤掉选中窗口的独立几何，回落到房间默认 */
function logoResetWin() {
    var d = _logoDraftOf();
    if (!d || !d.logo) return;
    var win = _logoFindWin(d.sel);
    if (!win || !d.logo.per_win) return;
    delete d.logo.per_win[win.w.id];
    if (!Object.keys(d.logo.per_win).length) delete d.logo.per_win;   // 空表不落键
    renderLogoEditor();
    _logoStatus('已恢复默认，保存中…', '');
    _logoAutoSaveSoon();
}

/** 一扇素材窗的显示开关：只动本幕名单，另一幕不受影响 */
function logoToggleWin(sc, id, on) {
    var d = _logoDraftOf();
    if (!d || !d.logo) return;
    var arr = d.logo.windows[sc] || (d.logo.windows[sc] = []);
    var i = arr.indexOf(id);
    if (on && i < 0) arr.push(id);
    if (!on && i >= 0) arr.splice(i, 1);
    _logoStatus('保存中…', '');
    _logoAutoSaveSoon();
}

/** 文件中转：拖拽/点击共用一条上传链路 */
function logoPick() {
    if (s._logoUploading) return;
    var f = document.getElementById('lgFile');
    if (f) f.click();
}
function logoFilePicked(inp) {
    var f = inp.files && inp.files[0];
    inp.value = '';   // 允许连续选同一个文件触发 change
    if (f) logoUpload(f);
}
function logoDragOver(e) {
    if (!_dragHasFiles(e)) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    var c = document.getElementById('lgCanvas');
    if (c) c.classList.add('over');
}
function logoDragLeave(e) {
    var c = document.getElementById('lgCanvas');
    if (c) c.classList.remove('over');
}
function logoDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    var c = document.getElementById('lgCanvas');
    if (c) c.classList.remove('over');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) logoUpload(f);
}

function _logoExtOk(name) {
    var m = String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/);
    return !!m && LOGO_VIDEO_EXT.indexOf(m[1]) >= 0;
}

/**
 * 上传：POST /api/rooms/:id/logo（multipart，服务端转封装 + 抽首帧 + 算 md5）。
 * 成功拿到 {url, thumbnail, filename, md5, size, width, height}，保留原几何与窗口名单，随即自动落库。
 * 上传途中切房间则丢弃这次结果（文件留在服务器，下次上传会被清掉），不把 A 房的 LOGO 写进 B 房。
 */
function logoUpload(file) {
    if (!s.rf) { alert('请先选择房间'); return; }
    if (s._logoUploading) return;
    if (!_logoExtOk(file.name)) { alert('LOGO 只支持视频文件：' + LOGO_VIDEO_EXT.join(' / ')); return; }
    var rid = s.rf;
    s._logoUploading = true;
    s._logoErr = '';
    _logoStatus('上传中 0%…', '');
    var hint0 = document.getElementById('lgHint');
    if (hint0) hint0.textContent = '上传中 0%…';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/rooms/' + encodeURIComponent(rid) + '/logo');
    xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable || s.rf !== rid) return;
        var pct = Math.round(e.loaded / e.total * 100);
        _logoStatus('上传中 ' + pct + '%…', '');
        var hint = document.getElementById('lgHint');
        if (hint) hint.textContent = '上传中 ' + pct + '%…';
    };
    xhr.onload = function () {
        s._logoUploading = false;
        var j = null;
        try { j = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status < 200 || xhr.status >= 300 || !j || j.error) {
            var msg = (j && j.error) || ('HTTP ' + xhr.status);
            s._logoErr = '上传失败：' + msg;
            if (s.rf === rid && s._logoMode) renderLogoEditor();
            alert('LOGO 上传失败：' + msg);
            return;
        }
        if (s.rf !== rid) { alert('房间已切换，这次 LOGO 上传结果已丢弃，请在当前房间重新上传'); return; }
        var d = _logoDraftOf();
        if (!d) { alert('房间数据还没加载完，LOGO 已上传但未写入配置，请重进本页再传一次'); return; }
        var keep = d.logo || { x: 0, y: 0, w: LOGO_DEF_W, h: LOGO_DEF_H, windows: { A: [], B: [] } };
        d.logo = {
            url: j.url,
            thumbnail: j.thumbnail || '',
            filename: j.filename || '',
            md5: j.md5 || '',
            size: j.size || 0,
            width: j.width || 0,
            height: j.height || 0,
            x: _logoOff(keep.x, 0),
            y: _logoOff(keep.y, 0),
            w: _logoPct(keep.w, LOGO_DEF_W),
            h: _logoPct(keep.h, LOGO_DEF_H),
            windows: {
                A: (keep.windows && Array.isArray(keep.windows.A) ? keep.windows.A : []).slice(),
                B: (keep.windows && Array.isArray(keep.windows.B) ? keep.windows.B : []).slice()
            }
        };
        if (keep.per_win && Object.keys(keep.per_win).length) {
            d.logo.per_win = JSON.parse(JSON.stringify(keep.per_win));
        }
        s._logoNote = '已上传';
        s._logoErr = '';
        if (s._logoMode) renderLogoEditor();
        _logoSaveSnap({ roomId: rid, want: _logoSnap(d.logo), logo: JSON.parse(JSON.stringify(d.logo)) });
    };
    xhr.onerror = function () {
        s._logoUploading = false;
        s._logoErr = '上传失败：网络错误';
        if (s.rf === rid && s._logoMode) renderLogoEditor();
        alert('LOGO 上传失败：网络错误');
    };
    var fd = new FormData();
    fd.append('file', file);
    xhr.send(fd);
}

/** 移除：从 config 里删掉整个 logo（文件留在服务器，下次上传时服务端会清掉旧文件） */
function logoRemove() {
    var d = _logoDraftOf();
    if (!d || !d.logo || !s.rf) return;
    if (!confirm('移除本房间的 LOGO？设备端会停止叠加；文件留在服务器上，下次上传会被覆盖。')) return;
    var rid = s.rf;
    d.logo = null;
    s._logoNote = '已移除';
    s._logoErr = '';
    renderLogoEditor();
    _logoSaveSnap({ roomId: rid, want: '', logo: null });
}

/** 改动后的自动保存：500ms 防抖；快照在改动这一刻取，切页/切房间也不会丢 */
function _logoAutoSaveSoon() {
    var d = _logoDraftOf();
    if (!d || !s.rf) return;
    var snap = { roomId: s.rf, want: _logoSnap(d.logo), logo: d.logo ? JSON.parse(JSON.stringify(d.logo)) : null };
    if (s._logoTimer) clearTimeout(s._logoTimer);
    s._logoTimer = setTimeout(function () {
        s._logoTimer = null;
        _logoSaveSnap(snap);
    }, TABLE_AUTO_SAVE_MS);
}

/**
 * 把一份 LOGO 快照落库：串行队列，先 flushAutoSync 再 GET 最新 config，只换 config.logo 再 PUT。
 * resolve(null) = 成功；resolve(Error) = 失败（红字已更新）。
 */
function _logoSaveSnap(snap) {
    if (!snap || !snap.roomId) return Promise.resolve(null);
    var job = function () {
        return flushAutoSync()
            .then(function () { return apiGet('/api/rooms/' + encodeURIComponent(snap.roomId)); })
            .then(function (roomObj) {
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                if (snap.logo) cfg.logo = JSON.parse(JSON.stringify(snap.logo)); else delete cfg.logo;
                return apiCall('/api/rooms/' + encodeURIComponent(snap.roomId), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                }).then(function () { return cfg; });
            })
            .then(function (cfg) {
                var idx = s.rooms.findIndex(function (x) { return x.id === snap.roomId; });
                if (idx >= 0) {
                    var room = JSON.parse(JSON.stringify(s.rooms[idx]));
                    room.config = JSON.stringify(cfg);
                    s.rooms[idx] = room;
                }
                var cur = s._logoDraft;
                if (cur && cur.roomId === snap.roomId) cur.base = snap.want;
                s._logoErr = '';
                if (s._logoMode && cur && cur.roomId === snap.roomId) _logoStatus(s._logoNote || '已自动保存', 'ok');
                return null;
            })
            .catch(function (e) {
                s._logoErr = '自动保存失败：' + e.message;
                if (s._logoMode) _logoStatus(s._logoErr, 'err');
                return e;
            });
    };
    s._logoSaveQ = (s._logoSaveQ || Promise.resolve()).then(job, job);
    return s._logoSaveQ;
}

function _logoSize(n) {
    n = Number(n) || 0;
    if (n <= 0) return '';
    return n >= 1048576 ? (Math.round(n / 104857.6) / 10) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

/** 一幕的素材窗口列表（只列 SCENE_A/SCENE_B 素材窗；点歌窗/HDMI/纯色窗不参与 LOGO） */
function _logoWinListHtml(sc, lg) {
    var r = s.rooms.find(function (x) { return x.id === s.rf; });
    var head = '<div class="lg-scene">' + (sc === 'A' ? '第一幕 (A)' : '第二幕 (B)') + ' 素材窗口</div>';
    if (!r) return head + '<div class="lg-hint">房间数据还没加载完。</div>';
    var cfg = _loadRoomCfg(r);
    var wins = (cfg.scenes[sc] || {}).windows || [];
    var mats = wins.filter(function (w) {
        var t = w && w.content && w.content.type;
        return t === 'SCENE_A' || t === 'SCENE_B';
    });
    if (!mats.length) return head + '<div class="lg-hint">这一幕还没有素材窗口（先到「窗口配置」里添加）。</div>';
    var on = (lg && lg.windows && Array.isArray(lg.windows[sc])) ? lg.windows[sc] : [];
    var dis = (lg && lg.url) ? '' : ' disabled';
    var selId = (s._logoDraft && s._logoDraft.roomId === s.rf && s._logoDraft.sel) || '';
    var h = head;
    mats.forEach(function (w) {
        var checked = on.indexOf(w.id) >= 0;
        var own = !!(lg && lg.per_win && lg.per_win[w.id]);
        var meta = esc(w.id) + ' · ' + Math.round(Number(w.x) || 0) + ',' + Math.round(Number(w.y) || 0)
            + ' ' + Math.round(Number(w.width) || 0) + '×' + Math.round(Number(w.height) || 0);
        var ratio = _logoRatio(w.width, w.height);
        if (ratio) meta += ' · ' + esc(ratio);
        if (lg && lg.url) meta += ' · ' + (own ? '<span style="color:#c99ee0">独立定位</span>' : '跟随默认');
        if (w.enabled === false) meta += ' · 已隐藏';
        h += '<div class="lg-win' + (selId === w.id ? ' sel' : '') + '">'
            + '<div class="lg-name" style="min-width:0" title="' + escA('点击单独调整这扇窗的 LOGO 位置/大小；再点一次回到默认') + '"'
            + ' onclick="logoSelectWin(\'' + sc + '\',\'' + escJsA(w.id) + '\')">'
            + '<span class="lg-win-id">' + esc(w.name || w.id) + '</span>'
            + '<span class="lg-win-meta">' + meta + (selId === w.id ? ' · <span style="color:#9b59b6">正在编辑</span>' : '') + '</span></div>'
            + '<label class="wb-sw" title="' + escA('开 = 这扇窗口允许叠加 LOGO（还要该文件夹的 LOGO 开关也开着）') + '">'
            + '<span class="tk"><input type="checkbox"' + (checked ? ' checked' : '') + dis
            + ' aria-label="' + escA((sc === 'A' ? '第一幕' : '第二幕') + ' 窗口 ' + (w.name || w.id) + ' 显示 LOGO') + '"'
            + ' onchange="logoToggleWin(\'' + sc + '\',\'' + escJsA(w.id) + '\',this.checked)">'
            + '<span class="sl"></span><span class="kb"></span></span></label></div>';
    });
    return h;
}

function _logoHtml() {
    var d = _logoDraftOf();
    if (!d) return '<div class="empty" style="margin-top:10px">房间数据还没加载完，关掉「LOGO设置」再开一次</div>';
    var lg = d.logo || { x: 0, y: 0, w: LOGO_DEF_W, h: LOGO_DEF_H, windows: { A: [], B: [] } };
    var has = !!(d.logo && d.logo.url);
    var dis = has ? '' : ' disabled';
    // 当前编辑对象：选中某扇窗 → 用该窗几何（没单独设过则显示默认值）；否则用房间默认几何
    var selWin = _logoFindWin(d.sel || '');
    var ownSel = false;

// ============================================================================
// Phase2: 多窗口配置编辑器
// ============================================================================
var _canvasScale = 1, _canvasOffsetX = 0, _canvasOffsetY = 0;
// 画布可见区（设计坐标）：一般就是整块输出基准；副屏关时缩到主屏那半，_canvasOffset* 与所有换算都以它为原点
var _viewX = 0, _viewY = 0, _viewW = 1920, _viewH = 1080;
var _dragging = null;

// ============================================================================
// 【F-09f】房间输出基准（config.output）：编辑器画布那把尺 = 设备落屏那把尺
//   窗口 x/y/width/height 全写在这个坐标系里，设备按 屏宽/基准宽 与 屏高/基准高 两个轴向分别换算
//   （MainActivity.windowGeom）。没设 = 1920×1080 设计稿（历史口径）：屏不是 16:9 时两个分母不相等，
//   数据里的正方形落屏就成了长方形（20:9 的手机上 sx/sy 正好 1.25）。
//   把基准改成这台屏的真实像素（设备心跳自报、这里直接一键取）⇒ 两个分母相等 ⇒ 所见即所得。
//   _designW/_designH 每次重绘画布按当前房间刷新，吸附线、辅助线、新建窗口的默认尺寸共用它。
//   注意：基准变了屏上是「重排」而不是「倒带」——旧版 APK 不认这个字段（仍按 1920×1080 理解坐标），
//   给还没升级到本功能的设备设基准，反而会让屏上比编辑器宽出一截；那一档按钮上会写清楚。
// ============================================================================
var DESIGN_DEFAULT_W = 1920, DESIGN_DEFAULT_H = 1080;
var OUT_PX_MIN = 16, OUT_PX_MAX = 7680;   // 与服务端 outputPx / 设备端 designW 同一把尺
var _designW = DESIGN_DEFAULT_W, _designH = DESIGN_DEFAULT_H;

function _outPx(v) {
    var n = (typeof v === 'number' || typeof v === 'string') ? Number(v) : NaN;
    return Number.isInteger(n) && n >= OUT_PX_MIN && n <= OUT_PX_MAX ? n : null;
}

/** 任意一份 config（对象或 JSON 字符串，脏数据一律当"没设"）→ 输出基准；没设回落到 1920×1080 设计稿 */
function _designOf(cfg) {
    var c = cfg;
    try { if (typeof c === 'string') c = JSON.parse(c); } catch (e) { c = {}; }
    var o = (c && typeof c === 'object' && typeof c.output === 'object' && c.output) || null;
    var w = o ? _outPx(o.w) : null, h = o ? _outPx(o.h) : null;
    return { w: w || DESIGN_DEFAULT_W, h: h || DESIGN_DEFAULT_H, set: !!(w && h) };
}

/** 当前选中房间的输出基准（s.rooms 那份来自列表接口，进出房间都以它为准） */
function _roomDesign() {
    var r = (s.rooms || []).find(function (x) { return x.id === s.rf; });
    return _designOf(r && r.config);
}

/**
 * 本房间已授权设备自报的屏幕像素（心跳 screen_w/screen_h → GET /api/devices 的 d.screen）。
 * 同一间房挂不同尺寸的屏时全列出来各给一个按钮 —— 它们物理上就是两套画面，只能挑一把尺当基准；
 * 同型号多台去重，免得 6 台同盒子刷出 6 个一模一样的按钮。
 */
function _deviceScreens() {
    var out = [];
    (s.ds || []).forEach(function (d) {
        if (d.room_id !== s.rf || d.authorized !== 1 || !d.screen) return;
        var w = _outPx(d.screen.w), h = _outPx(d.screen.h);
        if (!w || !h) return;
        if (out.some(function (o) { return o.w === w && o.h === h; })) return;
        out.push({ w: w, h: h, name: d.name || d.model || '设备' });
    });
    return out;
}

/**
 * 本房间已授权设备的副屏状态是否全部明确为「关」（心跳 secondary_display → GET /api/devices 的 d.secondary_display）。
 * 只要有一台开着、或有一台没上报（null = 老版本/无这条显示链），都不算——宁可整屏也别画错区域。
 */
function _auxAllOff() {
    var seen = false;
    var anyOn = (s.ds || []).some(function (d) {
        if (d.room_id !== s.rf || d.authorized !== 1) return false;
        seen = true;
        return d.secondary_display !== false;
    });
    return seen && !anyOn;
}

/**
 * 画布可见区（设计坐标）。双屏合一的输出基准（宽高比 ≥ 2.4，单屏 16:9/21:9 都到不了）
 * 且本房间设备全部报告副屏关闭时，只画主屏那半（右半 w/2 × h）：窗口框按两倍大小铺满容器，左半空白不再占位。
 * 其余情况整屏——单屏房间副屏本来就无所谓，不能因为设备报 false 就把画面切掉一半。
 */
function _canvasView() {
    if (_designW / _designH >= 2.4 && _auxAllOff()) {
        return { x: _designW / 2, y: 0, w: _designW / 2, h: _designH };
    }
    return { x: 0, y: 0, w: _designW, h: _designH };
}

/** 输出基准那一行的 HTML（画布右下角）；设备屏不是 16:9 而基准还没设时，把拉伸这句风险提示带上 */
function _designToolsHtml() {
    var d = _roomDesign();
    var list = _deviceScreens();
    var h = '<div class="win-base-tools">基准';
    h += '<input type="number" id="odW" value="' + d.w + '" min="' + OUT_PX_MIN + '" max="' + OUT_PX_MAX + '" step="1">';
    h += '×<input type="number" id="odH" value="' + d.h + '" min="' + OUT_PX_MIN + '" max="' + OUT_PX_MAX + '" step="1">px';
    list.forEach(function (o) {
        h += '<button class="lock-btn' + (d.w === o.w && d.h === o.h ? ' active' : '') + '" '
            + 'onclick="saveOutputBase(' + o.w + ',' + o.h + ')" '
            + 'title="按这台设备自报的真实屏幕像素当基准并立即保存（' + escA(o.name) + '）">' + o.w + '×' + o.h + '</button>';
    });
    if (!list.length) {
        h += '<button class="lock-btn" disabled title="本房间没有在线、已授权、且上报过屏幕像素的设备。'
            + '屏幕像素由设备心跳带上来（需装到本功能之后的版本），也可以直接在左边两个框里手填再点保存">取本机</button>';
    }
    h += '<button class="lock-btn" onclick="saveOutputBase()" title="保存这把尺：画布与设备从此按同一个坐标系摆窗口">保存</button>';
    if (d.set) h += '<button class="lock-btn" onclick="saveOutputBase(0,0)" title="撤掉基准，回到 1920×1080 设计稿轴向铺满整屏">还原设计稿</button>';
    // 1920×1080 设计稿铺满 16:9 屏时两个分母相等，形状不变；其余屏（20:9 手机、带鱼屏、4:3 投影）正方形必被拉长
    if (!d.set && list.some(function (o) { return Math.abs(o.w / o.h - 16 / 9) > 0.02; })) {
        h += '<span style="color:#c8863a" title="这台屏不是 16:9，按默认设计稿铺满会把正方形拉成长方形。'
            + '点上面那档本机像素再保存就一致了">⚠ 非16:9</span>';
    }
    return h + '</div>';
}

/**
 * 保存/撤掉输出基准。口径同 wpSave：先 flushAutoSync 把防抖里的窗口编辑落库，
 * 再 GET 房间真值改这一个键、整份 PUT 回去 —— config PUT 是整体替换，
 * 拿 s.rooms 里那份旧的覆盖过去会抹掉别人刚改的素材映射/墙板码值。
 * w、h 都给 0 = 撤掉基准，回到 1920×1080 设计稿；越界或非整数由前端先挡、服务端再挡一道（400）。
 * 服务端收敛点按 rev 差异发 update_windows，设备原地重排，不打断正在播的视频。
 */
async function saveOutputBase(w, h) {
    if (!s.rf) return;
    if (w === undefined || h === undefined) {
        var iw = document.getElementById('odW'), ih = document.getElementById('odH');
        w = iw ? parseInt(iw.value, 10) : NaN;
        h = ih ? parseInt(ih.value, 10) : NaN;
    }
    var clear = (w === 0 || h === 0);
    if (!clear && (!_outPx(w) || !_outPx(h))) {
        alert('输出基准是这台屏的真实像素，两个都要 ' + OUT_PX_MIN + '~' + OUT_PX_MAX + ' 之间的整数（例如 2400 × 1080）。\n'
            + '要撤掉基准、回到 1920×1080 设计稿，点「还原设计稿」。');
        return;
    }
    try {
        await flushAutoSync();
        var roomObj = await apiGet('/api/rooms/' + encodeURIComponent(s.rf));
        if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
        var cfg = _loadRoomCfg(roomObj);
        if (clear) delete cfg.output; else cfg.output = { w: w, h: h };
        await apiCall('/api/rooms/' + encodeURIComponent(s.rf), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config: JSON.stringify(cfg) })
        });
        // 以服务端那份为准回灌内存（存进去的形状是归一过的，别拿本地猜测值刷画布）
        var fresh = await apiGet('/api/rooms/' + encodeURIComponent(s.rf));
        var ridx = (s.rooms || []).findIndex(function (x) { return x.id === s.rf; });
        if (ridx >= 0 && fresh && !fresh.error) s.rooms[ridx].config = fresh.config;
    } catch (e) {
        alert('保存输出基准失败: ' + e.message);
    }
    renderWinEditorFull();   // 成功要按新尺子重画，失败也要（按钮/输入框回到库里的值）
}


/**
 * 几何行（位置/尺寸/比例锁定/比例预设）——同一套控件、两种编辑对象：

    });

        + (asCrop ? '' : '；拖动与拖角默认吸附画布/其它窗口的边和中心，按住 Shift 临时不吸（开关在画布右上角）') + '</div>';

/** 内容变换行（镜像/框内旋转）：与设备侧矩阵同序（截取 → 90°预缩放 → 旋转 → 镜像） */
function _winFlipRotRowsHtml(w) {
    var _wflip = w.flip || 'none';
    var _wrot = w.rotation || 0;
    var h = '<div class="win-prop-row"><label>镜像</label><select onchange="updWinField(\'flip\',this.value)"><option value="none"' + (_wflip==='none'?' selected':'') + '>无</option><option value="h"' + (_wflip==='h'?' selected':'') + '>水平</option><option value="v"' + (_wflip==='v'?' selected':'') + '>垂直</option></select></div>';
    h += '<div class="win-prop-row"><label>旋转</label><div style="display:flex;gap:4px;flex:1">';

// ============================================================================
// 【F-09c】窗口画布吸附（纯编辑辅助：只改拖动落点，不进 windows 数据模型、不下发设备）
//   目标线 = 画布四条边 + 横竖中心线，加上其它每个窗口的左/右边、上/下边和横竖中心线；
//   被拖的框用「左边 · 水平中心 · 右边」去贴竖线，「上边 · 垂直中心 · 下边」去贴横线。
//   容差按屏幕像素给，再按 _canvasScale 折算回设计像素 —— 收起侧栏/浏览器缩放下手感一致。
//   开关在画布右上角与输入截取画板工具行（同一份本地偏好 xsnap，与房间配置无关）；拖动中按住 Shift = 这一帧不吸附。

var SNAP_SCREEN_PX = 7;

/** 画布自身的线排在窗口线之前时，等距离要优先吸它（比"贴住某扇窗的边"更正） */
function _isCanvasSnapLine(line) {
    // 画布边/中心按当前可见区算（整屏时与旧的 0/960/1920/540/1080 逐字相同，副屏关时改为主屏那半的四边和中心）
    return line === _viewX || line === _viewY || line === _viewX + _viewW || line === _viewY + _viewH ||
        line === _viewX + _viewW / 2 || line === _viewY + _viewH / 2;
}

/** 吸附候选竖线/横线：画布可见区边与中心 + 其余窗口的边与中心（排除自己，否则一动就贴着自己） */
function _snapLines(excludeId) {
    var v = [_viewX, _viewX + _viewW / 2, _viewX + _viewW], h = [_viewY, _viewY + _viewH / 2, _viewY + _viewH];
    (s._winCache || []).forEach(function(o) {
        if (o.id === excludeId) return;
        var x = o.x || 0, y = o.y || 0, ww = o.width || 0, hh = o.height || 0;
        // 可见区外的窗（副屏关时左半留下的）画布上看不见，别让它们的边把可见窗吸走
        if (x + ww < _viewX || x > _viewX + _viewW || y + hh < _viewY || y > _viewY + _viewH) return;
        v.push(x, x + ww / 2, x + ww);
        h.push(y, y + hh / 2, y + hh);
    });

}

/**
 * 一组待吸点对一组线，取容差内最近的一条。
 * @param {?boolean} allCanvas 目标线全部来自容器本身（输入截取的画板就是这种，没有"别的窗口"），
 *        此时不必再靠 _isCanvasSnapLine 区分优先级 —— 归一化坐标下坐标差远小于下面 0.5 的"等距"判定，
 *        不关掉判定会让 line=0 白占便宜。

 */
function _snapShift(points, lines, tol, allCanvas) {
    var best = null;
    lines.forEach(function(line) {

    });
    return best;
}

/** 命中结果记账：同一目标线只画一条 */

}

    var canvas = document.getElementById('winCanvas');

    canvas.querySelectorAll('.win-guide').forEach(function(el) { el.parentNode.removeChild(el); });
    // 画布盒子就在可见区上，窗口框/辅助线一律用「设计坐标 − 可见区原点」落位，与 _renderWinRects 同式
    var dw = Math.round(_viewW * _canvasScale), dh = Math.round(_viewH * _canvasScale);
    _snapGuides.v.forEach(function(x) {
        var el = document.createElement('div');
        el.className = 'win-guide vg';
        el.style.left = Math.round((x - _viewX) * _canvasScale) + 'px';
        el.style.top = '0px';
        el.style.height = dh + 'px';
        canvas.appendChild(el);
    });
    _snapGuides.h.forEach(function(y) {
        var el = document.createElement('div');
        el.className = 'win-guide hg';
        el.style.top = Math.round((y - _viewY) * _canvasScale) + 'px';
        el.style.left = '0px';
        el.style.width = dw + 'px';
        canvas.appendChild(el);

}

function _clearSnapGuides() {
    _snapGuides = { v: [], h: [] };
    _paintSnapGuides();
}

/** 画布/画板共用的吸附开关：只改编辑手感，不动房间配置，所以不触发自动同步 */
function toggleSnap() {
    s._snap = !s._snap;
    localStorage.setItem('xsnap', s._snap ? '1' : '0');
    // 两个界面各挂一颗开关（窗口配置右上角、输入截取画板工具行），状态同源，一起点亮
    document.querySelectorAll('.snap-btn').forEach(function(b) {
        b.className = 'lock-btn snap-btn' + (s._snap ? ' active' : '');
        b.textContent = '🧲 吸附 ' + (s._snap ? '开' : '关');
    });
    if (_dragging) { _dragging = null; _clearSnapGuides(); }   // 正拖着就当场收手，别让旧辅助线留在屏上
    if (_cropDrag) { _cropDrag = null; _clearCropSnapGuides(); }
}

function winCanvasMouseMove(e) {
    if (!_dragging) return;
    var dx = e.clientX - _dragging.startX, dy = e.clientY - _dragging.startY;
    var sW = _dragging.startWin, id = _dragging.winId;
    var wins = s._winCache || [], w = wins.find(function(x) { return x.id === id; });
    if (!w) return;
    _snapGuides = { v: [], h: [] };
    // Shift 按住 = 这一帧不吸附（要摆 1px 的错位时不用先去关开关）
    var snapOn = s._snap && !e.shiftKey;
    var tol = snapOn ? SNAP_SCREEN_PX / _canvasScale : 0;
    var lines = snapOn ? _snapLines(id) : null;
    // 副屏关（可见区只是输出的一截）时把落点收在可见区内：画布外的框看不见也拖不回来，等于丢窗
    var cropView = _viewW < _designW || _viewH < _designH;
    if (_dragging.mode === 'move') {
        var newX = Math.max(0, Math.round(sW.x + dx / _canvasScale));
        var newY = Math.max(0, Math.round(sW.y + dy / _canvasScale));
        if (tol) {
            // 整框平移，所以左/中/右三个点吸到同一条线时位移量一起作用在 x 上
            var hitV = _snapShift([newX, newX + w.width / 2, newX + w.width], lines.v, tol);
            var hitH = _snapShift([newY, newY + w.height / 2, newY + w.height], lines.h, tol);
            if (hitV) { newX += hitV.d; _snapTake('v', hitV); }
            if (hitH) { newY += hitH.d; _snapTake('h', hitH); }
            newX = Math.max(0, Math.round(newX));
            newY = Math.max(0, Math.round(newY));
        }
        if (cropView) {
            newX = Math.min(Math.max(newX, _viewX), Math.max(_viewX, _viewX + _viewW - w.width));
            newY = Math.min(Math.max(newY, _viewY), Math.max(_viewY, _viewY + _viewH - w.height));
        }
        w.x = newX; w.y = newY;
    } else {
        var newW = Math.max(64, Math.round(sW.width + dx / _canvasScale));
        var newH = Math.max(64, Math.round(sW.height + dy / _canvasScale));
        if (cropView) {
            newW = Math.min(newW, Math.max(64, Math.round(_viewX + _viewW - sW.x)));
            newH = Math.min(newH, Math.max(64, Math.round(_viewY + _viewH - sW.y)));

            if (hitB) { newH = Math.max(64, Math.round(b + hitB.d - sW.y)); _snapTake('h', hitB); }
        }
        if (s._winRatioLock && s._winRatioLock[id]) { newH = Math.round(newW * sW.height / sW.width); }

    }
    _paintSnapGuides();

    if (s._selWin && s._selWin.id === id) { s._selWin.x = w.x; s._selWin.y = w.y; s._selWin.width = w.width; s._selWin.height = w.height; }
    ['wpX','wpY','wpW','wpH'].forEach(function(id2, i) { var el = document.getElementById(id2); if (el) el.value = [w.x,w.y,w.width,w.height][i]; });

function winCanvasMouseUp() {
    if (_dragging) {

        // 取的是 _dragging.id，而对象里存的键叫 winId，永远查不到窗口 —— 死代码，删）
        _dragging = null;

    }

// Arena 对标属性 → 画布占位框样式（renderWinCanvas 初建与 _renderWinRects 局部重绘共用，保证实时预览一致）
function _applyWinTransform(el, w) {
    var op = (w.opacity == null) ? 1 : w.opacity;
    var br = (w.brightness == null) ? 1 : w.brightness;
    var en = (w.enabled == null) ? true : w.enabled;
    if (!en) op *= 0.25;
    el.style.opacity = op;
    el.style.filter = 'brightness(' + (0.15 + 0.85 * br) + ')';
    var t = [];
    if (w.rotation) t.push('rotate(' + w.rotation + 'deg)');
    if (w.flip === 'h') t.push('scaleX(-1)');
    if (w.flip === 'v') t.push('scaleY(-1)');
    el.style.transform = t.length ? t.join(' ') : 'none';
    el.style.transformOrigin = 'center';
    el.style.borderStyle = en ? 'solid' : 'dashed';
}

function _renderWinRects(wins) {
    wins.forEach(function(w) {
        var el = document.querySelector('[data-win-id="' + w.id + '"]');
        if (!el) return;
        el.style.left = (((w.x||0) - _viewX) * _canvasScale) + 'px';
        el.style.top = (((w.y||0) - _viewY) * _canvasScale) + 'px';
        el.style.width = ((w.width||320) * _canvasScale) + 'px';
        el.style.height = ((w.height||180) * _canvasScale) + 'px';
        _applyWinTransform(el, w);
        if (_winKind(w) !== _curWinTab()) el.style.opacity = _dimWinOpacity(w);
    });
}

/** 当前卡（缺省素材窗），与侧栏列表的归类同一口径 */
function _curWinTab() { return s._winTab === 'video' ? 'video' : 'material'; }

/** 非当前卡窗口的压暗不透明度：叠在窗口自身 opacity/enabled 之上（_applyWinTransform 会先写 opacity） */
function _dimWinOpacity(w) {
    return ((w.opacity == null ? 1 : w.opacity) * (w.enabled === false ? 0.25 : 1) * 0.28).toFixed(3);
}

// ============================================================================
// 【F-09b】【输入截取 crop】Arena Slice InputRect 对标：素材画面内的取景区（归一化 0..1）
// 设备侧把取景区拉伸填满窗口框（允许变形，与 Arena 原语义一致），故此处所见即所得。
// 缺省/非法 = 全画面 {x:0,y:0,w:1,h:1}，老配置无需迁移即保持旧行为。
// ============================================================================
function _isVideoWin(w) {
    var t = (w && w.content && w.content.type) ? String(w.content.type).toUpperCase() : 'SCENE_A';
    return t === 'SCENE_A' || t === 'SCENE_B';
}

// 取景框数字控件的像素基准：输入画面统一按 1920×1080 计，与输出窗口的设备像素同一口径（内部仍存归一化 crop）
var _IN_W = 1920, _IN_H = 1080;

/** 读取并夹紧窗口取景区：越界回推、宽高下限 5%，结果保证 x+w<=1、y+h<=1 */
function _cropOf(w) {
    var c = (w && w.crop) || {};
    var dv = function(v, def) { return (typeof v === 'number' && isFinite(v)) ? v : def; };
    var r4 = function(v) { return Math.round(v * 10000) / 10000; };
    var x = Math.min(Math.max(r4(dv(c.x, 0)), 0), 0.95);
    var y = Math.min(Math.max(r4(dv(c.y, 0)), 0), 0.95);
    var cw = Math.max(r4(dv(c.w, 1)), 0.05);
    var ch = Math.max(r4(dv(c.h, 1)), 0.05);
    if (x + cw > 1) cw = Math.max(r4(1 - x), 0.05);
    if (y + ch > 1) ch = Math.max(r4(1 - y), 0.05);
    return { x: x, y: y, w: cw, h: ch };
}

/** 取景框把手：8 向（4 角 + 4 边），data-cdir 供拖动方向判定；cfSize 为取景尺寸实时回显 */
function _cropFrameHtml() {
    return '<div class="cf-size" id="cfSize"></div><div class="cf-orien" id="cfOrien">▲</div>' + ['nw','n','ne','w','e','sw','s','se'].map(function(d) {
        return '<div class="cf-h cf-' + d + '" data-cdir="' + d + '"></div>';
    }).join('');
}

/** 写回取景区的唯一入口：始终新建对象（不与 s._selWin 共享引用），再刷新画板与输出预览 */
function _setWinCrop(w, crop) {
    if (!w) return;
    w.crop = _cropOf({ crop: crop });
    if (s._selWin && s._selWin.id === w.id && s._selWin !== w) s._selWin.crop = Object.assign({}, w.crop);
    _paintCropUI();
}

function resetWinCrop() {
    if (!s._selWin) return;
    var id = s._selWin.id, wins = s._winCache || [];
    _setWinCrop(wins.find(function(x) { return x.id === id; }) || s._selWin, { x: 0, y: 0, w: 1, h: 1 });
    autoSyncWinConfig();
}

/**
 * 侧栏数字框改取景（绿框）：field = x/y/width/height，值为输入画面像素（_IN_W×_IN_H 基准），
 * 内部仍按归一化 0..1 存 crop。比例锁定用取景独立的 s._cropRatioLock，与输出窗口互不干扰。
 */
function updWinCropField(field, value) {
    if (!s._selWin || !isFinite(parseInt(value, 10))) return;
    var id = s._selWin.id;
    var w = (s._winCache || []).find(function(x) { return x.id === id; }) || s._selWin;
    var c0 = _cropOf(w), k = c0.w / c0.h;
    var full = (field === 'y' || field === 'height') ? _IN_H : _IN_W;
    var v = Math.min(Math.max(parseInt(value, 10), 0), full) / full;
    var c = { x: c0.x, y: c0.y, w: c0.w, h: c0.h };
    var locked = !!(s._cropRatioLock && s._cropRatioLock[id]);

    else if (field === 'y') c.y = v;
    else if (field === 'width') { c.w = v; if (locked) c.h = v / k; }
    else { c.h = v; if (locked) c.w = v * k; }
    _setWinCrop(w, c);
    autoSyncWinConfig();
}

function toggleCropRatio(id) {
    if (!s._cropRatioLock) s._cropRatioLock = {};
    s._cropRatioLock[id] = !s._cropRatioLock[id];
    var btn = document.getElementById('wpRatioLock');
    if (btn) { btn.className = 'lock-btn' + (s._cropRatioLock[id] ? ' active' : ''); btn.textContent = (s._cropRatioLock[id] ? '🔒' : '🔓') + ' 锁定'; }
}

/** 取景比例预设：输入画面本身是 16:9，要让取景像素区成 rw:rh，归一化宽高比需再乘 9/16 */
function setCropRatio(ratioStr) {
    if (!s._selWin) return;
    var parts = ratioStr.split(','), rw = parseInt(parts[0]), rh = parseInt(parts[1]);
    if (!rw || !rh) return;
    var id = s._selWin.id;
    var w = (s._winCache || []).find(function(x) { return x.id === id; }) || s._selWin;
    var c0 = _cropOf(w);
    var nw = c0.h * (rw / rh) * 9 / 16, nh = c0.h;

    var f = Math.min(1, (1 - c0.x) / nw, (1 - c0.y) / nh);
    _setWinCrop(w, { x: c0.x, y: c0.y, w: nw * f, h: nh * f });
    autoSyncWinConfig();
}

/** 归一化 crop → 输入画面像素（数字框、绿框徽标、状态条共用同一口径） */
function _cropPx(c) {
    return { x: Math.round(c.x * _IN_W), y: Math.round(c.y * _IN_H), w: Math.round(c.w * _IN_W), h: Math.round(c.h * _IN_H) };
}

/** 绿框拖动/输入后把取景像素值回写侧栏；跳过正在输入的框，免得夹紧值抢光标 */
function _syncCropInputs(c) {

    Object.keys(map).forEach(function(k) {

        if (el && el !== document.activeElement) el.value = map[k];
    });
}
