        h += '<div class="crop-out-preview" id="cropOutPreview" style="margin-top:6px"><div id="cropOutInner"></div></div>';
        h += '<div class="crop-out-cap" id="cropOutTitle">输出 ' + (cur.width||0) + '×' + (cur.height||0) + ' px</div>';
        if (!_isVideoWin(cur)) h += '<div class="crop-hint" style="margin-top:4px;color:#c8a">当前切片内容无视频画面（' + (cur.content && cur.content.type === 'HDMI' ? '点歌屏' : '测试背景') + '），取景暂不影响设备显示。</div>';
    }
    h += '<button class="win-save-btn" id="winSaveBtn" style="margin-top:auto" onclick="saveWindows()">💾 保存并推送</button>';
    h += '</div>';
    h += '<div class="crop-stage" id="cropStage">';
    h += '<div class="crop-stage-head" id="cropStageHead"></div>';
    h += '<div class="crop-board" id="cropBoard"><div class="crop-board-tag">16:9 输入画面</div>' + (cur ? '<div class="crop-frame" id="cropFrame" tabindex="0">' + _cropFrameHtml() + '</div>' : '') + '</div>';
    h += '<div class="crop-tools" id="cropTools"><div class="crop-hint" id="cropHint">' + (cur ? '绿框即该切片的取景区：拖动框体平移、拖 8 个把手缩放，或用上方数字框直接输入 px（输入画面按 ' + _IN_W + '×' + _IN_H + ' 计）；框外暗化部分不会输出，▲ 为该输入画面旋转/镜像后的朝向。' : '请先在左侧选择一个切片，再在其独属的 16:9 输入画面中取景。') + '</div>' + (cur ? '<button class="lock-btn snap-btn' + (s._snap ? ' active' : '') + '" onclick="toggleSnap()" title="拖动/缩放取景框时贴齐画板的边和横竖中心线；拖动中按住 Shift 临时不吸附">🧲 吸附 ' + (s._snap ? '开' : '关') + '</button><button class="win-crop-btn" onclick="resetWinCrop()">↺ 重置为全画面</button>' : '') + '</div>';
    h += '</div></div>';
    area.innerHTML = h;
    _layoutCropBoard();
    if (cur) _paintCropUI();
    _bindCropBoard();
}

/** 画板按 16:9 等比适配舞台可用空间（底图与输入画面同比例，画板像素即取景比例） */
function _layoutCropBoard() {
    var stage = document.getElementById('cropStage'), board = document.getElementById('cropBoard');
    if (!stage || !board) return;
    var head = document.getElementById('cropStageHead'), tools = document.getElementById('cropTools') || document.getElementById('cropHint');
    var availH = Math.max(140, stage.clientHeight - 26 - (head ? head.offsetHeight : 0) - (tools ? tools.offsetHeight : 0) - 16);
    var availW = Math.max(200, stage.clientWidth - 26);
    var bw = Math.min(availW, availH * 16 / 9);
    board.style.width = Math.round(bw) + 'px';
    board.style.height = Math.round(bw * 9 / 16) + 'px';
}

// ============================================================================
// 【视口变化重排】画布/画板的缩放系数是按容器 CSS 像素算的，Ctrl+滚轮缩放会改变容器尺寸，
// 不重算就停在旧比例上（画布偏大被裁切、或挤成一条）。缩放/改窗口大小在 Chrome、Firefox、Safari
// 里触发的事件并不一致（window resize 与 visualViewport resize），所以两路都挂。
// ============================================================================
var _vpTimer = null, _vpSizeKey = '';

function _onViewportChange() {
    if (_vpTimer) return;   // 滚轮连滚：合并成一次
    _vpTimer = setTimeout(function() {
        _vpTimer = null;
        var el = null, key = '';
        if (s._cropMode) {
            if (_cropDrag) return;
            el = document.getElementById('cropStage');
            if (el) key = 'c' + el.clientWidth + 'x' + el.clientHeight;
        } else if (s._windowEditorActive && !_dragging && s._winKey === _winCacheKey() && s._winCache) {
            el = document.getElementById('winCanvasArea');
            if (el) key = 'w' + el.clientWidth + 'x' + el.clientHeight;
        }
        if (!el || key === _vpSizeKey) return;
        _vpSizeKey = key;
        if (s._cropMode) { _layoutCropBoard(); if (s._selWin) _paintCropUI(); }
        else renderWinCanvas(s._winCache);
    }, 80);
}
window.addEventListener('resize', _onViewportChange);
if (window.visualViewport) window.visualViewport.addEventListener('resize', _onViewportChange);

/** 把当前取景态刷到画板：绿框位置与框内尺寸徽标、输出预览、顶部状态条、切片列表活动项 */
function _paintCropUI() {
    var cur = s._selWin;
    if (!cur) return;
    var c = _cropOf(cur), p = _cropPx(c);
    // 设备矩阵是 postRotate→postScale（先转后翻），CSS 从右往左施加，故写成「镜像 rotate()」；画板箭头与输出预览共用
    var tf = [];
    if (cur.flip === 'h') tf.push('scaleX(-1)');
    if (cur.flip === 'v') tf.push('scaleY(-1)');
    if (cur.rotation) tf.push('rotate(' + cur.rotation + 'deg)');
    var tfStr = tf.length ? tf.join(' ') : 'none';
    var board = document.getElementById('cropBoard'), frame = document.getElementById('cropFrame');
    if (board && frame) {
        var bw = board.clientWidth, bh = board.clientHeight;
        if (bw > 0 && bh > 0) {
            frame.style.left = (c.x * bw) + 'px';
            frame.style.top = (c.y * bh) + 'px';
            frame.style.width = (c.w * bw) + 'px';
            frame.style.height = (c.h * bh) + 'px';
        }
        var sz = document.getElementById('cfSize');
        if (sz) {
            sz.textContent = p.w + '×' + p.h + 'px';
            // 框太小时徽标会盖住取景本身，直接不显示
            sz.style.display = (frame.offsetWidth < 52 || frame.offsetHeight < 20) ? 'none' : '';
        }
        var or = document.getElementById('cfOrien');
        if (or) or.style.transform = tfStr;
    }
    _syncCropInputs(c);
    var pv = document.getElementById('cropOutPreview'), pi = document.getElementById('cropOutInner');
    if (pv && pi) {
        var ww = Math.max(1, cur.width || 640), wh = Math.max(1, cur.height || 360);
        var k = Math.min(180 / ww, 140 / wh);
        var bw2 = Math.max(16, Math.round(ww * k)), bh2 = Math.max(16, Math.round(wh * k));
        pv.style.width = bw2 + 'px';
        pv.style.height = bh2 + 'px';
        var rot = cur.rotation || 0;
        // 设备侧对 90/270 先按框宽高比预缩再转，故内层用「交换后的框」铺满再旋转，转完恰好填满外框
        var swap = (rot === 90 || rot === 270);
        var iw = swap ? bh2 : bw2, ih = swap ? bw2 : bh2;
        pi.style.width = iw + 'px';
        pi.style.height = ih + 'px';
        pi.style.marginLeft = (-iw / 2) + 'px';
        pi.style.marginTop = (-ih / 2) + 'px';
        // 底图放大到 1/crop 倍再按取景左上角平移：background-position 百分比 = 起点/(1-取景尺寸)
        pi.style.backgroundSize = (100 / c.w) + '% ' + (100 / c.h) + '%';
        var px = c.w >= 1 ? 0 : (c.x / (1 - c.w)) * 100;
        var py = c.h >= 1 ? 0 : (c.y / (1 - c.h)) * 100;
        pi.style.backgroundPosition = px.toFixed(2) + '% ' + py.toFixed(2) + '%';
        pi.style.transform = tfStr;
    }
    var head = document.getElementById('cropStageHead');
    if (head) {
        head.innerHTML = '<b>' + esc(cur.name || cur.id) + '</b>' +
            '<span class="sh-o">输出 ' + (cur.width||0) + '×' + (cur.height||0) +
            (cur.rotation ? ' · 旋转 ' + cur.rotation + '°' : '') + (cur.flip && cur.flip !== 'none' ? ' · 镜像' : '') + '</span>' +
            '<span class="sh-c">取景 ' + (c.w >= 0.999 && c.h >= 0.999 ? '全画面' : p.x + ',' + p.y + ' 起 ' + p.w + '×' + p.h + 'px') + '</span>';
    }
    var ot = document.getElementById('cropOutTitle');
    if (ot) ot.textContent = '输出 ' + (cur.width||0) + '×' + (cur.height||0) + ' px';
    // 侧栏列表只整块重绘才会更新，这里补上局部刷新，避免改了尺寸/取景后列表还是旧值
    var ai = document.querySelector('.win-item.active');
    if (ai) {
        var _nm = ai.querySelector('.win-item-name'), _mt = ai.querySelector('.crop-win-meta');
        if (_nm) _nm.textContent = (c.w >= 0.999 && c.h >= 0.999 ? '' : '✂ ') + (cur.name || cur.id);
        if (_mt) _mt.textContent = (cur.width||0) + '×' + (cur.height||0);
    }
}

/** 画板交互：绿框本体 = 平移取景，8 个把手 = 对应边/角缩放；拖动期间只改本地，松手防抖同步一次 */
function _bindCropBoard() {
    var board = document.getElementById('cropBoard');
    if (!board) return;
    board.onmousedown = function(e) {
        if (!s._selWin) return;
        var frame = document.getElementById('cropFrame');
        if (!frame) return;
        var hd = (e.target.closest && e.target.closest('.cf-h')) ? e.target.closest('.cf-h') : null;
        if (!hd && e.target !== frame) return;   // 画板空白处不误触
        e.preventDefault();
        frame.focus();   // 点中绿框即聚焦：方向键随后微调的就是取景框
        _cropDrag = { mode: hd ? 'resize' : 'move', dir: hd ? hd.dataset.cdir : null, startX: e.clientX, startY: e.clientY, startCrop: _cropOf(s._selWin) };
    };
    document.removeEventListener('mousemove', cropBoardMouseMove);
    document.removeEventListener('mouseup', cropBoardMouseUp);
    document.addEventListener('mousemove', cropBoardMouseMove);
    document.addEventListener('mouseup', cropBoardMouseUp);
}

/** 画板辅助线：与窗口画布同一套 .win-guide 样式，只是坐标已是归一化值，直接乘画板像素 */
function _paintCropGuides() {
    var board = document.getElementById('cropBoard');
    if (!board) return;
    board.querySelectorAll('.win-guide').forEach(function(el) { el.parentNode.removeChild(el); });
    var bw = board.clientWidth, bh = board.clientHeight;
    // 画板有 overflow:hidden：贴在右/下边的线正好落在盒子最后一格之外，会被整条裁掉，
    // 而"吸到了边"却看不见线，比不吸附更让人费解 —— 收进 1px 画在边框那一格上
    _snapGuides.v.forEach(function(x) {
        var el = document.createElement('div');
        el.className = 'win-guide vg';
        el.style.left = Math.min(Math.round(x * bw), bw - 1) + 'px';
        el.style.top = '0px';
        el.style.height = bh + 'px';
        board.appendChild(el);
    });
    _snapGuides.h.forEach(function(y) {
        var el = document.createElement('div');
        el.className = 'win-guide hg';
        el.style.top = Math.min(Math.round(y * bh), bh - 1) + 'px';
        el.style.left = '0px';
        el.style.width = bw + 'px';
        board.appendChild(el);
    });
}

function _clearCropSnapGuides() {
    _snapGuides = { v: [], h: [] };
    _paintCropGuides();
}

function cropBoardMouseMove(e) {
    if (!_cropDrag || !s._selWin) return;
    var board = document.getElementById('cropBoard');
    if (!board || !board.clientWidth) return;
    var c0 = _cropDrag.startCrop;
    var nx = (e.clientX - _cropDrag.startX) / board.clientWidth;
    var ny = (e.clientY - _cropDrag.startY) / board.clientHeight;
    var L = c0.x, T = c0.y, R = c0.x + c0.w, B = c0.y + c0.h;
    _snapGuides = { v: [], h: [] };
    // 吸附手感与窗口配置同源：同一个开关（xsnap）、同一个屏幕像素容差、同样按住 Shift 这一帧不吸；
    // 目标线只有画板四边 + 横竖中心线，因为一块画板只属于一个切片，没有"别的窗口"可贴
    var snapOn = s._snap && !e.shiftKey;
    var tolX = snapOn ? SNAP_SCREEN_PX / board.clientWidth : 0;
    var tolY = snapOn ? SNAP_SCREEN_PX / board.clientHeight : 0;
    var lines = snapOn ? { v: [0, 0.5, 1], h: [0, 0.5, 1] } : null;
    if (_cropDrag.mode === 'move') {
        L = Math.min(Math.max(c0.x + nx, 0), 1 - c0.w);
        T = Math.min(Math.max(c0.y + ny, 0), 1 - c0.h);
        if (tolX) {
            var hitV = _snapShift([L, L + c0.w / 2, R], lines.v, tolX, true);
            if (hitV) { L = Math.min(Math.max(L + hitV.d, 0), 1 - c0.w); _snapTake('v', hitV); }
        }
        if (tolY) {
            var hitH = _snapShift([T, T + c0.h / 2, B], lines.h, tolY, true);
            if (hitH) { T = Math.min(Math.max(T + hitH.d, 0), 1 - c0.h); _snapTake('h', hitH); }
        }
        R = L + c0.w; B = T + c0.h;
    } else {
        var d = _cropDrag.dir || '';
        if (d.indexOf('w') >= 0) L += nx; else if (d.indexOf('e') >= 0) R += nx;
        if (d.indexOf('n') >= 0) T += ny; else if (d.indexOf('s') >= 0) B += ny;
        var cl = function(v) { return Math.min(Math.max(v, 0), 1); };
        L = cl(L); R = cl(R); T = cl(T); B = cl(B);
        if (R - L < 0.05) { if (d.indexOf('w') >= 0) L = Math.max(0, R - 0.05); else R = Math.min(1, L + 0.05); }
        if (B - T < 0.05) { if (d.indexOf('n') >= 0) T = Math.max(0, B - 0.05); else B = Math.min(1, T + 0.05); }
        if (tolX) {
            // 只吸"正在被拖的那条边"，对边钉住不动（同窗口配置拖角的行为）；吸不上（会撞 5% 下限）就不吸，
            // 否则辅助线画在目标线上、框却停在别处，等于骗人
            if (d.indexOf('w') >= 0) { var hw = _snapShift([L], lines.v, tolX, true); if (hw && hw.line <= R - 0.05) { L = hw.line; _snapTake('v', hw); } }
            if (d.indexOf('e') >= 0) { var he = _snapShift([R], lines.v, tolX, true); if (he && he.line >= L + 0.05) { R = he.line; _snapTake('v', he); } }
        }
        if (tolY) {
            if (d.indexOf('n') >= 0) { var hn = _snapShift([T], lines.h, tolY, true); if (hn && hn.line <= B - 0.05) { T = hn.line; _snapTake('h', hn); } }
            if (d.indexOf('s') >= 0) { var hs2 = _snapShift([B], lines.h, tolY, true); if (hs2 && hs2.line >= T + 0.05) { B = hs2.line; _snapTake('h', hs2); } }
        }
        if (s._cropRatioLock && s._cropRatioLock[s._selWin.id] && c0.w > 0 && c0.h > 0) {
            // 锁比例：角把手以宽定高（同输出侧）；单边把手只认该向的拖动量，另一向等比联动并保持中心线
            var hs = d.indexOf('w') >= 0 ? 'w' : (d.indexOf('e') >= 0 ? 'e' : '');
            var vs = d.indexOf('n') >= 0 ? 'n' : (d.indexOf('s') >= 0 ? 's' : '');
            var cx = c0.x + c0.w / 2, cy = c0.y + c0.h / 2;
            var k0 = c0.w / c0.h, nw = R - L, nh = B - T;
            if (hs) nh = nw / k0; else if (vs) nw = nh * k0;
            var maxW = hs === 'w' ? R : hs === 'e' ? 1 - L : 2 * Math.min(cx, 1 - cx);
            var maxH = vs === 'n' ? B : vs === 's' ? 1 - T : 2 * Math.min(cy, 1 - cy);
            var g = Math.max(1, 0.05 / nw, 0.05 / nh);
            nw *= g; nh *= g;
            var f = Math.min(1, maxW / nw, maxH / nh);
            nw *= f; nh *= f;
            var x0 = hs === 'w' ? R - nw : hs === 'e' ? L : cx - nw / 2;
            var y0 = vs === 'n' ? B - nh : vs === 's' ? T : cy - nh / 2;
            L = Math.min(Math.max(x0, 0), 1 - nw);
            T = Math.min(Math.max(y0, 0), 1 - nh);
            R = L + nw; B = T + nh;
            // 等比换算会把边带离目标线：只保留换算后确实还压在线上的那几条，别让辅助线骗人
            var onLine = function(v) { return Math.abs(L - v) < 1e-4 || Math.abs(R - v) < 1e-4; };
            var onLineY = function(v) { return Math.abs(T - v) < 1e-4 || Math.abs(B - v) < 1e-4; };
            _snapGuides.v = _snapGuides.v.filter(onLine);
            _snapGuides.h = _snapGuides.h.filter(onLineY);
        }
    }
    _paintCropGuides();
    var wins = s._winCache || [];
    var id = s._selWin.id;
    _setWinCrop(wins.find(function(x) { return x.id === id; }) || s._selWin, { x: L, y: T, w: R - L, h: B - T });
}

function cropBoardMouseUp() {
    if (!_cropDrag) return;
    _cropDrag = null;
    _clearCropSnapGuides();
    autoSyncWinConfig();
}

// ============================================================================
// 【方向键微调】选中切片后 ← ↑ → ↓ 平移 1px，Shift + 方向键 10px。
// 编辑对象随工作台开关切换：「输入截取」开 → 绿框（取景，输入画面 px）；关 → 红框（输出窗口，设备 px）。
// ============================================================================
/** @param {number} dx 水平跳距（px，右为正） @param {number} dy 垂直跳距（px，下为正） @returns {boolean} 是否已处理 */
function nudgeSelWin(dx, dy) {
    if (!s._windowEditorActive || !s._selWin) return false;
    var id = s._selWin.id;
    var w = (s._winCache || []).find(function(x) { return x.id === id; }) || s._selWin;
    if (s._cropMode) {
        // 在整数 px 上跳再换算回归一化：_cropOf 的 4 位小数舍入（≤0.1px）不会在连续微调里攒成偏差
        var p = _cropPx(_cropOf(w));
        p.x = Math.min(Math.max(p.x + dx, 0), _IN_W - p.w);
        p.y = Math.min(Math.max(p.y + dy, 0), _IN_H - p.h);
        _setWinCrop(w, { x: p.x / _IN_W, y: p.y / _IN_H, w: p.w / _IN_W, h: p.h / _IN_H });
    } else {
        w.x = Math.max(0, (w.x || 0) + dx);
        w.y = Math.max(0, (w.y || 0) + dy);
        // 副屏关时同拖拽一样把框收在可见区内：推到画布外就再也点不回来
        if (_viewW < _designW || _viewH < _designH) {
            w.x = Math.min(Math.max(w.x, _viewX), Math.max(_viewX, _viewX + _viewW - (w.width || 0)));
            w.y = Math.min(Math.max(w.y, _viewY), Math.max(_viewY, _viewY + _viewH - (w.height || 0)));
        }
        s._selWin.x = w.x; s._selWin.y = w.y;
        var v = { wpX: w.x, wpY: w.y };
        Object.keys(v).forEach(function(k) { var el = document.getElementById(k); if (el && el !== document.activeElement) el.value = v[k]; });
        _renderWinRects(s._winCache || []);
    }
    autoSyncWinConfig();
    return true;
}

document.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d) return;
    // 焦点在输入控件里时不抢方向键：数字框自身就是像素步进，宽度/高度框更不该被位置语义覆盖
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    var step = e.shiftKey ? 10 : 1;
    if (nudgeSelWin(d[0] * step, d[1] * step)) e.preventDefault();
});

/**
 * 选中指定窗口（高亮显示，打开属性编辑面板）
 * @param {string} id - 窗口 ID
 */
// 窗口分两类：内容类型 HDMI = 点歌窗，其余（第一幕/第二幕/存量测试背景）= 素材窗。
// 归类只用于侧栏双卡与「+ 添加」的默认类型；两类窗口仍同住本幕的 windows 数组。
function _winKind(w) {
    return (w && w.content && String(w.content.type || '').toUpperCase() === 'HDMI') ? 'video' : 'material';
}

// 点歌窗归属哪一套配置（1~3，缺省 1 = 存量窗口）。播放设置「点歌屏」列选哪一套，
// 屏上就只显示那一套的点歌窗（设备端 applyHdmiVisibility 同一口径）。
function _winHdmiMode(w) {
    var m = Number(w && w.content && w.content.mode);
    return (m === 2 || m === 3) ? m : 1;
}

function setWinTab(kind) {
    s._winTab = kind === 'video' ? 'video' : 'material';
    // 选中的是另一类窗口时取消选中：否则属性栏在编辑一个当前列表里看不见的窗口
    if (s._selWin && _winKind(s._selWin) !== s._winTab) s._selWin = null;
    renderWinEditorFull();
}

function selWin(id) {
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    if (!r) return;
    var cfg = {};
    try { cfg = r.config ? (typeof r.config === 'string' ? JSON.parse(r.config) : r.config) : {}; } catch(e) {}
    var curS = s._curScene || 'A';

    // 【BugFix-20260402-v3】A/B 隔离检查
    if (cfg.scenes && cfg.scenes.A && cfg.scenes.B && cfg.scenes.A.windows === cfg.scenes.B.windows) {
        cfg.scenes.A.windows = (cfg.scenes.A.windows || []).slice();
        cfg.scenes.B.windows = (cfg.scenes.B.windows || []).slice();
        r.config = typeof r.config === 'string' ? JSON.stringify(cfg) : cfg;
        var ridx = s.rooms.findIndex(function(r2){ return r2.id === s.rf; });
        if (ridx >= 0) s.rooms[ridx].config = r.config;
    }

    // 【BugFix-20260402-S08c】优先使用 s._winCache（拖动后最新位置），避免从 r.config 重新读取旧坐标
    var wins;
    if (s._winKey === _winCacheKey() && s._winCache && s._winCache.find(function(w){ return w.id === id; })) {
        wins = s._winCache; // 复用缓存（拖动后最新位置）
    } else {
        wins = (sceneData.windows || []).slice(); // 首次进入，从配置读取
    }
    _setWinCache(wins);
    s._selWin = Object.assign({}, wins.find(function(w) { return w.id === id; }) || null);
    // 列表跟着选中的那扇走：从画布上点一扇点歌窗，侧栏自动跳到「点歌窗」卡
    if (s._selWin) s._winTab = _winKind(s._selWin);
    s._selWinMap = s._selWinMap || { A: null, B: null };
    s._selWinMap[curS] = id;
    renderWinEditorFull();
}

/**
 * 添加新窗口
 * 自动生成唯一 ID，插入 windows 数组，触发 renderWinEditorFull()
 * 窗口默认：名字与类型跟随当前卡——素材窗=本幕场景窗「新窗口N」、跟随墙板；点歌窗=HDMI「点歌屏N」、
 * 不跟随墙板、模式1（点歌窗有三套配置，模式在属性栏改）。尺寸取画布 1/3 的 16:9、落在左上角、zIndex 排到最后。
 * 跟随墙板（2026-11-17 用户定调：新建窗口一律默认跟随墙板，不需要的再去属性栏取消）
 */
function addWin() {
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    if (!r) return;
    var curS = s._curScene || 'A';
    // 【BugFix】这里以前自己解析 config + 手写一份 scenes 骨架，只补「整个幕缺失」；
    // 幕对象存在但没带 windows 时，下面那句 windows.slice() 直接抛 TypeError，点「+ 添加」毫无反应。
    // 统一走 _loadRoomCfg()：它是补齐 scenes 骨架的唯一入口，A/B 引用拆分也在那里做。
    var cfg = _loadRoomCfg(r);
    var wins = cfg.scenes[curS].windows.slice(); // ← 永远拷贝，不直接用原数组

    // Date.now() 在同一毫秒的连续调用里会重复（连点 + 添加），id 撞车会让两片切片共用编辑态
    window._winIdTs = Math.max(window._winIdTs || 0, Date.now());
    var newId = 'win_' + (++window._winIdTs);
    // 「+ 添加」跟随当前卡：点歌窗卡建 HDMI 窗，素材窗卡建本幕场景窗
    var tab = s._winTab === 'video' ? 'video' : 'material';
    var winType = tab === 'video' ? 'HDMI' : (curS === 'B' ? 'SCENE_B' : 'SCENE_A');
    // 名字取同一类窗口里「前缀N」的最大 N 再 +1（素材窗数新窗口N，点歌窗数点歌屏N）。
    // 以前固定写死 '新窗口'：连点五次得到五个同名窗口，右侧列表和属性栏完全认不出谁是谁。
    var nameRe = tab === 'video' ? /^点歌屏\s*(\d+)$/ : /^新窗口\s*(\d+)$/;
    var namePrefix = tab === 'video' ? '点歌屏' : '新窗口';
    var maxNo = 0;
    wins.forEach(function(w) {
        if (_winKind(w) !== tab) return;
        var m = nameRe.exec(String(w.name == null ? '' : w.name).trim());
        if (m) maxNo = Math.max(maxNo, parseInt(m[1], 10));
    });
    // 新窗口铺在可见区里（副屏关时可见区只是主屏那半，沿用 0,0 会被裁到画布外看不见）
    var newW = Math.max(64, Math.round(_viewW / 3)), newH = Math.max(64, Math.round(_viewH / 3));
    wins.push({ id: newId, name: namePrefix + (maxNo + 1), x: Math.round(_viewX + (_viewW - newW) / 2), y: Math.round(_viewY + (_viewH - newH) / 2), width: newW, height: newH, aspectRatio: '16:9', content: tab === 'video' ? { type: 'HDMI', mode: 1 } : { type: winType, follow: true }, zIndex: wins.length + 1, opacity: 1, brightness: 1, enabled: true, flip: 'none', rotation: 0, crop: { x: 0, y: 0, w: 1, h: 1 } });

    // 双向隔离：A 的操作不动 B，反之亦然
    cfg.scenes[curS].windows = wins; // 当前场景：用含新窗口的拷贝覆盖回去
    var otherS = curS === 'A' ? 'B' : 'A';
    cfg.scenes[otherS].windows = cfg.scenes[otherS].windows.slice(); // 另一场景：确保仍是独立引用

    _setWinCache(wins);
    s._selWin = Object.assign({}, wins[wins.length - 1]);

    // 同步更新 s.rooms 内存
    var ridx = s.rooms.findIndex(function(r){ return r.id === s.rf; });
    if (ridx >= 0) { r.config = cfg; s.rooms[ridx].config = cfg; }

    // 保存到服务器：落库后服务端收敛点会给本房间已授权设备发 update_windows（新窗口是结构变化，
    // 设备自行回退全量重建），前端不再补 doSyncRoom
    fetch('/api/rooms/' + encodeURIComponent(s.rf) + '/windows', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({windows: wins, sceneId: curS}) })
      .then(function(res){ return res.json().then(function(d){ return {ok: res.ok, d: d}; }); })
      // 失败一定要说：addWin 已经在本地内存里把窗口加进去了，不写库的话刷新一下就有、刷新一下就没
      .then(function(ret){ if (ret.ok && ret.d.success) { renderWinEditorFull(); } else { alert('添加窗口失败: ' + (ret.d.error || '未知错误')); } })
      .catch(function(e){ alert('添加窗口失败: ' + e.message); });
}

/**
 * 删除指定窗口
 * @param {Event} e - 冒泡事件（用于阻止传播）
 * @param {string} id - 窗口 ID
 */
function delWin(e, id) {
    e.stopPropagation();
    if (!confirm('删除此窗口？')) return;
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    if (!r) return;
    var cfg = {};
    try { cfg = r.config ? (typeof r.config === 'string' ? JSON.parse(r.config) : r.config) : {}; } catch(e) {}
    var curS2 = s._curScene || 'A';

    // 【BugFix-20260402-v2】同样做隔离检查
    if (cfg.scenes && cfg.scenes.A && cfg.scenes.B && cfg.scenes.A.windows === cfg.scenes.B.windows) {
        cfg.scenes.A.windows = (cfg.scenes.A.windows || []).slice();
        cfg.scenes.B.windows = (cfg.scenes.B.windows || []).slice();
    }

    var scene2 = (cfg.scenes && cfg.scenes[curS2]) ? cfg.scenes[curS2] : {};
    var wins = (scene2.windows || []).filter(function(w) { return w.id !== id; });
    cfg.scenes[curS2].windows = wins; // ← 直接赋值为 filter 后的新数组（天然独立）

    var ridx2 = s.rooms.findIndex(function(r){ return r.id === s.rf; });
    if (ridx2 >= 0) { r.config = cfg; s.rooms[ridx2].config = cfg; }

    var _rid0 = s.rf, _k0 = _winCacheKey();   // 请求可能跨房间切换才回来，落库与回写都只认发起时的房间
    fetch('/api/rooms/' + encodeURIComponent(_rid0) + '/windows', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({windows: wins, sceneId: curS2}) })
      .then(function(res){ return res.json().then(function(d){ return {ok: res.ok, d: d}; }); })
      // 设备通知由服务端收敛点负责；这里失败必须报出来，否则"删掉了"其实只是本地视图
      .then(function(ret){
        if (!ret.ok || !ret.d.success) { alert('删除窗口失败: ' + (ret.d.error || '未知错误')); return; }
        if (_winCacheKey() !== _k0) return;
        _setWinCache(wins); s._selWin = null; renderWinEditorFull();
      })
      .catch(function(e){ alert('删除窗口失败: ' + e.message); });
}

// 侧栏数字框/下拉改属性：s._selWin 和 _winCache 里同 id 的那份都要写（两者可能已不是同一对象，
// 只写一个就会出现"编辑框跟着动、画布不动"），然后只重绘矩形（_renderWinRects）不整块重渲染，
// 最后 autoSyncWinConfig() 去抖推送 live update_windows。
function updWinField(field, value) {
    if (!s._selWin) return;
    var id = s._selWin.id, wins = s._winCache || [];
    var w = wins.find(function(x) { return x.id === id; });
    // 比例锁定：数字框改宽/高时另一边按「修改前」的宽高比跟随，与画布拖拽 winCanvasMouseMove 同一规则
    var pair = null;
    if ((field === 'width' || field === 'height') && s._winRatioLock && s._winRatioLock[id]) {
        var w0 = s._selWin.width || 640, h0 = s._selWin.height || 360;
        pair = { k: field === 'width' ? 'height' : 'width' };
        pair.v = Math.max(64, Math.round(field === 'width' ? value * h0 / w0 : value * w0 / h0));
    }
    s._selWin[field] = value;
    if (w) w[field] = value;
    if (pair) {
        s._selWin[pair.k] = pair.v;
        if (w) w[pair.k] = pair.v;
        var pe = document.getElementById(pair.k === 'width' ? 'wpW' : 'wpH');
        if (pe) pe.value = pair.v;
    }
    _renderWinRects(wins);
    if (s._cropMode) _paintCropUI();   // 截取画板共用这套控件：几何/镜像改完要重画输出预览
    autoSyncWinConfig();
    if (field === 'name') { var items = document.querySelectorAll('.win-item'); items.forEach(function(it){ if (it.querySelector('.win-item-name').textContent !== (s._selWin&&s._selWin.name)) it.querySelector('.win-item-name').textContent = value; }); }
}

// 滑条 oninput 专用：只改本地状态+画布预览，不推送（松手 onchange 自动同步一次）
function updWinFieldLocal(field, value) {
    if (!s._selWin) return;
    s._selWin[field] = value;
    var id = s._selWin.id, wins = s._winCache || [];
    var w = wins.find(function(x) { return x.id === id; });
    if (w) w[field] = value;
    _renderWinRects(wins);
}

function updWinContent(field, value) {
    if (!s._selWin) return;
    if (!s._selWin.content) s._selWin.content = {};
    s._selWin.content[field] = value;
    var id = s._selWin.id, wins = s._winCache || [];
    var w = wins.find(function(x) { return x.id === id; });
    if (w) w.content = Object.assign({}, s._selWin.content);
    renderWinEditorFull(); // 【BugFix-20260402】刷新属性面板类型按钮 + 画布窗口标签 + 列表显示
    autoSyncWinConfig(); // 设备侧内容签名变化 → 自动回退全量重建
}

function updWinRot(v) {
    updWinField('rotation', v);
    renderWinEditorFull(); // 刷新旋转按钮 active 态
}

// 场景总亮度：写入当前场景 master（新建字面量，A/B 不共享引用），复用 windows 接口即时推送
function updSceneMaster(v) {
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    if (!r) return;
    var cfg = {};
    try { cfg = typeof r.config === 'string' ? JSON.parse(r.config) : (r.config || {}); } catch(e) { return; }
    if (!cfg.scenes) cfg.scenes = {};
    var curS = s._curScene || 'A';
    if (!cfg.scenes[curS]) cfg.scenes[curS] = { name: curS === 'A' ? '第一幕' : '第二幕', folder_mappings: {}, windows: [] };
    cfg.scenes[curS].master = { brightness: v };
    r.config = cfg;
    var ridx = s.rooms.findIndex(function(x){ return x.id === s.rf; });
    if (ridx >= 0) s.rooms[ridx].config = cfg;
    var wins = _getWinCache(cfg);
    // 松手这一次是权威写入：不带 live → 服务端落库后经收敛点发 update_windows（含 master 亮度）
    fetch('/api/rooms/' + encodeURIComponent(s.rf) + '/windows', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({windows: wins, sceneId: curS, master: {brightness: v}}) })
        .then(function(res){ return res.json().then(function(d){ return {ok: res.ok, d: d}; }); })
        // 松手写的这一笔是真值：只 console.error 的话，界面停在拖到的位置，云端还是旧亮度，
        // 设备端下一次全量同步就"自己变暗回去"了
        .then(function(ret){ if (!ret.ok || !ret.d.success) alert('总亮度保存失败: ' + (ret.d.error || '未知错误')); })
        .catch(function(e){ alert('总亮度保存失败: ' + e.message); });
}

// ============================================================================
// 【F-09d】【自动同步】编辑完成 → 500ms 防抖 → PUT /windows 带 live:true → 服务端下发 update_windows
// 前端不直连 MQTT：落库与下发都在服务端（收敛点 notifyRoomConfigChanged），这里只负责把编辑攒成一笔。
// 设备收到 update_windows 原地改视图，不释放播放器、视频不从头播；拖动过程中零请求。
// ============================================================================
var _autoSyncTimer = null;

// 【自动同步】窗口配置任何修改完成后自动保存并同步一次（现场人员免手动点"保存并推送"）
// 防抖 500ms 合并连续修改（打字/连拖/多滑条）；走 live 轻推通道：服务端落库 + 设备原地更新
//（不打断播放）。需要全量同步（素材检查/通知全部设备）时仍用"💾 保存并推送"按钮
function autoSyncWinConfig() {
    if (!s.rf) return;
    var _k = _winCacheKey();   // 防抖窗口内可能切了房间/幕：到点只认发起时的那一间，否则直接丢弃
    if (_autoSyncTimer) clearTimeout(_autoSyncTimer);
    _autoSyncTimer = setTimeout(function() {
        _autoSyncTimer = null;
        if (_winCacheKey() !== _k) return;
        saveWindows(true);
    }, 500);
}

/**
 * 把防抖里还没落地的那次自动同步立刻发出。
 * 切幕 / 切房间前必须调：定时器到点后是按"发起时的 房间|幕"键校验的，键一变就丢弃，
 * 用户最后一次拖动/改值会静默丢失（本地缓存也被新幕的 windows 覆盖，回不来）。
 * 调用时 s.rf / s._curScene / _winCache 都还是被编辑的那一份，所以 saveWindows 写对了目标。
 */
function flushAutoSync() {
    if (!_autoSyncTimer) return _winSaveTail;   // 没有防抖中的编辑：把串行队列的尾巴交出去，await 它就等于"此刻没有比这更新的写在飞"
    clearTimeout(_autoSyncTimer);
    _autoSyncTimer = null;
    return saveWindows(true);
}

// master 滑条 oninput：只更新标签 + 本地配置，拖动中不发请求；松手 onchange → updSceneMaster 权威写入
function updSceneMasterLive(v) {
    var el = document.getElementById('winMasterV');
    if (el) el.textContent = Math.round(v*100) + '%';
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    if (!r) return;
    var cfg = {};
    try { cfg = typeof r.config === 'string' ? JSON.parse(r.config) : (r.config || {}); } catch(e) { return; }
    if (!cfg.scenes) cfg.scenes = {};
    var curS = s._curScene || 'A';
    if (!cfg.scenes[curS]) cfg.scenes[curS] = { name: curS === 'A' ? '第一幕' : '第二幕', folder_mappings: {}, windows: [] };
    cfg.scenes[curS].master = { brightness: v };
    r.config = cfg;
    // 松手 onchange → updSceneMaster 权威同步；拖动中不再实时推送
}


function setWinContentType(type) {
    if (!s._selWin) return;
    var prev = s._selWin.content || {}, prevType = String(prev.type || '').toUpperCase();
    // 换类型 = content 整体重建（folderId/color/inputIndex 一并作废，这是既有口径）；
    // 唯一保住的是 follow —— 第一幕↔第二幕之间"跟不跟墙板"是同一个意图，不该被点一下幕按钮抹掉。
    // 切到 HDMI 时不保：它不是文件夹内容，编号没有东西可切。
    var isScene = function (t) { t = String(t || '').toUpperCase(); return t === 'SCENE_A' || t === 'SCENE_B'; };
    s._selWin.content = (prev.follow === true && isScene(type) && isScene(prevType))
        ? { type: type, follow: true }
        : { type: type };
    var id = s._selWin.id, wins = s._winCache || [];
    var w = wins.find(function(x) { return x.id === id; });
    if (w) w.content = Object.assign({}, s._selWin.content);
    s._winTab = _winKind(s._selWin);   // 换类型后列表跟着跳：改成点歌屏就落到「点歌窗」卡
    renderWinEditorFull();
}

function toggleWinRatio(id) {
    if (!s._winRatioLock) s._winRatioLock = {};
    s._winRatioLock[id] = !s._winRatioLock[id];
    var btn = document.getElementById('wpRatioLock');
    if (btn) { btn.className = 'lock-btn' + (s._winRatioLock[id] ? ' active' : ''); btn.textContent = (s._winRatioLock[id] ? '🔒' : '🔓') + ' 锁定'; }
}

function setWinRatio(ratioStr) {
    if (!s._selWin) return;
    var parts = ratioStr.split(','), rw = parseInt(parts[0]), rh = parseInt(parts[1]);
    if (!rw || !rh) return;
    s._selWin.width = Math.round(s._selWin.height * rw / rh);
    var wEl = document.getElementById('wpW');
    if (wEl) wEl.value = s._selWin.width;
    var id = s._selWin.id, wins = s._winCache || [];
    var w = wins.find(function(x) { return x.id === id; });
    if (w) w.width = s._selWin.width;
    _renderWinRects(wins);
    if (s._cropMode) _paintCropUI();   // 比例预设也在截取侧栏里：预览框/标题/头部要跟着变
    autoSyncWinConfig();
}


/**
 * 保存窗口配置到后端，并推送到设备（串行队列的入口）
 * silent=true：编辑器修改后的自动同步（autoSyncWinConfig 防抖触发）——live 轻推通道
 *（服务端落库 + 设备原地更新），不出确认弹窗、不触发全量同步
 * silent 缺省：手动"💾 保存并推送"——完整同步（素材检查 + 通知全部设备）
 * @return {Promise} 这一次（或排在它前面的那一次）写落地后才 resolve，供 flushAutoSync 的调用方 await
 *
 * 为什么要排队：PUT /rooms/:id/windows 是服务端"读整份 config → 改这一幕的 windows → 写回"，
 * 两条请求交叠就是后落的把先落的抹掉，而且两边都报 200。防抖只合并了连续改动，
 * 交叠仍来自 flushAutoSync（切幕/切房间/进墙板表）撞上还在飞的上一条，或手动的「保存并推送」压上来。
 */
var _winSaveTail = Promise.resolve();

/**
 * 入队即定格这一次要写的那一份：排队期间用户可能已经切了房间/幕，落库的必须是他按下改动时的画面
 * （flushAutoSync 的"此刻 s.rf 还是被编辑的那一间"这条前提，靠这里才在异步队列下继续成立）。
 */
function saveWindows(silent) {
    if (!s.rf) return Promise.resolve();
    var _sRoom = s.rooms.find(function(x) { return x.id === s.rf; });
    var _sCfg = {};
    try { _sCfg = _sRoom ? (typeof _sRoom.config === 'string' ? JSON.parse(_sRoom.config) : (_sRoom.config || {})) : {}; } catch(e9) {}
    var wins = _getWinCache(_sCfg);   // 只可能落本房间本幕的数据：归属键不符会先作废缓存再回读本房间配置
    var scene = s._curScene || 'A';
    var payload = { windows: wins, sceneId: scene,
                    master: ((_sCfg.scenes || {})[scene] || {}).master || { brightness: 1 } };
    if (silent) payload.live = true;
    var snap = { rid: s.rf, key: _winCacheKey(), scene: scene, wins: wins, body: JSON.stringify(payload) };
    var run = _winSaveTail.then(function () { return _saveWindows(silent, snap); });
    // 尾巴只负责"排到我"：一次失败（alert 已在 _saveWindows 里处理过）不能把后面的写全卡住
    _winSaveTail = run.then(function () {}, function () {});
    return run;
}

async function _saveWindows(silent, snap) {
    var btn = document.getElementById('winSaveBtn');
    if (btn && !silent) { btn.classList.add('saving'); btn.textContent = '保存中...'; }
    try {
        var res = await fetch('/api/rooms/' + snap.rid + '/windows', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: snap.body });
        var json = await res.json();
        if (json.success && _winCacheKey() !== snap.key) return;   // 排队/请求期间已切房间或切幕：这次回写作废
        if (json.success) {
            // 同步更新 s.rooms 内存中的 config，避免内存状态落后于服务器
            var ridx = s.rooms.findIndex(function(r){ return r.id === snap.rid; });
            if (ridx >= 0) {
                var r = s.rooms[ridx];
                var cfg = {};
                try { cfg = typeof r.config === 'string' ? JSON.parse(r.config) : (r.config || {}); } catch(e3) { cfg = {}; }
                // 【BugFix-20260402-v2】确保 A/B windows 独立引用
                if (cfg.scenes && cfg.scenes.A && cfg.scenes.B && cfg.scenes.A.windows === cfg.scenes.B.windows) {
                    cfg.scenes.A.windows = (cfg.scenes.A.windows || []).slice();
                    cfg.scenes.B.windows = (cfg.scenes.B.windows || []).slice();
                }
                var curS = snap.scene;   // 回写发起时那一幕，不是"现在看着的那一幕"
                cfg.scenes = cfg.scenes || {};
                cfg.scenes[curS] = cfg.scenes[curS] || {};
                cfg.scenes[curS].windows = snap.wins;
                r.config = cfg;
                // 【BugFix-20260402-v2】将 _winCache 同步为 config 中的独立副本
                _setWinCache(cfg.scenes[curS].windows.slice());
            }
            // 不再补 doSyncRoom：PUT /windows 落库后服务端收敛点已按需通知设备。
            // 要"不管有没有变都重推一遍 + 拿到设备数回执"，用「🔄 同步当前房间」按钮。
            if (btn) { btn.textContent = silent ? '✅ 已自动同步' : '✅ 已保存并推送'; setTimeout(function(){ btn.textContent='💾 保存并推送'; btn.classList.remove('saving'); }, silent ? 1200 : 2000); }
        }
        else { alert('保存失败: ' + (json.error || ('HTTP ' + res.status))); if (btn) { btn.textContent='💾 保存并推送'; btn.classList.remove('saving'); } }
    } catch(e) { alert('保存失败: ' + e.message); if (btn) { btn.textContent='💾 保存并推送'; btn.classList.remove('saving'); } }
}

// 把预设库映射进"当前这一幕"。scope 省略 = 只映射房间视图上方选中的那个文件夹标签（s.f）；
// scope === 'ALL' = 整个预设库（按钮组里的「整库」，把预设库当模板一次性铺满一幕时才用）。
// 为什么默认要收窄到当前文件夹：以前这里无条件灌整库（那段代码里的 allPresets 从前叫
// presetInFolder，是按文件夹映射年代留下的名字），停在 03 标签点一下按钮，
// 设备就照着新清单把 01-30 整个下一遍，而界面下方"已映射素材"只渲染 s.f 那一格，
// 看不出另外 29 档被塞了什么。整库那档保留成显式入口 + 二次确认，不再藏在默认行为里。
async function mapPreset(scope) {
    var whole = (scope === 'ALL');
    if (!s.rf) { alert('请先选择房间'); return; }
    var fid = s.f;
    // 与服务端 PRESET_FOLDER_RE 同形（01-30）。fid 会直接当 folder_mappings 的键写进 config，
    // 非法键服务端 normalizeFolderMappings 会静默剪掉，而弹窗照样报"已映射 N 个" —— 那是假成功。
    if (!whole && (typeof fid !== 'string' || !/^(0[1-9]|[12]\d|30)$/.test(fid))) {
        alert('请先在上方选择一个素材文件夹标签（01-30）'); return;
    }
    // 加载预设素材 + 素材库（去重要拿两边的 url 比）
    var pm, ms;
    try {
        pm = asList(await apiGet('/api/preset/materials'));
        ms = asList(await apiGet('/api/materials'));
    } catch (e) { alert('读取素材列表失败: ' + e.message); return; }
    // 只增不减：已映射的按 id/url 去重保留，本幕里多余的历史映射不会被这次操作清掉
    //（"覆盖本幕"是删除语义 —— 摘掉映射设备就会删文件，且 folder_mappings 还有
    //  doPushToRoom 这个写入者，两条链路互相覆盖会踩掉对方的成果，要做得先定归属规则）
    var allPresets = whole ? pm : pm.filter(function(m) { return m.folder_id === fid; });
    if (whole) {
        if (pm.length === 0) { alert('预设素材库为空，先在素材页点素材上的「预设」复制'); return; }
        if (!confirm('把预设库全部 ' + pm.length + ' 条素材映射进' + (s._curScene === 'B' ? '第二幕' : '第一幕')
            + '的 01-30 各文件夹？\n设备会按新清单把缺的素材全部下载到本机。')) return;
    } else if (allPresets.length === 0) {
        alert('预设库 ' + fid + ' 文件夹是空的：先在素材页选中该文件夹，再点素材上的「预设」按钮复制');
        return;
    }
    // 基底必须现拉，不能用 s.rooms 里那份快照：那可能是几分钟前甚至上次切店前的数据，
    // 而这里是整份 config PUT 回去 —— 期间别人/别的标签页改的窗口和另一幕会被静默回退。
    // 本机自己压在防抖队列里的窗口编辑同理：先落库再拉，否则这次 PUT 会把它写回去的 windows 覆盖掉。
    var r;
    try {
        await flushAutoSync();
        r = await apiGet('/api/rooms/' + encodeURIComponent(s.rf));
    }
    catch (e) { alert('读取房间当前配置失败: ' + e.message); return; }
    if (!r || r.error) { alert('房间不存在或已被删除: ' + (r && r.error ? r.error : s.rf)); return; }
    // 基于 scenes[curS].folder_mappings 合并（保留已映射的素材），只写当前场景
    var curS = s._curScene || 'A';
    // ⚠️ 必须走 _loadRoomCfg：saveWindows 成功后会把 r.config 回写成**对象**（见本文件后面的
    // `r.config = cfg`），这里若直接 JSON.parse 就会抛 → catch 吞掉 → cfg 变成 {} →
    // PUT 下去的是一份空 scenes 骨架。现在只靠服务端"空 windows 不覆盖"挡着，
    // 一旦那条例外改掉就是整房间窗口配置被清空。
    var cfg = _loadRoomCfg(r);
    if (curS !== 'B') curS = 'A';   // 幕只认 A/B（服务端同样会丢弃其它键）
    var folderMs = cfg.scenes[curS].folder_mappings || {};
    // 添加所有预设素材到对应文件夹（按ID或URL去重）
    var count = 0, skipped = 0;
    allPresets.forEach(function(m) {
        var fid = m.folder_id;
        // 文件夹名要和库里的目录名同形状（服务端 normalizeFolderMappings 会丢弃非法键）：
        // 这里不先挡，写进去也会被服务端剪掉，而弹窗仍然报"已映射 N 个"
        if (typeof fid !== 'string' || !/^[A-Za-z0-9_-]{1,10}$/.test(fid) || !m.id) { skipped++; return; }
        if (!Array.isArray(folderMs[fid])) folderMs[fid] = [];
        // 检查ID是否已存在，或URL对应的素材是否已在该文件夹（防止素材库文件被复制到预设后重复添加）
        var alreadyAdded = folderMs[fid].some(function(existingId) {
            // 已有的是预设素材
            var existingPreset = pm.find(function(p) { return p.id === existingId; });
            if (existingPreset && existingPreset.url === m.url) return true;
            // 已有的是素材库原始素材
            var existingMaterial = ms.find(function(mat) { return mat.id === existingId; });
            if (existingMaterial && existingMaterial.url === m.url) return true;
            // ID直接相同
            if (existingId === m.id) return true;
            return false;
        });
        if (!alreadyAdded) { folderMs[fid].push(m.id); count++; }
    });
    cfg.scenes[curS].folder_mappings = folderMs;
    try {
        await apiCall('/api/rooms/' + encodeURIComponent(s.rf), {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({config: JSON.stringify(cfg)})
        });
    } catch (e) { alert('映射保存失败: ' + e.message); return; }
    alert((whole ? '已把预设库全部素材中的 ' : '已把预设库 ' + fid + ' 里的 ') + count + ' 条新素材映射进'
        + (curS === 'A' ? '第一幕' : '第二幕') + (whole ? '' : '的 ' + fid + ' 文件夹')
        + '（同文件夹里已有同文件的会跳过' + (skipped > 0 ? '；另有 ' + skipped + ' 条文件夹名非法，已跳过' : '') + '）');
    lr();
    // PUT /api/rooms/:id 落库后服务端收敛点已比较映射指纹并通知设备，这里不再补 doSyncRoom
    logAction('preset_map', 'room', {
        room_id: s.rf, room_name: r.name, store_name: r.store_name || r.store,
        scope: whole ? 'ALL' : fid, count: count
    });
    updateRoomDebugToggle();
}

// 文件夹级「全局复制」：把当前房间、当前幕、当前文件夹的素材清单覆盖到本店其余房间的同名文件夹。
// 完全同步 = 目标这一格整体替换（多删少补、顺序一致）；当前清单为空则删掉目标该键。
// 只动 scenes[curS].folder_mappings[fid]，窗口/墙板/播放设置与其它店铺一概不碰。
async function copyFolderAll() {
    var fid = s.f;
    if (!s.rf) { alert('请先选择房间'); return; }
    if (typeof fid !== 'string' || !/^(0[1-9]|[12]\d|30)$/.test(fid)) { alert('请先在上方选择一个素材文件夹标签（01-30）'); return; }
    if (s._folderCopying) return;
    var curS = s._curScene === 'B' ? 'B' : 'A';
    var cur = (s.rooms || []).find(function (r) { return r && r.id === s.rf; });
    var store = cur && cur.store_name;
    if (!store) {
        try { cur = await apiGet('/api/rooms/' + encodeURIComponent(s.rf)); store = cur && cur.store_name; }
        catch (e) { /* 下面统一报错 */ }
    }
    if (!store) { alert('拿不到当前房间的店铺，无法确定复制范围。'); return; }
    var src, list;
    try {
        await flushAutoSync();
        var srcRoom = await apiGet('/api/rooms/' + encodeURIComponent(s.rf));
        if (!srcRoom || srcRoom.error) throw new Error((srcRoom && srcRoom.error) || '房间不存在');
        src = ((_loadRoomCfg(srcRoom).scenes[curS].folder_mappings || {})[fid] || []).slice();
        list = asList(await apiGet('/api/rooms?store=' + encodeURIComponent(store)));
    } catch (e) { alert('读取房间配置失败: ' + e.message); return; }
    var others = list.filter(function (r) { return r && r.id !== s.rf; });
    if (!others.length) { alert('本店没有其它房间可覆盖。'); return; }
    if (!confirm('把当前房间「' + (curS === 'A' ? '第一幕' : '第二幕') + ' / ' + fid + '」的 ' + src.length + ' 条素材清单覆盖到「' + store + '」的其余 ' + others.length + ' 间房？\n\n完全同步：同名文件夹整体替换，目标多出的素材会被移除（设备下次同步会删文件），当前清单为空则清空目标。其它文件夹、其它幕与其它店铺不受影响。')) return;
    s._folderCopying = true;
    var btn = document.getElementById('folderCopyBtn');
    if (btn) btn.disabled = true;
    var ok = 0, bad = [];
    try {
        for (var i = 0; i < others.length; i++) {
            var r = others[i];
            if (btn) btn.textContent = '复制中 ' + (i + 1) + '/' + others.length + '…';
            try {
                var roomObj = await apiGet('/api/rooms/' + encodeURIComponent(r.id));
                if (!roomObj || roomObj.error) throw new Error((roomObj && roomObj.error) || '房间不存在');
                var cfg = _loadRoomCfg(roomObj);
                if (src.length) cfg.scenes[curS].folder_mappings[fid] = src.slice();
                else delete cfg.scenes[curS].folder_mappings[fid];
                await apiCall('/api/rooms/' + encodeURIComponent(r.id), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: JSON.stringify(cfg) })
                });
                ok++;
            } catch (e) { bad.push((r.name || r.id) + '：' + e.message); }
        }
    } finally {
        s._folderCopying = false;
        var btn2 = document.getElementById('folderCopyBtn');
        if (btn2) { btn2.disabled = false; btn2.textContent = '全局复制'; }
    }
    alert('已把 ' + fid + ' 文件夹（' + (curS === 'A' ? '第一幕' : '第二幕') + '）同步到本店 ' + ok + ' 间房'
        + (bad.length ? '，' + bad.length + ' 间失败：\n' + bad.join('\n') : ''));
    logAction('folder_copy_all', 'room', {
        room_id: s.rf, room_name: cur && cur.name, store_name: store,
        scene: curS, folder: fid, count: src.length, ok: ok, failed: bad.length
    });
    lr();
}

// 【F-08b】 房间调试开关（_roomDebugOn 读 / updateRoomDebugToggle 显示态 / toggleRoomDebug 写入）
/**
 * 这个房间的调试模式到底算不算开着 —— 读取口径只有这一处，且只认云端 config.debug。
 * 试过在这里加一层 sessionStorage 缓存"本标签页最后一次点击的结果"，代价是显示态和真值分家：
 * 别人（另一标签页、脚本、运维）改了这间房，本页整个会话都还显示旧态。写入成功后已经把新 config
 * 同步回 s.rooms，失败会回滚，所以缓存层没有任何必要。
 * 它现在只管一件事：设备端上不上屏运维浮层（状态文字/进度条）。试播不挂它 —— 单击素材卡是内容操作，
 * 与 stop / 推送配置同级（2026-11-08 用户定调）。
 */
function _roomDebugOn() {
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    if (!r) return false;
    var cfg = {};
    if (r.config) {
        try { cfg = typeof r.config === 'string' ? JSON.parse(r.config) : r.config; }
        catch (e) { cfg = {}; }
    }
    return cfg.debug === true;
}

/**
 * 调试开关的三个 DOM（checkbox/slider/knob）只由这一处上色。
 * 原来 updateRoomDebugToggle 和 toggleRoomDebug 的成功/失败分支各写一遍样式，
 * 一个状态三个写入口 —— 加乐观更新时漏改一处就是"点了没反应"。
 */
function _paintDebugToggle(on) {
    var el = document.getElementById('roomDebugToggle');
    var slider = document.getElementById('roomDebugSlider');
    var knob = document.getElementById('roomDebugKnob');
    if (!el || !slider || !knob) return;
    el.checked = on;
    slider.style.background = on ? '#4caf50' : '#444';
    knob.style.left = on ? '23px' : '3px';
}

function updateRoomDebugToggle() {
    _paintDebugToggle(_roomDebugOn());
}

// 切换房间调试模式
async function toggleRoomDebug() {
    if (!s.rf) return;
    var cb = document.getElementById('roomDebugToggle');
    var newVal = cb.checked;
    _paintDebugToggle(newVal);   // 乐观显示，落库失败再按真值拨回去
    // 先读云端最新 config，只改 debug 这一个键再写回：s.rooms 是列表缓存，可能已经是几分钟前的快照，
    // 拿它整份 PUT 会把期间别人改的映射/窗口一起抹掉（与「推送到房间」同口径）。
    // 读之前先等本机在飞的窗口编辑落库 —— 否则这份 GET 读到的是旧 windows，PUT 回去就是覆盖。
    var cfg;
    try {
        await flushAutoSync();
        var res = await fetch('/api/rooms/' + encodeURIComponent(s.rf));
        var roomObj = await res.json().catch(function() { return {}; });
        if (!res.ok) throw new Error(roomObj.error || ('HTTP ' + res.status));
        cfg = _loadRoomCfg(roomObj);
        cfg.debug = newVal;
        await apiCall('/api/rooms/' + encodeURIComponent(s.rf), {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({config: JSON.stringify(cfg)})
        });
    } catch (e) {
        // 保存失败必须把开关拨回去：这个开关决定设备端上不上屏运维信息，
        // 显示"已开"而云端是"关"，现场就会一直以为日志在传（以前只 console.error）
        _paintDebugToggle(_roomDebugOn());
        alert('调试开关保存失败: ' + e.message);
        return;
    }
    // 显示态认 s.rooms 里的云端真值，成功后把新 config 抄回去，省一次 lr() 全量刷新
    var idx = s.rooms.findIndex(function(x) { return x.id === s.rf; });
    if (idx > -1) {
        var newRoom = JSON.parse(JSON.stringify(s.rooms[idx]));
        newRoom.config = JSON.stringify(cfg);
        s.rooms[idx] = newRoom;
    }
    _paintDebugToggle(newVal);
}

// 操作日志
async function logAction(action, type, detail) {
    try {
        await fetch('/api/log', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action, type, detail})
        });
    } catch(e) {}
}


// 【F-08】 删除房间素材（发MQTT）// async function rmRoomMat()
// 只调一次 DELETE /materials：服务端自己会清 A/B 两幕的同编号映射并写库，
// 再由 notifyRoomConfigChanged 收敛点发 delete_material + sync。
// 以前这里先自行 PUT config 再 DELETE 再 doSyncRoom —— 三次写两次通知，设备连着重试三轮。
async function rmRoomMat(e, mid) {
    e.stopPropagation();
    if (!s.rf) return;
    if (!confirm('从房间移除该素材?')) return;
    var r = s.rooms.find(function(x) { return x.id === s.rf; });
    // 通知设备立即删除本地素材文件 + 清单对账（必须等完成再刷新UI）
    try {
        var delR = await fetch('/api/rooms/' + s.rf + '/materials/' + mid + '?folder=' + s.f + '&scene=' + (s._curScene || 'A'), { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
        var delD = await delR.json();
        if (delD.success) {
            setMc('<div style="padding:30px;text-align:center;color:#4caf50">✅ 删除指令已发送（' + (delD.sent||0) + '台设备收到），设备将自动同步</div>');
        } else {
            setMc('<div style="padding:30px;text-align:center;color:#f44336">❌ 删除失败: ' + esc(delD.error||'') + '</div>');
        }
    } catch(e) {
        setMc('<div style="padding:30px;text-align:center;color:#f44336">❌ 删除请求失败: ' + esc(e.message) + '</div>');
    }
    autoCloseModal(2000);
    lr();
    var mat = s.pm ? s.pm.find(function(x) { return x.id === mid; }) : null;
    if (!mat) mat = s.ms ? s.ms.find(function(x) { return x.id === mid; }) : null;
    logAction('room_remove', 'room', {
        room_id: s.rf, room_name: r.name, store_name: r.store_name || r.store,
        folder: s.f, material_id: mid, material_name: mat ? (mat.filename || mat.name) : mid
    });
}

// 【F-08d】 大屏试播（房间工作台「已映射素材」里单击视频卡片即播）
// 为什么值得单独一条链路：网页里预览（素材库/预设页的单击）只能看片子本身，而现场要判断的是"这只片子放进这扇窗
// 好不好看"—— 位置/尺寸/裁剪/亮度全叠上之后的画面只有大屏能给（设备端就在同一个窗口播放器上换片，
// 所以那些属性自动继承，所见即所得）。
// 三条口径与云端【S-05p】对齐，改任何一边都要想到另一边：
//   - 前端只报 (scene, folder, material_id)：目标窗口、带幕前缀的物理目录、落盘文件名一律服务端按
//     房间配置算。这里刻意不再镜像一遍选窗规则 —— 设备/服务端已各有一份，第三份必然漂；
//     要显示"占的是哪扇窗"，读接口响应里的 target 就行。
//   - 只播设备本机已有的素材；服务端会拒（那只素材还没同步下去），拒因写进状态条常驻。
//   - 下发是单向 MQTT：接口成功只代表"命令发出去了"。设备那边到底播没播、几点回去，
//     看「日志」页 —— 所以提示里不写"播放成功"这种话。
// 2026-11-08 用户定调：不要专门的试播按钮、不要弹窗、不挂房间调试模式。整条链因此只剩两样可见物：
// 卡片上那圈红边（上次发出去的是哪一只），和标题行右侧的状态条（发给了哪扇窗 / 为什么没发出去）。
// 两者都由 refreshPvBar + refreshPvCards 定点刷新，不再 rmDevice() 重画工作区 —— 那样每点一次
// 滚条就跳回顶部，连看两只片子得重新找位置。
var _pvDevExtRe = /\.(mp4|mkv|avi|mov|webm)$/i;   // 设备端播放链认的扩展名（APK playFolderInWindow / 云端 PREVIEW_VIDEO_RE 同一份表）
var _pvCallId = 0;   // 连点两只时，先发出的请求可能后回来；只让最后一次单击的结果上屏

/** 这只素材能不能在大屏上试播（图片素材压根不在设备播放链上，服务端也会拒） */
function _pvOnDevice(name) { return _pvDevExtRe.test(String(name || '')); }

/** 映射里的素材 id → 显示名：预设和素材库两条来源都要查（映射值两种 id 都合法） */
function _roomMatName(mid) {
    var m = s.pm ? s.pm.find(function(x) { return x.id === mid; }) : null;
    if (!m) m = s.ms ? s.ms.find(function(x) { return x.id === mid; }) : null;
    return m ? String(m.filename || m.name || mid) : String(mid);
}

/** 只认当前房间那次试播：切到别的房间，上一间房的记录不该在这间房的状态条上冒出来 */
function _pvHere() {
    var p = s._preview;
    return p && p.roomId === s.rf ? p : null;
}

/**
 * 状态条：失败是常驻红字（不设定时器，下一次单击或切房才覆盖），成功是一行"片子 → 窗口"加「提前结束」。
 * 没记录就返回空串，标题行右侧不留空位。
 */
function _pvBarHtml() {
    var p = _pvHere();
    if (!p) return '';
    if (p.err) return '<span style="color:#f44336;font-size:var(--fs-meta);margin-right:10px" title="' + escA(p.err) + '">试播没发出去：' + esc(p.err) + '</span>';
    return '<span style="color:#e94560;font-size:var(--fs-meta);margin-right:8px">▶ ' + esc(p.filename || '')
        + (p.win_name ? ' → ' + esc(p.win_name) : '') + '</span>'
        + '<button class="btn" style="padding:3px 10px;font-size:var(--fs-meta);margin-right:10px" title="让大屏现在就回到原画面（不等到播完）" onclick="stopPv()">提前结束</button>';
}

function refreshPvBar() {
    var el = document.getElementById('pvBar');
    if (el) el.innerHTML = _pvBarHtml();
}

/** 红边只圈上次发出去的那一只；失败态不圈 —— 那次根本没到设备 */
function refreshPvCards() {
    var p = _pvHere();
    var mid = p && !p.err ? p.material_id : null;
    document.querySelectorAll('#dg .card[data-pv-mid]').forEach(function(c) {
        c.classList.toggle('card-previewing', !!mid && c.getAttribute('data-pv-mid') === mid);
    });
}

async function pvMat(mid) {
    if (!s.rf) return;
    var scene = s._curScene || 'A';
    var folder = s.f || '01';
    var callId = ++_pvCallId;
    var p = { roomId: s.rf, scene: scene, folder: folder, material_id: mid };
    try {
        var d = await apiPost('/api/rooms/' + encodeURIComponent(s.rf) + '/preview',
            { scene: scene, folder: folder, material_id: mid });
        p.filename = d.filename || _roomMatName(mid);
        p.win_name = (d.target && d.target.winName) || '';
    } catch (err) {
        // 失败不静默、也不两秒消失：这条链路的教训就是"红字闪一下 + 不进操作记录"能把坏接口藏半年
        p.err = err.message;
    }
    if (callId !== _pvCallId) return;   // 已经有更晚的一次单击接管，旧响应不许覆盖状态条
    s._preview = p;
    refreshPvBar();
    refreshPvCards();
}

async function stopPv() {
    var p = _pvHere();
    if (!p) return;
    var url = '/api/rooms/' + encodeURIComponent(s.rf) + '/preview/stop';
    try {
        await apiPost(url, { scene: p.scene, folder: p.folder });
    } catch (err) {
        // 最常见的是 409"这一格已解析不到窗口"（配置刚改过）—— 那就直接用兜底键全停；
        // 第二条也失败才把错报出来（取第二次的消息，那才是真正拦住请求的原因）
        try { await apiPost(url, {}); }
        catch (err2) {
            s._preview = { roomId: s.rf, err: err2.message };
            refreshPvBar();
            refreshPvCards();
            return;
        }
    }
    s._preview = null;
    refreshPvBar();
    refreshPvCards();
}

// 【F-11】 客户/店铺 & 房间两级 Tab // function rd()
// rd() 画两行 tab：上排店铺（点 sd 切店 / 右键 rs 改名 / × 删店 ds），下排房间（点 sr 选房 / 右键 rr 改名 / × 删房 dr）。
// 状态口径：当前店铺 = s.df（并写 localStorage('xstore')），当前房间 = s.rf；渲染完若有选中房间就交给 rmDevice() 画工作区。
function rd() {
    var g = document.getElementById('dg');
    if (!s.df && s.stores.length > 0) s.df = s.stores[0];
    var h = '<div class="tabs">';
    s.stores.forEach(function(sn) {
        var act = s.df === sn ? 'active' : '';
        var det = (s.storeDetails || []).find(function(x) { return x.name === sn; });
        var tip = det ? (det.room_count + ' 个房间 · ' + det.device_count + ' 台设备') : '';
        h += '<div class="tab ' + act + '" title="' + escA(tip) + '" onclick="sd(\'' + escJsA(sn) + '\')" oncontextmenu="rs(event,\'' + escJsA(sn) + '\');return false;"><span class="tab-n">' + esc(sn) + '</span><span class="folder-del" title="删除这个店铺" onclick="ds(event,\'' + escJsA(sn) + '\')">×</span></div>';
    });
    h += '<div class="tab" title="新建店铺" onclick="as()" style="border-style:dashed">+</div></div>';
    h += '<div class="tabs" style="margin-top:10px">';
    s.rooms.forEach(function(rn) {
        var act = s.rf === rn.id ? 'active' : '';
        h += '<div class="tab ' + act + '" data-room="' + escA(rn.id) + '" onclick="sr(\'' + escJsA(rn.id) + '\')" oncontextmenu="rr(event,\'' + escJsA(rn.id) + '\',\'' + escJsA(rn.name) + '\');return false;"><span class="tab-n">' + esc(rn.name) + '</span><span class="folder-del" title="删除这个房间" onclick="dr(event,\'' + escJsA(rn.id) + '\')">×</span></div>';
    });
    h += '<div class="tab" title="新建房间" onclick="createRoom()" style="border-style:dashed">+</div></div>';
    document.getElementById('df').innerHTML = h;
    applyRoomDots();
    if (!s._roomDotTimer) { s._roomDotTimer = setInterval(refreshRoomDots, 30000); refreshRoomDots(); }
    if (s.rf) { rmDevice(); return; }
    g.innerHTML = '<div class="empty">请选择或创建房间</div><button class="btn btn-primary" style="margin-top:10px" onclick="createRoom()">+ 新建房间</button>';
}

// 房间 tab 右上角在线小绿点：该房任一设备在线即亮。
// 设备状态只在 /api/devices 里（心跳刷 status），30s 一轮；只增删点、不重画 tab，避免打断点击与悬停。
async function refreshRoomDots() {
    var list;
    try { list = asList(await apiGet('/api/devices')); }
    catch (e) { console.error('房间在线状态读取失败:', e.message); return; }
    var map = {};
    list.forEach(function(d) { if (d.status === 'online' && d.room_id) map[d.room_id] = true; });
    s._roomOnline = map;
    applyRoomDots();
}

function applyRoomDots() {
    var tabs = document.querySelectorAll('#df .tab[data-room]');
    for (var i = 0; i < tabs.length; i++) {
        var el = tabs[i];
        var on = !!(s._roomOnline && s._roomOnline[el.getAttribute('data-room')]);
        var dot = el.querySelector('.room-dot');
        if (on && !dot) {
            dot = document.createElement('span');
            dot.className = 'room-dot';
            el.appendChild(dot);
        } else if (!on && dot) {
            dot.parentNode.removeChild(dot);
        }
    }
}

function sd(store) {
    s.df = store;
    localStorage.setItem('xstore', store);
    s.rf = '';
    rd();
    lr();
}

function as() {
    inputModal('新建客户', '输入客户/店铺名称', '', function(n) {
        if (!n) return;
        fetch('/api/stores', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: n})
        }).then(function(r) { return r.json().then(function(d) { return {ok: r.ok, d: d}; }); })
        .then(function(ret) {
            if (!ret.ok) { alert('创建失败: ' + (ret.d.error || '未知错误')); return; }
            if (ret.d.existed) alert('店铺已存在，已选中');
            loadStores().then(function() { sd(n); });
        }).catch(function(err) { alert('创建失败: ' + err.message); });
    });
}

function ds(e, store) {
    e.stopPropagation();
    if (!confirm('删除店铺 ' + store + '?')) return;
    fetch('/api/stores/' + encodeURIComponent(store), {method: 'DELETE'})
    .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, d: d}; }); })
    .then(function(ret) {
        if (!ret.ok) { alert(ret.d.error || '删除失败'); return; }
        loadStores().then(function() {
            if (s.df === store) {
                s.df = s.stores[0] || '';
                localStorage.setItem('xstore', s.df);
                s.rf = '';
                lr();
            }
            rmDevice();
        });
    }).catch(function(err) { alert('删除失败: ' + err.message); });
}

// 【F-07】 推送弹窗 // async function showPushDialog()
// ==================== 推送 ====================
async function showPushDialog() {
    console.log('showPushDialog called, selected:', s.selected);
    if (!s.selected || s.selected.length === 0) { alert('请先勾选要推送的素材'); return; }
    // 只保留有效 UUID/preset ID，过滤掉无效残留值
    s.pushMs = s.ms.filter(function(x) {
        return s.selected.includes(x.id) && x.id && x.id.length > 5;
    });
    console.log('pushMs:', s.pushMs);
    var h = '<div style="padding:24px;min-width:500px;font-size:var(--fs-title)"><h3 style="font-size:var(--fs-icon)">推送到房间</h3><p style="color:#888;margin:10px 0">已选' + s.pushMs.length + '个素材（按原文件夹归属）</p>';
    // 店铺选择
    h += '<div style="margin-bottom:15px"><label style="color:#e94560;font-weight:bold;font-size:var(--fs-h2)">选择店铺：</label>';
    h += '<select id="pushStore" style="padding:12px;background:#333;color:#fff;border:1px solid #555;border-radius:4px;width:100%;margin-top:5px;font-size:var(--fs-body)" onchange="loadPushRooms()">';
    if (s.stores && s.stores.length > 0) {
        s.stores.forEach(function(store) {
            h += '<option value="' + escA(store) + '">' + esc(store) + '</option>';
        });
    } else {
        h += '<option value="">无可用店铺</option>';
    }
    h += '</select></div>';
    // 场景选择（A/B）
    h += '<div style="margin-bottom:15px"><label style="color:#e94560;font-weight:bold;font-size:var(--fs-h2);display:block;margin-bottom:8px">目标场景：</label>';
    h += '<div id="pushSceneSel" style="display:flex;gap:10px">';
    h += '<button class="folder-btn active" id="pushSceneA" onclick="selectPushScene(\'A\')" style="flex:1;padding:10px 0;font-size:var(--fs-body);border-radius:6px">第一幕</button>';
    h += '<button class="folder-btn" id="pushSceneB" onclick="selectPushScene(\'B\')" style="flex:1;padding:10px 0;font-size:var(--fs-body);border-radius:6px">第二幕</button>';
    h += '</div></div>';
    h += '<div id="pushRoomsDiv"><p style="color:#888">加载中...</p></div>';
    openModal(h);
    // 加载房间
    loadPushRooms();
}

var _pushScene = 'A'; // 默认推送到第一幕

function selectPushScene(scene) {
    _pushScene = scene;
    document.getElementById('pushSceneA').classList.toggle('active', scene === 'A');
    document.getElementById('pushSceneB').classList.toggle('active', scene === 'B');
}

async function loadPushRooms() {
    var store = document.getElementById('pushStore').value;
    var div = document.getElementById('pushRoomsDiv');
    if (!store) { div.innerHTML = '<p>请先选择店铺</p>'; return; }
    try {
        var r = await fetch('/api/rooms?store=' + encodeURIComponent(store));
        var rooms = await r.json();
        if (!r.ok || !Array.isArray(rooms)) { div.innerHTML = '<p>加载房间失败：' + esc((rooms && rooms.error) || ('HTTP ' + r.status)) + '</p>'; return; }
        if (rooms.length === 0) { div.innerHTML = '<p>该店铺暂无房间，请先创建房间</p>'; return; }
        // 只存弹窗自己的副本：以前这里写 s.rooms，等于把"全局房间列表"换成了"本店铺房间列表"，
        // 弹窗还开着时任何读 s.rooms 的代码（工作台/设备列表回写）都会找不到别的房间
        _pushRooms = rooms;
        var h = '<div><label style="color:#e94560;font-weight:bold;font-size:var(--fs-h2)">选择房间（可多选）：</label></div>';
        rooms.forEach(function(room) {
            h += '<label style="display:block;padding:14px;border:1px solid #444;margin:8px 0;border-radius:4px;cursor:pointer;background:#2a2a2a;font-size:var(--fs-body)">';
            h += '<input type="checkbox" class="room-check" value="' + escA(room.id) + '" data-name="' + escA(room.name) + '" style="margin-right:10px;width:18px;height:18px">';
            h += '<span>' + esc(room.name) + '</span>';
            h += '</label>';
        });
        h += '<div style="margin-top:20px"><button class="btn btn-primary" onclick="doPushToRoom()">确认推送</button> <button class="btn" onclick="closeModal()">取消</button></div>';
        div.innerHTML = h;
    } catch(e) {
        console.error('Error loading rooms:', e);
        div.innerHTML = '<p>加载房间失败</p>';
    }
}

var _pushRooms = [];   // 推送弹窗本次列出的房间（只用于回显名字，不碰全局 s.rooms）

async function doPushToRoom() {
    var checks = document.querySelectorAll('.room-check:checked');
    if (checks.length === 0) { alert('请至少选择一个房间'); return; }
    var roomIds = Array.from(checks).map(function(c) { return c.value; });
    // 推送是「现拉整份 config → 只改 folder_mappings → 全量 PUT」，本机还压在防抖队列里的
    // 窗口编辑若没先落库，就会被这份旧 windows 覆盖 —— 先等它写完（队列只涉及当前房间，一次就够）。
    await flushAutoSync();
    var totalCount = 0;
    var scene = _pushScene; // 'A' 或 'B'
    var doneIds = [];
    var failed = [];
    // 逐房间独立：一只房间读/写失败（404、网络断、config 是脏 JSON）不能把后面的带走，
    // 更不能照样弹"已推送到 N 个房间"——那是把没落地的操作报成成功。
    for (var i = 0; i < roomIds.length; i++) {
        var roomId = roomIds[i];
        try {
            // 获取房间当前完整配置（包含 scenes 结构）
            var ro = await fetch('/api/rooms/' + encodeURIComponent(roomId));
            var roomObj = await ro.json().catch(function() { return {}; });
            if (!ro.ok || !roomObj) { failed.push(roomId + '（读取失败 HTTP ' + ro.status + '）'); continue; }
            var config = _loadRoomCfg(roomObj);
            if (!roomObj.config) {
                // 老数据：config 为空才从 folders 列兜一份 A 幕映射出来
                var legacy = {};
                try { legacy = roomObj.folder_mappings ? (typeof roomObj.folder_mappings === 'string' ? JSON.parse(roomObj.folder_mappings) : roomObj.folder_mappings) : {}; } catch (e2) { legacy = {}; }
                config.scenes.A.folder_mappings = (legacy && typeof legacy === 'object' && !Array.isArray(legacy)) ? legacy : {};
                config.scenes.A.windows = Array.isArray(config.windows) ? config.windows : [];
                delete config.windows;
            }
            var folderMs = config.scenes[scene].folder_mappings;
            var added = 0;
            // 添加素材ID到对应文件夹（按原文件夹归属，去重）
            s.pushMs.forEach(function(mat) {
                var folder = mat.folder || '01';
                if (!folderMs[folder]) folderMs[folder] = [];
                // 检查ID或URL是否已存在（同时检查素材库和预设库）
                var exists = folderMs[folder].some(function(existingId) {
                    var materialInMs = s.ms ? s.ms.find(function(x) { return x.id === existingId; }) : null;
                    var materialInPm = s.pm ? s.pm.find(function(x) { return x.id === existingId; }) : null;
                    return existingId === mat.id ||
                           (materialInMs && materialInMs.url === mat.url) ||
                           (materialInPm && materialInPm.url === mat.url);
                });
                if (!exists) { folderMs[folder].push(mat.id); added++; }
            });
            // 更新目标场景的 folder_mappings，然后保存完整 config
            config.scenes[scene].folder_mappings = folderMs;
            var put = await fetch('/api/rooms/' + encodeURIComponent(roomId), {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({config: JSON.stringify(config)})
            });
            var putJson = await put.json().catch(function() { return {}; });
            if (!put.ok || !putJson.success) { failed.push(roomId + '（保存失败：' + (putJson.error || ('HTTP ' + put.status)) + '）'); continue; }
            doneIds.push(roomId);
            totalCount += added;
            // 不用再补 POST /sync：PUT /api/rooms/:id 落库后经服务端收敛点比对配置指纹，
            // 映射真的变了才给该房间已授权设备发 sync_room_materials（以前一轮推送要通知三遍）
        } catch (e) {
            failed.push(roomId + '（' + e.message + '）');
        }
    }
    var summary = '已推送到 ' + doneIds.length + ' 个房间（' + (scene === 'A' ? '第一幕' : '第二幕') + '），共' + totalCount + '个素材，已通知设备同步';
    if (failed.length > 0) summary += '\n\n失败 ' + failed.length + ' 个：\n' + failed.join('\n');
    alert(summary);
    closeModal();
    // 刷新当前显示
    if (s.df) lr();
    // 记录操作日志（只记真的落库成功的那些房间）
    var pushStore = document.getElementById('pushStore') ? document.getElementById('pushStore').value : '';
    var roomNames = doneIds.map(function(rid) {
        var r = _pushRooms.find(function(x) { return x.id === rid; });
        if (r && r.name) return r.name;
        var cb = document.querySelector('.room-check[value="' + rid + '"]');
        return cb && cb.getAttribute('data-name') ? cb.getAttribute('data-name') : rid;
    });
    logAction('push', 'room', {
        room_ids: doneIds, room_names: roomNames, store_name: pushStore,
        material_ids: s.pushMs.map(function(mat) { return mat.id; }),
        material_names: s.pushMs.map(function(mat) { return mat.filename || mat.name; }),
        total: totalCount,
        failed: failed.length ? failed : undefined,
        scene: scene,
        scene_name: scene === 'A' ? '第一幕' : '第二幕'
    });
}

document.onkeydown = function(e) { if (e.key === 'Escape') { closeModal(); } };

// 通用输入弹窗（替代原生 prompt，避免被浏览器拦截）
function inputModal(title, placeholder, defaultValue, cb) {
    var h = '<div style="padding:24px;min-width:360px"><h3 style="font-size:var(--fs-h1);margin-bottom:14px">' + esc(title) + '</h3>';
    h += '<input id="imInput" type="text" value="' + escA(defaultValue || '') + '" placeholder="' + escA(placeholder || '') + '" style="width:100%;padding:12px;background:#333;color:#fff;border:1px solid #555;border-radius:4px;font-size:var(--fs-body);box-sizing:border-box">';
    h += '<div style="margin-top:18px;text-align:right"><button class="btn" onclick="closeModal()">取消</button> <button class="btn btn-primary" id="imOk">确定</button></div></div>';
    openModal(h);
    var inp = document.getElementById('imInput');
    inp.focus();
    inp.select();
    var done = false;
    var ok = function() {
        if (done) return;
        done = true;
        var v = inp.value.trim();
        closeModal();
        cb(v);
    };
    document.getElementById('imOk').onclick = ok;
    inp.onkeydown = function(e) { if (e.key === 'Enter') ok(); };
}

/**
 * 通用确认弹窗（替代原生 confirm，差别在于能带结构化明细）。
 * bodyHtml 由调用方拼好，**里面每个变量都得调用方自己 esc()**：这里再转一次会把
 * 已经转过的 &amp; 变成 &amp;amp;，页面上就露出裸转义串。
 * Esc / 点取消都不会触发 cb，与 confirm 返回 false 同义。
 */
function confirmModal(title, bodyHtml, okText, cb) {
    var h = '<div style="padding:24px;min-width:380px;max-width:600px"><h3 style="font-size:var(--fs-h2);margin-bottom:12px">' + esc(title) + '</h3>';
    h += '<div style="font-size:var(--fs-dense);color:#ccc;line-height:1.75">' + bodyHtml + '</div>';
    h += '<div style="margin-top:18px;text-align:right"><button class="btn" onclick="closeModal()">取消</button> <button class="btn btn-primary" id="cmOk">' + esc(okText || '确定') + '</button></div></div>';
    openModal(h);
    var done = false;
    document.getElementById('cmOk').onclick = function() {

async function uv() {

// 【F-04c】 设备手动命令（设备列表卡片上的 stop / 强制对账 / 重推素材）
/**
 * 手动给一台设备下发命令（POST /api/devices/:id/command，action 由服务端 DEVICE_ACTIONS 白名单把关）。
 * 语义要说清楚：这里只代表 broker 收下了这条命令，不代表设备执行完了 ——
 * 回报要去设备日志页看。命令不走 retain，设备此刻不在线就等于丢掉，所以离线先确认一次。
 */
async function sendDeviceCommand(id, action, label, online) {
    if (!online && !confirm(label + '：设备当前离线，命令不会补发（只在此刻在线才收得到）。仍要发送？')) return;
    try {
        await apiPost('/api/devices/' + encodeURIComponent(id) + '/command', { command: { action: action } });
        openModal('<div style="padding:30px;text-align:center;color:#4caf50">✅ ' + esc(label) + '：命令已下发，等设备回报（见设备日志页）</div>');
        autoCloseModal(2000);
    } catch (e) {
        alert(label + ' 下发失败: ' + e.message);
    }
}

// 【F-04e】 重启设备（设备卡片上的「重启设备」按钮，设备侧 root reboot）
/**
 * 与 sendDeviceCommand 的差别：这条命令的结果是设备整机重启、下线几十秒，属于现场可感知的中断，
 * 所以下发前必须确认一次（离线则直接不发 —— 命令不 retain，离线收不到也没有补发）。
 * 200 只代表 broker 收下了；设备是否真重启，看心跳断开再回来、以及设备日志里那行 REBOOT。
 */
async function rebootDevice(id, online) {
    if (!online) { alert('设备离线，重启命令收发不到（不补发），先让现场把机器开机联网'); return; }
    if (!confirm('确定重启这台设备？\n\n画面会中断，设备约 30~60 秒后自动开机、回到播放（开机自启 + 默认桌面已是 XVJ）。')) return;
    try {
        await apiPost('/api/devices/' + encodeURIComponent(id) + '/command', { command: { action: 'reboot' } });
        openModal('<div style="padding:30px;text-align:center;color:#ffb74d">重启命令已下发<br><span style="font-size:var(--fs-micro)">设备即将下线，约 30~60 秒后自动回到播放；心跳恢复后设备卡片会变回在线</span></div>');
        autoCloseModal(3200);
    } catch (e) {
        alert('重启命令下发失败: ' + e.message);
    }
}

// 【F-04d】 实时截图（设备卡片上的「实时截图」按钮，链路见云端【S-15】）
/**
 * 点一下 ⇒ POST action:'screenshot' ⇒ 服务端给这台设备配一张一次性上传令牌 ⇒ 设备截屏后把 JPEG
 * POST 回来 ⇒ 这里轮询读图接口，看到 ts 比按下之前新，就把图显示进弹层。
 * 两个口径必须说清，否则很容易误判成功：
 *  - 命令 200 只代表 broker 收下了，图是设备**主动传**上来的，这条链路没有回执，只能等；
 *  - 离线直接拒、不发命令：令牌 60 秒过期，发给离线设备等于让人白等 25 秒，
 *    所以这里和 sendDeviceCommand 的「确认了照样发」不同 —— 那条命令是给以后用的，这张图只在当下有用。
 */
var _shotTimer = null;
function shotPollStop() { if (_shotTimer) { clearTimeout(_shotTimer); _shotTimer = null; } }
async function deviceScreenshot(id, online) {
    shotPollStop();
    if (!online) {
        openModal('<div style="padding:30px;text-align:center;color:#ffb74d">设备离线，截图命令收发不到（不补发），先让现场把机器开机联网</div>');
        autoCloseModal(2600);
        return;
    }
    var url = '/api/devices/' + encodeURIComponent(id);
    var prevTs = 0;
    try {
        var old = await apiGet(url + '/screenshot');
        if (old && old.available) prevTs = old.ts || 0;
    } catch (e) { /* 拿不到旧图只影响"是否算新"这一条判断，继续发命令 */ }
    try {
        await apiPost(url + '/command', { command: { action: 'screenshot' } });
    } catch (e) {
        alert('截图命令下发失败: ' + e.message);
        return;
    }
    var waitHtml = '<div style="padding:34px;text-align:center;color:#aaa">⏳ 正在抓取设备画面…<br>'
        + '<span style="font-size:var(--fs-micro)">设备收到命令后截屏、压缩再传上来，一般几秒；超过 25 秒没到就是没传，去设备日志页看原因</span></div>';
    openModal(waitHtml);
    var deadline = Date.now() + 25000;
    var tick = async function () {
        _shotTimer = null;
        var box = document.getElementById('m');
        if (!box || !box.classList.contains('show')) return;   // 弹层已被关掉，别再问了
        if (Date.now() > deadline) {
            setMc('<div style="padding:34px;text-align:center;color:#ffb74d">25 秒内没等到图<br>'
                + '<span style="font-size:var(--fs-micro)">设备没 root、进程被杀收不到命令、或抓屏/上传失败 —— 都在设备日志页里留了话</span></div>');
            return;
        }
        try {
            var m = await apiGet(url + '/screenshot');
            if (m && m.available && (m.ts || 0) > prevTs) {
                // ?t= 让浏览器把它当新地址（服务端本来就 no-store，这一下是防中间任何一层缓存）
                setMc('<div style="padding:10px">'
                    + '<img src="' + url + '/screenshot.jpg?t=' + m.ts + '" alt="设备实时截图" '
                    + 'style="max-width:100%;max-height:68vh;display:block;margin:0 auto;border:1px solid #333;border-radius:4px">'
                    + '<div style="color:#888;font-size:var(--fs-micro);text-align:center;margin-top:8px">'
                    + '抓取于 ' + esc(new Date(m.ts).toLocaleString()) + ' · ' + Math.round((m.bytes || 0) / 1024) + ' KB'
                    + ' · 点一下拿一张，不是实时视频；图不落盘、两分钟后自动没，要再看就再点一次</div></div>');
                return;
            }
        } catch (e) { /* 单次轮询失败下一轮再试 */ }
        _shotTimer = setTimeout(tick, 1000);
    };
    _shotTimer = setTimeout(tick, 1200);
}
